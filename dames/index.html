<script>
"use strict";
/* ================= RÈGLES : dames françaises 10x10 ================= */
// plateau : tableau de 100, 0 vide, 1 pion blanc, 2 dame blanche, -1 pion noir, -2 dame noire. Blancs en bas, jouent en premier.
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];
const ins=(r,c)=>r>=0&&r<10&&c>=0&&c<10;
function startBoard(){const b=Array(100).fill(0);for(let r=0;r<10;r++)for(let c=0;c<10;c++)if((r+c)%2===1){if(r<4)b[r*10+c]=-1;else if(r>5)b[r*10+c]=1;}return b;}
function capsFrom(b,s,side,king){
  const out=[];const r0=(s/10)|0,c0=s%10;
  const work=b.slice();work[s]=0;const taken=new Set();
  (function dfs(r,c,path,caps){
    let any=false;
    for(const [dr,dc] of DIRS){
      let rr=r+dr,cc=c+dc;
      if(king)while(ins(rr,cc)&&work[rr*10+cc]===0){rr+=dr;cc+=dc;}
      if(!ins(rr,cc))continue;
      const q=rr*10+cc,v=work[q];
      if(v===0||Math.sign(v)===side||taken.has(q))continue;
      let lr=rr+dr,lc=cc+dc;
      if(!ins(lr,lc)||work[lr*10+lc]!==0)continue;
      taken.add(q);
      const lands=[];
      do{lands.push([lr,lc]);lr+=dr;lc+=dc;}while(king&&ins(lr,lc)&&work[lr*10+lc]===0);
      if(!king)lands.length=1;
      for(const [a,bb] of lands){any=true;dfs(a,bb,path.concat(a*10+bb),caps.concat(q));}
      taken.delete(q);
    }
    if(!any&&caps.length)out.push({path:[s].concat(path),caps});
  })(r0,c0,[],[]);
  return out;
}
function genMoves(b,side){
  let caps=[];
  for(let s=0;s<100;s++){const v=b[s];if(v&&Math.sign(v)===side)caps=caps.concat(capsFrom(b,s,side,Math.abs(v)===2));}
  if(caps.length){const mx=Math.max(...caps.map(m=>m.caps.length));return caps.filter(m=>m.caps.length===mx);}
  const res=[];
  for(let s=0;s<100;s++){const v=b[s];if(!v||Math.sign(v)!==side)continue;const r=(s/10)|0,c=s%10,king=Math.abs(v)===2;
    for(const [dr,dc] of DIRS){
      if(!king&&dr!==-side)continue;
      let rr=r+dr,cc=c+dc;
      while(ins(rr,cc)&&b[rr*10+cc]===0){res.push({path:[s,rr*10+cc],caps:[]});if(!king)break;rr+=dr;cc+=dc;}
    }}
  return res;
}
function applyMove(b,m,side){
  const n=b.slice(),s=m.path[0],e=m.path[m.path.length-1];let v=n[s];n[s]=0;m.caps.forEach(q=>n[q]=0);
  const r=(e/10)|0;if(Math.abs(v)===1&&((side===1&&r===0)||(side===-1&&r===9)))v=2*side;
  n[e]=v;return n;
}
/* ================= IA ================= */
function evalB(b){let t=0;for(let s=0;s<100;s++){const v=b[s];if(!v)continue;const r=(s/10)|0,c=s%10,sg=Math.sign(v);
  if(Math.abs(v)===2)t+=sg*320;else{const adv=sg===1?9-r:r;t+=sg*(100+adv*4+(c>=3&&c<=6?3:0));}
  }return t;}
function search(b,side,depth,alpha,beta){
  const ms=genMoves(b,side);
  if(!ms.length)return -99999-depth;
  if(depth===0)return side*evalB(b);
  ms.sort((x,y)=>y.caps.length-x.caps.length);
  let best=-Infinity;
  for(const m of ms){const v=-search(applyMove(b,m,side),-side,depth-1,-beta,-alpha);if(v>best)best=v;if(best>alpha)alpha=best;if(alpha>=beta)break;}
  return best;
}
function aiMove(b,side,level){
  const ms=genMoves(b,side);if(!ms.length)return null;
  if(ms.length===1)return ms[0];
  const depth=[1,3,5][level]||3;let best=[],bv=-Infinity;
  for(const m of ms){let v=-search(applyMove(b,m,side),-side,depth-1,-Infinity,Infinity);if(level===0)v+=Math.random()*60;else v+=Math.random()*2;
    if(v>bv+0.001){bv=v;best=[m];}else if(Math.abs(v-bv)<=0.001)best.push(m);}
  return best[(Math.random()*best.length)|0];
}
/* ================= Partie ================= */
class Game{
  constructor(){this.b=startBoard();this.turn=1;this.over=false;this.winner=0;this.reason='';this.last=[];this.np=0;this.hist=[];}
  state(){return {b:this.b,turn:this.turn,over:this.over,winner:this.winner,reason:this.reason,last:this.last};}
  legal(){return this.over?[]:genMoves(this.b,this.turn);}
  play(path){
    const m=this.legal().find(x=>x.path.length===path.length&&x.path.every((p,i)=>p===path[i]));
    if(!m)return false;
    this.hist.push({b:this.b,turn:this.turn,np:this.np,last:this.last});
    const mover=this.b[m.path[0]];
    this.b=applyMove(this.b,m,this.turn);
    this.np=(Math.abs(mover)===2&&!m.caps.length)?this.np+1:0;
    this.last=[m.path[0],m.path[m.path.length-1]];
    this.turn=-this.turn;
    if(!genMoves(this.b,this.turn).length){this.over=true;this.winner=-this.turn;this.reason='plus de coup possible';}
    else if(this.np>=50){this.over=true;this.winner=0;this.reason='25 coups de dames sans prise';}
    return true;
  }
  undo(){const h=this.hist.pop();if(!h)return;this.b=h.b;this.turn=h.turn;this.np=h.np;this.last=h.last;this.over=false;this.winner=0;}
}
class FakeConn{
  constructor(ch,me,other,isHost){this.ch=ch;this.me=me;this.other=other;this.h={};this.open=false;this.peer=other;
    ch.addEventListener('message',e=>{const m=e.data;if(m.to!==me||m.from!==other)return;
      if(m.k==='data')this.h.data&&this.h.data(JSON.parse(JSON.stringify(m.d)));
      if(m.k==='close')this.h.close&&this.h.close();
      if(m.k==='open'&&!this.open){this.open=true;this.h.open&&this.h.open();this.ch.postMessage({k:'ack',from:me,to:other});}
      if(m.k==='ack'&&!this.open){this.open=true;this.h.open&&this.h.open();}});}
  on(n,f){this.h[n]=f;}
  send(d){this.ch.postMessage({k:'data',from:this.me,to:this.other,d:JSON.parse(JSON.stringify(d))});}
  close(){this.ch.postMessage({k:'close',from:this.me,to:this.other});}
}
class FakePeer{
  constructor(id){this.id=id||('c'+Math.random().toString(36).slice(2,8));this.ch=new BroadcastChannel('dames-fake');this.h={};
    this.ch.addEventListener('message',e=>{const m=e.data;if(m.to===this.id&&m.k==='hello'){const c=new FakeConn(this.ch,this.id,m.from,true);c.open=false;this.h.connection&&this.h.connection(c);c.ch.postMessage({k:'open',from:this.id,to:m.from});}});
    setTimeout(()=>this.h.open&&this.h.open(this.id),20);}
  on(n,f){this.h[n]=f;}
  connect(id){const c=new FakeConn(this.ch,this.id,id,false);setTimeout(()=>this.ch.postMessage({k:'hello',from:this.id,to:id}),30);return c;}
  destroy(){}
}
function mkPeer(id){
  if(/net=bc/.test(location.search))return new FakePeer(id);
  if(!window.Peer)throw new Error('La bibliothèque de connexion n’a pas pu se charger (es-tu connecté à Internet ?).');
  const cfg={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return id?new Peer(id,cfg):new Peer(cfg);
}

const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>CHARS[(Math.random()*CHARS.length)|0]).join('');

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='dames-v1';
const WK='cartes-v1';
function wal(){let j=null;try{j=JSON.parse(localStorage.getItem(WK)||'null');}catch(e){}if(!j)j={v:1,gems:20,own:{back:[0],court:[0],bg:[0]},sel:{back:0,court:0,bg:0},st:{sol:{p:0,w:0,best:0},fc:{p:0,w:0,best:0}},opt:{draw:3,snd:true}};if(typeof j.gems!=='number')j.gems=20;return j;}
function addGems(n){const j=wal();j.gems+=n;try{localStorage.setItem(WK,JSON.stringify(j));}catch(e){}gmUpdate();return j.gems;}
function gmUpdate(){$('gm').textContent=wal().gems+' 💎';}
let P={name:'',code:'',level:1,theme:0};try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const saveP=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};

 {n:'Classique',l:'#f0d9b5',d:'#b58863'},

 {n:'Dragons et licornes',dir:'dragons',pc:1,l:'#e8e0f4',d:'#6a4fa0'},
 {n:'Venise',dir:'venise',pc:1,l:'#f3e3c6',d:'#a8324a'},

 {n:'Japon',dir:'japon',pc:1,l:'#f7e8e8',d:'#b03a48'},

 {n:'Baroque',dir:'baroque',pc:1,l:'#f0e2b8',d:'#7a5a2a'},
 {n:'Art déco',dir:'deco',pc:1,l:'#efe6cf',d:'#1f4a4a'},
 {n:'Royaume enchanté',dir:'fee',pc:1,l:'#f6e6f2',d:'#8a5ab0'},
 {n:'Steampunk',dir:'steampunk',pc:1,l:'#e6d3a8',d:'#5a3a22'},
 {n:'Monde des fées',dir:'feesbois',pc:1,l:'#e4f0d4',d:'#4a8a5a'},
 {n:'Aventuriers des mers',dir:'marins',pc:1,l:'#f1e4c4',d:'#1f5f8a'}
];
function cur(){return SETS[P.theme]||SETS[0];}
function pieceDiv(p){const t=cur(),k=Math.abs(p)===2,w=p>0;
  if(t.pc){const f=(w?'d_w':'d_b')+(k&&!t.nk?'k':'');return '<div class="p img '+(w?'w':'b')+'" style="background-image:url(../cartes-img/'+t.dir+'/'+f+'.webp)">'+(k&&t.nk?'<i>♛</i>':'')+'</div>';}
  return '<div class="p '+(w?'w':'b')+(k?' k':'')+'">'+(k?'♛':'')+'</div>';}
function applyTheme(){const t=cur();const st=document.documentElement.style;st.setProperty('--l',t.l);st.setProperty('--d',t.d);
 document.body.style.backgroundImage=t.dir?'linear-gradient(#0009,#0007),url(../cartes-img/'+t.dir+'/bg1.webp)':'none';document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center';document.body.style.backgroundAttachment='fixed';}
function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2400);}

let mode='home',G=null,view=null,my=1,kind='solo',peer=null,conn=null,roomCode='',sel=-1,busy=false,names={1:'Toi','-1':'Ordinateur'},guestName='';
function openOv(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').hidden=false;}

  leave();show('home');
  $('home').innerHTML='<img class="hero" src="icons/icon-192.png" alt=""><h1>Dames</h1><p class="muted">Dames françaises 10×10, sans publicité. Joue contre l’ordinateur ou avec un ami grâce à un code.</p>'+
   '<input id="nm" maxlength="12" placeholder="Ton prénom" value="'+esc(P.name)+'">'+
   '<div class="tabs"><span>Niveau :</span>'+['Facile','Moyen','Fort'].map((n,i)=>'<button data-l="'+i+'" class="'+(P.level===i?'on':'')+'">'+n+'</button>').join('')+'</div>'+
   '<button class="ob" id="solo">Jouer contre l’ordinateur</button>'+
   '<button class="ob alt" id="host">Créer une partie en ligne</button>'+
   '<div class="join"><input id="cd" maxlength="4" placeholder="CODE" value="'+esc(P.code)+'" aria-label="Code de la partie" autocapitalize="characters"><button class="ob alt" id="joinB">Rejoindre</button></div>'+

  const nm=()=>{const v=$('nm').value.trim().slice(0,12)||'Joueur';P.name=v;saveP();return v;};
  $('home').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{P.level=+b.dataset.l;saveP();showHome();});
  $('home').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{P.theme=+b.dataset.th;saveP();applyTheme();showHome();});
  $('solo').onclick=()=>startSolo(nm());
  $('host').onclick=()=>hostOnline(nm());
  $('joinB').onclick=()=>{const c=$('cd').value.trim().toUpperCase();if(c.length!==4)return toast('Le code a 4 caractères.');P.code=c;nm();joinOnline(nm(),c);};
}
function leave(){try{if(conn)conn.close();}catch(e){}try{if(peer)peer.destroy();}catch(e){}G=null;peer=null;conn=null;view=null;sel=-1;kind='solo';closeOv();}
/* ---- solo ---- */
function startSolo(name){endDialog.paid=0;leave();kind='solo';my=1;names={1:name,'-1':'Ordinateur'};G=new Game();show('game');push();}
function push(){view=G.state();render();if(kind==='host'&&conn&&conn.open)try{conn.send({t:'state',v:view,names});}catch(e){}if(kind==='solo')maybeAI();}
function maybeAI(){
  if(!G||G.over||G.turn===my||busy)return;busy=true;
  setTimeout(()=>{const g=G;if(!g){busy=false;return;}const m=aiMove(g.b,g.turn,P.level);busy=false;if(!m||g!==G)return;g.play(m.path);push();},450);
}
/* ---- en ligne : hôte (blancs) ---- */
function hostOnline(name){
  leave();kind='host';my=1;names={1:name,'-1':'…'};G=new Game();roomCode=genCode();
  show('lobby');$('lobby').innerHTML='<h2>Création de la partie…</h2>';
  const open=tries=>{
    try{peer=mkPeer('dames-'+roomCode);}catch(e){toast(e.message,5000);return showHome();}
    peer.on('open',()=>{$('lobby').innerHTML='<h2>Ta partie</h2><p class="muted">Donne ce code à ton ami (il le saisit dans « Rejoindre ») :</p><div class="code">'+roomCode+'</div><p class="muted">En attente de ton adversaire…<br>Tu joues les blancs et tu commences.</p><button class="ob alt" id="back">Annuler</button>';$('back').onclick=showHome;});
    peer.on('error',e=>{if(e.type==='unavailable-id'&&tries<5){roomCode=genCode();open(tries+1);}else{toast('Connexion impossible ('+(e.type||'erreur')+').',5000);if(mode==='lobby')showHome();}});
    peer.on('connection',c=>{
      if(conn&&conn.open){c.on('open',()=>{c.send({t:'full'});});return;}
      conn=c;
      c.on('data',m=>hostMsg(m));
      c.on('close',()=>{if(conn===c){conn=null;if(G&&!G.over){toast(names['-1']+' a quitté la partie.',4000);}}});
    });
  };
  open(0);
}
function hostMsg(m){
  if(m.t==='hello'){names['-1']=String(m.name||'Invité').slice(0,12);conn.send({t:'welcome'});if(mode==='lobby')show('game');push();}
  else if(m.t==='move'&&G&&!G.over&&G.turn===-1){if(G.play(m.path))push();else conn.send({t:'state',v:G.state(),names});}
  else if(m.t==='resign'&&G&&!G.over){G.over=true;G.winner=1;G.reason='abandon';push();}
  else if(m.t==='again'&&G&&G.over){newGameHost();}
}
function newGameHost(){G=new Game();closeOv();push();}
/* ---- en ligne : invité (noirs) ---- */
function joinOnline(name,code){
  leave();kind='guest';my=-1;show('lobby');$('lobby').innerHTML='<h2>Connexion…</h2><p class="muted">Recherche de la partie '+code+'</p><button class="ob alt" id="back">Annuler</button>';$('back').onclick=showHome;
  let opened=false;
  try{peer=mkPeer();}catch(e){toast(e.message,5000);return showHome();}
  const fail=m=>{if(mode==='lobby'||mode==='game'){toast(m,5000);showHome();}};
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Aucune partie avec ce code.':'Connexion impossible ('+(e.type||'erreur')+').'));
  peer.on('open',()=>{
    conn=peer.connect('dames-'+code,{reliable:true});
    conn.on('open',()=>{opened=true;conn.send({t:'hello',name});});
    conn.on('data',m=>{
      if(m.t==='full')fail('La partie est déjà complète.');
      else if(m.t==='state'){names=m.names||names;view=m.v;if(mode!=='game')show('game');if(!view.over)closeOv();render();}
    });
    conn.on('close',()=>{if(mode==='game'||mode==='lobby'){openOv('<h2>Connexion perdue</h2><p>Tu as été déconnecté de la partie.</p><button class="ob" id="rc">Se reconnecter</button><button class="ob alt" id="q">Quitter</button>');$('rc').onclick=()=>joinOnline(name,code);$('q').onclick=showHome;}});
  });
  setTimeout(()=>{if(!opened)fail('Impossible de joindre la partie. Vérifie le code et ta connexion.');},15000);
}
/* ---- affichage ---- */
function render(){
  if(!view)return;
  const v=view,flip=my===-1,bd=$('bd');
  const moves=(!v.over&&v.turn===my)?genMoves(v.b,my):[];
  const from=new Set(moves.map(m=>m.path[0]));
  const tgt=new Map();if(sel>=0)moves.filter(m=>m.path[0]===sel).forEach(m=>tgt.set(m.path[m.path.length-1],m));
  let h='';
  for(let i=0;i<100;i++){
    const s=flip?99-i:i,r=(s/10)|0,c=s%10,dark=(r+c)%2===1,p=v.b[s];
    let cl='c '+(dark?'d':'l');
    if(s===sel)cl+=' sel';if(v.last.includes(s))cl+=' lm';
    if(tgt.has(s))cl+=tgt.get(s).caps.length?' cp':' mv';
    h+='<div class="'+cl+'" data-s="'+s+'">'+(p?pieceDiv(p):'')+'</div>';
  }
  bd.innerHTML=h;
  bd.querySelectorAll('.c').forEach(el=>el.onclick=()=>tap(+el.dataset.s,moves,from,tgt));
  let st;
  if(v.over){st=v.winner===0?'Partie nulle ('+v.reason+')':(v.winner===my?'🎉 Tu as gagné !':'Tu as perdu…')+' ('+v.reason+')';}
  else if(v.turn===my){const caps=moves.some(m=>m.caps.length);st='À toi de jouer'+(caps?' — prise obligatoire':'');}
  else st='Tour de '+esc(names[v.turn]||'l’adversaire')+'…';
  $('st').innerHTML=st;
  $('undo').hidden=kind!=='solo';
  $('res').textContent=v.over?'Rejouer':'Abandonner';
  if(v.over&&!render.shown){render.shown=1;setTimeout(endDialog,500);}
  if(!v.over)render.shown=0;
}
function endDialog(){
  if(!view||!view.over||mode!=='game')return;
  const v=view,t=v.winner===0?'Partie nulle':v.winner===my?'🎉 Victoire !':'Défaite';
  let gain=0;if(kind==='solo'&&!endDialog.paid){endDialog.paid=1;gain=v.winner===my?[2,4,7][P.level]||2:v.winner===0?1:0;if(gain)addGems(gain);}
  const again=kind==='guest'?'<button class="ob" id="ag">Demander une revanche</button>':'<button class="ob" id="ag">Nouvelle partie</button>';
  openOv('<h2>'+t+'</h2><p class="muted">'+esc(v.reason)+'</p>'+(gain?'<p class="gold">+'+gain+' 💎</p>':'')+again+'<button class="ob alt" id="q">Menu</button>');
  $('ag').onclick=()=>{if(kind==='solo'){startSolo(names[1]);}else if(kind==='host'){newGameHost();}else{try{conn.send({t:'again'});}catch(e){}closeOv();toast('Revanche demandée…');}};
  $('q').onclick=showHome;
}
function tap(s,moves,from,tgt){
  if(!view||view.over||view.turn!==my)return;
  if(tgt.has(s)){const m=tgt.get(s);sel=-1;doMove(m.path);return;}
  if(from.has(s)){sel=(sel===s)?-1:s;render();return;}
  sel=-1;render();
}
function doMove(path){
  if(kind==='guest'){try{conn.send({t:'move',path});}catch(e){toast('Connexion perdue.');}
    // affichage immédiat côté invité
    const m=genMoves(view.b,my).find(x=>x.path.join()===path.join());if(m){view=Object.assign({},view,{b:applyMove(view.b,m,my),turn:-my,last:[path[0],path[path.length-1]]});render();}
    return;}
  G.play(path);push();
}
$('undo').onclick=()=>{if(kind!=='solo'||!G)return;busy=false;if(G.turn===my){G.undo();G.undo();}else{G.undo();}if(!G.hist.length&&G.turn!==my){}push();};
$('res').onclick=()=>{
  if(view&&view.over){endDialog();return;}
  openOv('<h2>Abandonner ?</h2><button class="ob" id="y">Oui, abandonner</button><button class="ob alt" id="n">Continuer</button>');
  $('n').onclick=closeOv;
  $('y').onclick=()=>{closeOv();if(kind==='guest'){try{conn.send({t:'resign'});}catch(e){}}else{G.over=true;G.winner=-my;G.reason='abandon';push();}};
};
function themesOv(){
  openOv('<h2>Thèmes</h2><div class="sgrid">'+SETS.map((t,i)=>'<div class="it'+(P.theme===i?' on':'')+'"><div class="pv" style="'+(t.dir?'background-image:url(../cartes-img/'+t.dir+'/bg1.webp)':'background:linear-gradient(135deg,'+t.l+' 50%,'+t.d+' 50%)')+'"></div><span>'+t.n+'</span>'+(P.theme===i?'<button class="no">Utilisé</button>':'<button data-th="'+i+'">Utiliser</button>')+'</div>').join('')+'</div><button class="ob alt" id="cl">Fermer</button>');
  $('ov').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{P.theme=+b.dataset.th;saveP();applyTheme();if(view)render();themesOv();});
  $('cl').onclick=closeOv;
}
$('bshop').onclick=themesOv;
const menuFn=()=>{if(view&&!view.over&&kind!=='solo'){openOv('<h2>Quitter la partie ?</h2><p class="muted">Ton adversaire sera prévenu.</p><button class="ob" id="y">Quitter</button><button class="ob alt" id="n">Rester</button>');$('n').onclick=closeOv;$('y').onclick=showHome;}else showHome();};
$('bmenu').onclick=menuFn;
applyTheme();gmUpdate();showHome();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script>/*UIKIT*/(function(){const ov=document.getElementById('ov');if(!ov||!window.MutationObserver)return;const mo=new MutationObserver(()=>{const d=ov.firstElementChild;if(!d||ov.hidden||d.querySelector('.mi')||!d.querySelector('h1,h2'))return;const i=new Image();i.src='icons/icon-192.png';i.className='mi';i.alt='';d.insertBefore(i,d.firstChild);});mo.observe(ov,{childList:true,attributes:true});})();</script>
</body>
