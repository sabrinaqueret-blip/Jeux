<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D1230">
<title>Mes jeux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#1D1230;--panel:#2E1C4D;--ink:#FFF3FA;--muted:#C2ADDD;--pink:#FF6FB5;--edge:#0E0719;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:24px 16px}
main{max-width:460px;margin:0 auto}
h1{color:var(--pink);margin:0 0 4px;font-size:30px}
p.s{color:var(--muted);margin:0 0 20px}
a.g{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:12px;background:var(--panel);border:2px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edge);color:var(--ink);text-decoration:none}
a.g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
a.g img{width:64px;height:64px;border-radius:14px;image-rendering:pixelated}
a.g b{display:block;font-size:19px}a.g span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Mes jeux</h1>
<p class="s">Sans pub, sans compte, hors ligne.</p>
<a class="g" href="rosine/"><img src="rosine/icons/icon-192.png" alt=""><div><b>Rosine la Lutine</b><span>Plateformes · 5 mondes, vélo, libellule, boutique</span></div></a>
<a class="g" href="sudoku/"><img src="sudoku/icons/icon-192.png" alt=""><div><b>Sudoku Expert</b><span>4 niveaux, indices, notes</span></div></a>
</main>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
