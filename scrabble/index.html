<script>
"use strict";
const $=id=>document.getElementById(id);

function wal(){let j=null;try{j=JSON.parse(localStorage.getItem(WK)||'null');}catch(e){}
  if(!j)j={v:1,gems:20,own:{}};if(!j.own)j.own={};if(!j.own[GAME])j.own[GAME]={};if(typeof j.gems!=='number')j.gems=20;return j;}
function walSave(j){try{localStorage.setItem(WK,JSON.stringify(j));}catch(e){}}

function gmUpdate(){$('gm').textContent=gems()+' 💎';}
function addGems(n){const j=wal();j.gems+=n;walSave(j);gmUpdate();return j.gems;}
function owned(c,i){return i===0||(wal().own[GAME][c]||[]).includes(i);}
const SK='scrabble-v1',GK='scrabble-game-v1';
let ST={level:1,sel:{},wins:0};try{ST=Object.assign(ST,JSON.parse(localStorage.getItem(SK)||'{}'));}catch(e){}
ST.sel=ST.sel||{};
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
function selc(c){const i=ST.sel[c]|0;return owned(c,i)?i:0;}
function openOv(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').hidden=false;}
function closeOv(){$('ov').hidden=true;}
function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2200);}
const BGS=[{n:'Nuit',p:0}].concat([['Alice','alice'],['Chats victoriens','chats'],['Renards des bois','renards'],['Dragons et licornes','dragons'],['Venise','venise'],['Égypte','egypte'],['Japon','japon'],['Astronaute','astro'],['Baroque','baroque'],['Art déco','deco'],['Royaume enchanté','fee'],['Steampunk','steampunk'],['Monde des fées','feesbois'],['Aventuriers des mers','marins']].map(a=>({n:a[0],dir:a[1],p:60})));
const bgUrl=b=>'../cartes-img/'+b.dir+'/bg1.webp';
function applyBg(){const b=BGS[selc('bg')]||BGS[0];$('app').style.backgroundImage=b.dir?'linear-gradient(#0008,#0008),url('+bgUrl(b)+')':'none';}
function shop(){
  let h='<h2>Boutique</h2><p class="gold">'+gems()+' 💎</p><div class="grid">';
  BGS.forEach((it,i)=>{const has=owned('bg',i),on=selc('bg')===i;
    h+='<div class="it'+(on?' on':'')+'"><div class="pv" style="'+(it.dir?'background-image:url('+bgUrl(it)+')':'background:#14202e')+'"></div><span>'+it.n+'</span>'+(on?'<button class="no">Utilisé</button>':has?'<button class="u" data-u="'+i+'">Utiliser</button>':(gems()>=it.p?'<button data-b="'+i+'">'+it.p+' 💎</button>':'<button class="no">'+it.p+' 💎</button>'))+'</div>';});
  h+='</div><button class="ob alt" id="cl">Fermer</button>';openOv(h);
  const o=$('ov');
  o.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ST.sel.bg=+b.dataset.u;saveST();applyBg();shop();});
  o.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=+b.dataset.b,p=BGS[i].p,j=wal();if(j.gems<p)return;j.gems-=p;(j.own[GAME].bg=j.own[GAME].bg||[0]).push(i);walSave(j);ST.sel.bg=i;saveST();gmUpdate();applyBg();shop();});
  $('cl').onclick=closeOv;
}
/* ================= dictionnaire : trie compact ================= */
let TL,TW,TC,TN,TCNT=0,DICT=false;
function buildTrie(txt){
  const cap=640000;TL=new Uint8Array(cap);TW=new Uint8Array(cap);TC=new Int32Array(cap).fill(-1);TN=new Int32Array(cap).fill(-1);
  const LC=new Int32Array(cap).fill(-1); // dernier enfant
  TCNT=1;const stack=[0];let prev='';
  let pos=0;const n=txt.length;
  while(pos<n){
    let e=txt.indexOf('\n',pos);if(e<0)e=n;
    const w=txt.slice(pos,e);pos=e+1;if(!w)continue;
    let k=0;const m=Math.min(prev.length,w.length);while(k<m&&prev.charCodeAt(k)===w.charCodeAt(k))k++;
    stack.length=k+1;
    for(let i=k;i<w.length;i++){
      const par=stack[i],id=TCNT++;TL[id]=w.charCodeAt(i)-65;
      if(TC[par]<0)TC[par]=id;else TN[LC[par]]=id;
      LC[par]=id;stack.push(id);
    }
    TW[stack[w.length]]=1;prev=w;
  }
  DICT=true;
}
function child(node,ch){for(let c=TC[node];c>=0;c=TN[c])if(TL[c]===ch)return c;return -1;}
function isWord(s){let nd=0;for(let i=0;i<s.length;i++){nd=child(nd,s.charCodeAt(i)-65);if(nd<0)return false;}return TW[nd]===1;}
class FakeConn{
  constructor(ch,me,other,isHost){this.ch=ch;this.me=me;this.other=other;this.h={};this.open=false;this.peer=other;
    ch.addEventListener('message',e=>{const m=e.data;if(m.to!==me||m.from!==other)return;
      if(m.k==='data')this.h.data&&this.h.data(JSON.parse(JSON.stringify(m.d)));
      if(m.k==='close')this.h.close&&this.h.close();
      if(m.k==='open'&&!this.open){this.open=true;this.h.open&&this.h.open();this.ch.postMessage({k:'ack',from:me,to:other});}
      if(m.k==='ack'&&!this.open){this.open=true;this.h.open&&this.h.open();}});}
  on(n,f){this.h[n]=f;}
  send(d){this.ch.postMessage({k:'data',from:this.me,to:this.other,d:JSON.parse(JSON.stringify(d))});}
  close(){this.ch.postMessage({k:'close',from:this.me,to:this.other});}
}
class FakePeer{
  constructor(id){this.id=id||('c'+Math.random().toString(36).slice(2,8));this.ch=new BroadcastChannel('scrabble-fake');this.h={};
    this.ch.addEventListener('message',e=>{const m=e.data;if(m.to===this.id&&m.k==='hello'){const c=new FakeConn(this.ch,this.id,m.from,true);c.open=false;this.h.connection&&this.h.connection(c);c.ch.postMessage({k:'open',from:this.id,to:m.from});}});
    setTimeout(()=>this.h.open&&this.h.open(this.id),20);}
  on(n,f){this.h[n]=f;}
  connect(id){const c=new FakeConn(this.ch,this.id,id,false);setTimeout(()=>this.ch.postMessage({k:'hello',from:this.id,to:id}),30);return c;}
  destroy(){}
}
function mkPeer(id){
  if(/net=bc/.test(location.search))return new FakePeer(id);
  if(!window.Peer)throw new Error('La bibliothèque de connexion n’a pas pu se charger (es-tu connecté à Internet ?).');
  const cfg={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return id?new Peer(id,cfg):new Peer(cfg);
}


function mkPeer(id){
  if(/net=bc/.test(location.search))return new FakePeer(id);
  if(!window.Peer)throw new Error('La bibliothèque de connexion n’a pas pu se charger (es-tu connecté à Internet ?).');
  const cfg={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return id?new Peer(id,cfg):new Peer(cfg);
}
const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>CHARS[(Math.random()*CHARS.length)|0]).join('');
let kind='solo',peer=null,conn=null,roomCode='',names={me:'Toi',opp:'Ordinateur'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function send(m){try{if(conn)conn.send(m);}catch(e){}}
function leave(){try{if(conn)conn.close();}catch(e){}try{if(peer)peer.destroy();}catch(e){}peer=null;conn=null;}
/* ================= règles ================= */
const N=15,C=7;
const PTS={A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:10,L:1,M:2,N:1,O:1,P:3,Q:8,R:1,S:1,T:1,U:1,V:4,W:10,X:10,Y:10,Z:10,'?':0};
const DIST={A:9,B:2,C:2,D:3,E:15,F:2,G:2,H:2,I:8,J:1,K:1,L:5,M:3,N:6,O:6,P:2,Q:1,R:6,S:6,T:6,U:6,V:2,W:1,X:1,Y:1,Z:1,'?':2};
const PREM=(()=>{const m=Array.from({length:N},()=>Array(N).fill(''));
 const set=(t,l)=>l.forEach(([r,c])=>{[[r,c],[r,14-c],[14-r,c],[14-r,14-c],[c,r],[c,14-r],[14-c,r],[14-c,14-r]].forEach(([a,b])=>m[a][b]=t);});
 set('tw',[[0,0],[0,7]]);set('dw',[[1,1],[2,2],[3,3],[4,4]]);set('tl',[[1,5],[5,1],[5,5]]);set('dl',[[0,3],[2,6],[3,0],[6,2],[6,6],[7,3]]);m[7][7]='c';return m;})();
function newBag(){const b=[];for(const k in DIST)for(let i=0;i<DIST[k];i++)b.push(k);for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];}return b;}
let G=null; // {board:15x15 of null|{l,j}, rack:[], aiRack:[], bag:[], sc:[0,0], turn:0, pass:0, over:false, last:[]}
let pend=[]; // [{r,c,l,j,ri}] tuiles posées ce tour (rack index)
let selRack=-1,zoomed=false;
function newGame(){
  const bag=newBag();G={board:Array.from({length:N},()=>Array(N).fill(null)),rack:[],aiRack:[],bag,sc:[0,0],turn:0,pass:0,over:false,last:[],level:ST.level,moves:0};
  draw(G.rack,C);draw(G.aiRack,C);pend=[];selRack=-1;if(kind==='solo')saveG();render();if(kind==='host')pushState();
}
function draw(rack,n){while(rack.length<n&&G.bag.length)rack.push(G.bag.pop());}
function saveG(){if(kind!=='solo')return;try{localStorage.setItem(GK,JSON.stringify(G));}catch(e){}}
function loadG(){try{const j=JSON.parse(localStorage.getItem(GK)||'null');if(j&&j.board){G=j;return true;}}catch(e){}return false;}
const at=(b,r,c)=>(r>=0&&r<N&&c>=0&&c<N)?b[r][c]:null;
/* évalue un coup (placements sur la grille G.board) */
function evaluate(pl,board){
  board=board||G.board;
  if(!pl.length)return {ok:false,msg:''};
  const rows=new Set(pl.map(p=>p.r)),cols=new Set(pl.map(p=>p.c));
  if(rows.size>1&&cols.size>1)return {ok:false,msg:'Les lettres doivent être alignées.'};
  const tmp=board.map(r=>r.slice());pl.forEach(p=>{tmp[p.r][p.c]={l:p.l,j:p.j,n:1};});
  const first=board.every(r=>r.every(x=>!x));
  const wordAt=(r,c,dr,dc)=>{ // mot complet passant par (r,c) dans la direction
    let r0=r,c0=c;while(at(tmp,r0-dr,c0-dc))r0-=dr,c0-=dc;
    const cells=[];let rr=r0,cc=c0;while(at(tmp,rr,cc)){cells.push([rr,cc]);rr+=dr;cc+=dc;}return cells;};
  let dir;
  if(pl.length>1)dir=rows.size===1?[0,1]:[1,0];
  else{const p=pl[0];const h=at(tmp,p.r,p.c-1)||at(tmp,p.r,p.c+1),v=at(tmp,p.r-1,p.c)||at(tmp,p.r+1,p.c);dir=h?[0,1]:v?[1,0]:null;if(!dir)return {ok:false,msg:first?'Il faut au moins 2 lettres.':'Le mot doit toucher les lettres déjà posées.'};}
  // continuité
  const main=wordAt(pl[0].r,pl[0].c,dir[0],dir[1]);
  for(const p of pl)if(!main.some(([r,c])=>r===p.r&&c===p.c))return {ok:false,msg:'Il y a un trou dans le mot.'};
  const isNew=(r,c)=>pl.some(p=>p.r===r&&p.c===c);
  const words=[];
  if(main.length>=2)words.push(main);
  const perp=[dir[1],dir[0]];
  for(const p of pl){const w=wordAt(p.r,p.c,perp[0],perp[1]);if(w.length>=2)words.push(w);}
  if(!words.length)return {ok:false,msg:'Il faut former un mot.'};
  if(first){if(!pl.some(p=>p.r===7&&p.c===7))return {ok:false,msg:'Le premier mot doit couvrir l’étoile.'};if(pl.length<2)return {ok:false,msg:'Il faut au moins 2 lettres.'};}
  else if(!words.some(w=>w.some(([r,c])=>!isNew(r,c))))return {ok:false,msg:'Le mot doit toucher les lettres déjà posées.'};
  let total=0;const strs=[],bad=[];
  for(const w of words){
    let s=0,mult=1,str='';
    for(const [r,c] of w){const t=tmp[r][c];str+=t.l;let v=t.j?0:PTS[t.l];
      if(isNew(r,c)){const pm=PREM[r][c];if(pm==='dl')v*=2;else if(pm==='tl')v*=3;else if(pm==='dw'||pm==='c')mult*=2;else if(pm==='tw')mult*=3;}
      s+=v;}
    total+=s*mult;strs.push(str);if(DICT&&!isWord(str))bad.push(str);
  }
  if(pl.length===C)total+=50;
  return {ok:bad.length===0,score:total,words:strs,bad,msg:bad.length?'« '+bad.join(', ')+' » : mot inconnu.':'',bingo:pl.length===C};
}
/* ================= IA : génération des coups ================= */
function genMoves(board,rack){
  const moves=[],seenK=new Set();const first=board.every(r=>r.every(x=>!x));
  const cnt={};rack.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  const kinds=Object.keys(cnt);
  for(let dirn=0;dirn<2;dirn++){
    const get=(i,j)=>dirn===0?board[i][j]:board[j][i];
    const pos=(i,j)=>dirn===0?{r:i,c:j}:{r:j,c:i};
    for(let i=0;i<N;i++){
      // contraintes croisées
      const cc=new Array(N).fill(null);
      for(let j=0;j<N;j++){
        if(get(i,j))continue;
        const up=[],dn=[];let x=i-1;while(x>=0&&get(x,j)){up.unshift(get(x,j).l);x--;}x=i+1;while(x<N&&get(x,j)){dn.push(get(x,j).l);x++;}
        if(!up.length&&!dn.length)continue;
        const pre=up.join(''),suf=dn.join(''),m=new Array(26).fill(false);
        for(let k=0;k<26;k++)m[k]=isWord(pre+String.fromCharCode(65+k)+suf);
        cc[j]=m;
      }
      const isAnch=new Array(N).fill(false);const anchors=[];
      for(let j=0;j<N;j++){
        if(get(i,j))continue;
        const an=first?(i===7&&j===7):((j>0&&get(i,j-1))||(j<N-1&&get(i,j+1))||(i>0&&get(i-1,j))||(i<N-1&&get(i+1,j)));
        if(an){isAnch[j]=true;anchors.push(j);}
      }
      for(const a of anchors){
        const record=placed=>{
          const pl=placed.map(t=>({...pos(i,t.col),l:t.l,j:t.j}));
          const key=pl.map(p=>p.r+','+p.c+p.l+(p.j?'*':'')).join('|');
          if(seenK.has(key))return;seenK.add(key);
          const ev=evaluate(pl,board);if(ev.ok)moves.push({pl,score:ev.score});
        };
        const extend=(nd,col,placed)=>{
          if(col>=N||!get(i,col)){
            if(col>a&&TW[nd]&&placed.length)record(placed);
            if(col>=N)return;
            const m=cc[col];
            for(const t of kinds){if(!cnt[t])continue;
              const ls=t==='?'?ALL26:[t.charCodeAt(0)-65];
              for(const L of ls){if(m&&!m[L])continue;const ch=child(nd,L);if(ch<0)continue;
                cnt[t]--;placed.push({l:String.fromCharCode(65+L),j:t==='?',col});extend(ch,col+1,placed);placed.pop();cnt[t]++;}
            }
          }else{const ch=child(nd,get(i,col).l.charCodeAt(0)-65);if(ch>=0)extend(ch,col+1,placed);}
        };
        const leftGen=(nd,placed,lim)=>{
          extend(nd,a,placed.map((t,k)=>({l:t.l,j:t.j,col:a-placed.length+k})));
          if(lim<=0)return;
          for(const t of kinds){if(!cnt[t])continue;
            const ls=t==='?'?ALL26:[t.charCodeAt(0)-65];
            for(const L of ls){const ch=child(nd,L);if(ch<0)continue;
              cnt[t]--;
              // colonnes : les tuiles de gauche occupent a-len .. a-1 ; on les recalcule à la fin
              leftGen(ch,placed.concat([{l:String.fromCharCode(65+L),j:t==='?',col:-1}]),lim-1);
              cnt[t]++;}
          }
        };
        if(a>0&&get(i,a-1)){
          let s=a-1;while(s>0&&get(i,s-1))s--;
          let nd=0;for(let j=s;j<a;j++){nd=child(nd,get(i,j).l.charCodeAt(0)-65);if(nd<0)break;}
          if(nd>=0)extend(nd,a,[]);
        }else{
          let lim=0,j=a-1;while(j>=0&&!get(i,j)&&!isAnch[j]){lim++;j--;}
          leftGen(0,[],lim);
        }
      }
    }
  }
  return moves;
}
const ALL26=[...Array(26).keys()];
let seen=new Set();
function aiMove(){
  seen=new Set();
  const moves=genMoves(G.board,G.aiRack);
  if(!moves.length)return null;
  moves.sort((a,b)=>b.score-a.score);
  const lv=G.level;
  if(lv===2)return moves[0];
  if(lv===1){const k=Math.min(moves.length,Math.max(3,Math.floor(moves.length*.25)));return moves[(Math.random()*k)|0];}
  const k=Math.min(moves.length,Math.max(5,Math.floor(moves.length*.7)));const lo=Math.floor(moves.length*.3);return moves[Math.min(moves.length-1,lo+((Math.random()*(k))|0))];
}
/* ================= tour de jeu ================= */
function applyMove(pl,who){
  const ev=evaluate(pl);
  pl.forEach(p=>{G.board[p.r][p.c]={l:p.l,j:p.j};});
  G.sc[who]+=ev.score;G.last=pl.map(p=>[p.r,p.c]);G.pass=0;G.moves++;
  return ev;
}
function endCheck(){
  if(G.over)return true;
  if(G.pass>=6||(!G.bag.length&&(!G.rack.length||!G.aiRack.length))){
    G.over=true;
    const rem=r=>r.reduce((s,t)=>s+PTS[t],0);
    if(!G.rack.length){G.sc[0]+=rem(G.aiRack);G.sc[1]-=rem(G.aiRack);}
    else if(!G.aiRack.length){G.sc[1]+=rem(G.rack);G.sc[0]-=rem(G.rack);}
    else{G.sc[0]-=rem(G.rack);G.sc[1]-=rem(G.aiRack);}
    saveG();finish();return true;}
  return false;
}
function finish(){
  if(G.fin)return;G.fin=true;
  const win=G.sc[0]>G.sc[1],tie=G.sc[0]===G.sc[1];let g=0;
  if(win){g=kind==='solo'?[3,6,10][G.level]:8;addGems(g);ST.wins++;saveST();}
  try{localStorage.removeItem(GK);}catch(e){}
  render();
  setTimeout(()=>{openOv('<div style="font-size:54px">'+(win?'🏆':tie?'🤝':'😌')+'</div><h2>'+(win?'Victoire !':tie?'Égalité':'Défaite…')+'</h2><p>Toi <b>'+G.sc[0]+'</b> · '+esc(names.opp)+' <b>'+G.sc[1]+'</b></p>'+(g?'<p class="gold">+'+g+' 💎</p>':'')+'<button class="ob" id="rp">Nouvelle partie</button><button class="ob alt" id="cl2">Voir la grille</button>');$('rp').onclick=()=>{if(kind==='solo'){closeOv();newGame();}else rematch();};$('cl2').onclick=closeOv;},500);
}
function recallAll(){pend=[];selRack=-1;render();}
function myTurn(){return !G.over&&G.turn===0&&!G.waiting;}
function afterMine(msg){
  if(kind==='solo'){saveG();render();if(!endCheck())setTimeout(aiTurn,700);}
  else{render();endCheck();pushState(msg);}
}
function playHuman(){
  if(!myTurn())return;
  if(!DICT){toast('Le dictionnaire se charge…');return;}
  const pl=pend.map(p=>({r:p.r,c:p.c,l:p.l,j:p.j}));
  if(!pl.length){toast('Pose d’abord des lettres.');return;}
  const ev=evaluate(pl);
  if(!ev.ok){toast(ev.msg||'Coup invalide.',3200);return;}
  if(kind==='guest'){G.waiting=true;send({t:'move',pl});render();return;}
  const used=pend.map(p=>p.ri).sort((a,b)=>b-a);used.forEach(i=>G.rack.splice(i,1));
  applyMove(pl,0);pend=[];selRack=-1;draw(G.rack,C);
  const msg=ev.words.join(', ')+' : +'+ev.score+(ev.bingo?' · SCRABBLE ! +50':'');
  toast(msg,2800);G.turn=1;afterMine(names.me+' : '+msg);
}
function shuffleBag(){for(let i=G.bag.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[G.bag[i],G.bag[j]]=[G.bag[j],G.bag[i]];}}
function doPass(){if(kind==='guest'){G.waiting=true;send({t:'pass'});render();return;}pend=[];G.pass++;G.turn=1;afterMine(names.me+' passe.');}
function doExch(idx){
  if(kind==='guest'){G.waiting=true;send({t:'exch',idx});render();return;}
  idx=idx.slice().sort((a,b)=>b-a);const out=idx.map(i=>G.rack.splice(i,1)[0]);draw(G.rack,C);G.bag.unshift(...out);shuffleBag();G.pass++;G.turn=1;afterMine(names.me+' échange '+idx.length+' lettre'+(idx.length>1?'s':'')+'.');
}

function viewFor(){return {board:G.board,rack:G.aiRack.slice(),sc:[G.sc[1],G.sc[0]],bag:G.bag.length,oppN:G.rack.length,turn:1-G.turn,pass:G.pass,over:G.over,last:G.last,moves:G.moves};}
function pushState(msg){send({t:'state',v:viewFor(),msg:msg||'',names:{me:names.opp,opp:names.me}});}
function hostGame(name){
  leave();kind='host';names={me:name,opp:'…'};roomCode=genCode();
  openOv('<h2>Création de la partie…</h2>');

    try{peer=mkPeer('scrabble-'+roomCode);}catch(e){toast(e.message,5000);return menu();}
    peer.on('open',()=>{openOv('<h2>Ta partie</h2><p class="muted">Donne ce code à ton ami (il le saisit dans « Rejoindre ») :</p><div style="font-size:52px;font-weight:900;letter-spacing:10px;color:var(--gold);border:3px dashed var(--gold);border-radius:16px;padding:6px 10px 6px 20px;margin:10px 0">'+roomCode+'</div><p class="muted">En attente de ton adversaire…</p><button class="ob alt" id="bk">Annuler</button>');$('bk').onclick=()=>{leave();kind='solo';names={me:'Toi',opp:'Ordinateur'};menu();};});

      if(conn&&conn.open){c.on('open',()=>c.send({t:'full'}));return;}
      conn=c;c.on('data',onMsg);
      c.on('close',()=>{if(conn===c){conn=null;if(G&&!G.over)toast(names.opp+' a quitté la partie.',4000);}});
    });
  };open(0);
}
function joinGame(name,code){
  leave();kind='guest';names={me:name,opp:'…'};
  openOv('<h2>Connexion…</h2><p class="muted">Recherche de la partie '+esc(code)+'</p><button class="ob alt" id="bk">Annuler</button>');$('bk').onclick=()=>{leave();kind='solo';names={me:'Toi',opp:'Ordinateur'};menu();};
  let opened=false;
  try{peer=mkPeer();}catch(e){toast(e.message,5000);return menu();}
  const fail=m=>{toast(m,5000);leave();kind='solo';names={me:'Toi',opp:'Ordinateur'};menu();};
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Aucune partie avec ce code.':'Connexion impossible ('+(e.type||'erreur')+').'));
  peer.on('open',()=>{
    conn=peer.connect('scrabble-'+code,{reliable:true});
    conn.on('open',()=>{opened=true;conn.send({t:'hello',name});});
    conn.on('data',onMsg);
    conn.on('close',()=>{if(G&&!G.over)toast('Connexion perdue.',4000);});
  });
  setTimeout(()=>{if(!opened)fail('Impossible de joindre la partie. Vérifie le code et ta connexion.');},15000);
}

function rematch(){
  if(kind==='host'){again[0]=true;if(again[1])startOnline();else{toast('En attente de '+names.opp+'…');}}
  else{send({t:'again'});toast('En attente de '+names.opp+'…');}
}
function startOnline(){again=[false,false];closeOv();G=null;newGame();}
function onMsg(m){
  if(m.t==='full'){toast('La partie est déjà complète.',4000);leave();kind='solo';return;}
  if(kind==='host'){
    if(m.t==='hello'){names.opp=String(m.name||'Invité').slice(0,12);send({t:'welcome',name:names.me});startOnline();return;}
    if(m.t==='again'){again[1]=true;if(again[0])startOnline();else toast(names.opp+' veut rejouer.');return;}
    if(!G||G.over||G.turn!==1)return;
    if(m.t==='move'){
      const pl=(m.pl||[]).map(p=>({r:+p.r,c:+p.c,l:String(p.l),j:!!p.j}));
      const rk=G.aiRack.slice();let ok=pl.length>0&&pl.length<=C&&pl.every(p=>p.r>=0&&p.r<N&&p.c>=0&&p.c<N&&!G.board[p.r][p.c]);
      for(const p of pl){const k=rk.indexOf(p.j?'?':p.l);if(k<0){ok=false;break;}rk.splice(k,1);}
      const ev=ok?evaluate(pl):{ok:false,msg:'Coup invalide.'};
      if(!ok||!ev.ok){send({t:'reject',msg:ev.msg||'Coup invalide.'});return;}
      G.aiRack=rk;applyMove(pl,1);draw(G.aiRack,C);
      const msg=names.opp+' : '+ev.words.join(', ')+' +'+ev.score+(ev.bingo?' · SCRABBLE !':'');
      toast(msg,3200);G.turn=0;render();endCheck();pushState(msg);
    }else if(m.t==='pass'){G.pass++;G.turn=0;toast(names.opp+' passe.');render();endCheck();pushState(names.opp+' passe.');}
    else if(m.t==='exch'){
      const idx=[...new Set((m.idx||[]).map(Number))].filter(i=>i>=0&&i<G.aiRack.length).sort((a,b)=>b-a);
      if(!idx.length||G.bag.length<C){send({t:'reject',msg:'Échange impossible.'});return;}
      const out=idx.map(i=>G.aiRack.splice(i,1)[0]);draw(G.aiRack,C);G.bag.unshift(...out);shuffleBag();G.pass++;G.turn=0;
      const msg=names.opp+' échange '+idx.length+' lettre'+(idx.length>1?'s':'')+'.';toast(msg);render();endCheck();pushState(msg);
    }
  }else if(kind==='guest'){
    if(m.t==='welcome'){names.opp=String(m.name||'Hôte').slice(0,12);}
    else if(m.t==='state'){
      const v=m.v;G={board:v.board,rack:v.rack,aiRack:new Array(v.oppN).fill('?'),bag:new Array(v.bag).fill(0),sc:v.sc,turn:v.turn,pass:v.pass,over:v.over,last:v.last||[],moves:v.moves,level:0,waiting:false,fin:G&&G.over&&v.over?G.fin:false};
      if(m.names)names=m.names;pend=[];selRack=-1;closeOv();if(m.msg)toast(m.msg,3000);render();
      if(G.over)finish();
    }else if(m.t==='reject'){if(G)G.waiting=false;toast(m.msg||'Coup refusé.',3200);render();}
  }
}
function aiTurn(){
  if(G.over)return;
  const m=aiMove();
  if(!m){
    if(G.bag.length>=C){ // échange tout
      G.bag.unshift(...G.aiRack);G.aiRack=[];draw(G.aiRack,C);for(let i=G.bag.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[G.bag[i],G.bag[j]]=[G.bag[j],G.bag[i]];}

    }else toast('L’ordinateur passe.');

    // retire du rack de l'IA
    m.pl.forEach(p=>{let k=G.aiRack.indexOf(p.j?'?':p.l);if(k>=0)G.aiRack.splice(k,1);});
    const ev=applyMove(m.pl,1);draw(G.aiRack,C);toast('Ordinateur : '+ev.words.join(', ')+' +'+ev.score,3200);

let exMode=false,exSel=new Set();
function tapRack(i){
  if(!myTurn())return;
  if(exMode){exSel.has(i)?exSel.delete(i):exSel.add(i);render();return;}
  selRack=selRack===i?-1:i;render();
}
function tapSq(r,c){
  if(!myTurn())return;
  const pi=pend.findIndex(p=>p.r===r&&p.c===c);
  if(pi>=0){pend.splice(pi,1);selRack=-1;render();return;}
  if(G.board[r][c]||selRack<0)return;
  const t=G.rack[selRack];
  if(t==='?'){chooseLetter(L=>{pend.push({r,c,l:L,j:true,ri:selRack});selRack=-1;render();});return;}
  pend.push({r,c,l:t,j:false,ri:selRack});selRack=-1;render();
}

  (sv?'<button class="ob alt" id="rs">Reprendre</button>':'')+'<button class="ob alt" id="hm">Retour aux jeux</button><p class="muted" style="font-size:12px">Dictionnaire français de plus de 300 000 mots (sans accents). 50 points de bonus si tu poses tes 7 lettres.</p>');
  const nm=()=>{const v=($('nm').value.trim().slice(0,12))||'Joueur';ST.name=v;saveST();return v;};
  $('ov').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ST.level=+b.dataset.l;nm();saveST();menu();});
  $('go').onclick=()=>{leave();kind='solo';names={me:nm(),opp:'Ordinateur'};closeOv();newGame();};
  $('host').onclick=()=>hostGame(nm());
  $('jn').onclick=()=>{const c=$('cd').value.trim().toUpperCase();if(c.length!==4)return toast('Le code a 4 caractères.');ST.code=c;saveST();joinGame(nm(),c);};
  if($('rs'))$('rs').onclick=closeOv;$('hm').onclick=()=>{location.href='../';};
}
$('bmenu').onclick=menu;
applyBg();
if(loadG()){render();if(G.turn===1&&!G.over)setTimeout(()=>{if(DICT)aiTurn();else waitDict(()=>aiTurn());},500);}else{newGame();menu();}
function waitDict(f){const t=setInterval(()=>{if(DICT){clearInterval(t);f();}},200);}
$('sc').textContent='Chargement du dictionnaire…';
fetch('mots.txt').then(r=>r.text()).then(t=>{buildTrie(t);render();}).catch(()=>toast('Dictionnaire indisponible (hors ligne ?).',5000));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
