<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1D1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rosine">

<title>Rosine la Lutine</title>
<style>
/* Mise en page : écran de jeu 16:10 en haut, commandes tactiles collées en bas, violet nuit et roses de pixel */
:root{
  --bg:#1D1230; --panel:#2E1C4D; --ink:#FFF3FA; --muted:#C2ADDD;
  --pink:#FF6FB5; --pink-d:#D93D8F; --gold:#FFD84A; --teal:#5EE6D0;
  --edge:#0E0719; --heart:#FF4D7A; --heart-off:#4A3470;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;font-variant-numeric:lining-nums tabular-nums;
  padding-block:12px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;margin:0;cursor:pointer}
.game{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  min-height:calc(100svh - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:flex;align-items:center;gap:14px;min-width:0}
.hearts{display:flex;gap:3px}
.hearts i{display:block;width:20px;height:18px}
.hearts svg{display:block;width:100%;height:100%;fill:var(--heart);shape-rendering:crispEdges}
.hearts i.off svg{fill:var(--heart-off)}
.gemc{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.gemi{width:11px;height:11px;background:var(--teal);transform:rotate(45deg);box-shadow:inset -3px -3px 0 #27a392}
.hbtns{display:flex;gap:8px}
.chip{
  font-size:14px;font-weight:600;background:var(--panel);border:2px solid var(--edge);border-radius:8px;
  padding:6px 10px;box-shadow:0 3px 0 var(--edge);
}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.screen{
  position:relative;width:100%;aspect-ratio:16/10;border:4px solid var(--edge);border-radius:8px;
  overflow:hidden;background:#000;box-shadow:0 0 0 2px var(--pink-d);touch-action:manipulation;
}
canvas{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
.toast{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:92%;
  background:rgba(14,7,25,.78);color:var(--ink);padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;text-align:center;pointer-events:none;
}
.overlay{
  position:fixed;inset:0;z-index:20;display:flex;background:rgba(22,10,40,.94);overflow:auto;padding:12px 14px;
}
.ovbox{margin:auto;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px;width:100%;max-width:420px}
.ttl{margin:0;font-size:clamp(24px,8vw,38px);line-height:1;color:var(--pink);text-shadow:0 3px 0 var(--edge);text-wrap:balance}
.ttl2{margin:0;font-size:clamp(22px,7vw,30px);line-height:1;color:var(--gold);text-shadow:0 3px 0 var(--edge)}
.sub{margin:0;font-size:clamp(12px,3.4vw,15px);color:var(--muted);text-wrap:balance}
.tip{margin:0;font-size:clamp(11px,3vw,13px);color:var(--muted)}
.tip b,.stat b{color:var(--gold)}
.stat{margin:0;font-size:16px}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.shop{display:flex;flex-direction:column;gap:6px;width:100%}
.shr{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:6px 8px}
.shr b{display:block;font-size:13px}.shr small{font-size:11px;color:var(--muted)}
.buy{min-width:74px;padding:8px;font-weight:700;background:var(--gold);color:#2a0f3d;border:2px solid var(--edge);border-radius:8px}
.buy:disabled{opacity:.45}
.overlay.sheet{inset:auto 0 0 0;background:rgba(22,10,40,.96);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--edge)}
.rec{display:block;font-style:normal;font-size:10px;color:var(--gold)}
.tips{text-align:left;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:6px 8px;font-size:12px;width:100%}
.tips b{color:var(--gold)}
.duel #bcv{width:80px;height:80px;image-rendering:pixelated;border:2px solid var(--edge);border-radius:10px}
.dbtns{display:flex;gap:8px;width:100%}
.dbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;padding:6px;background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:10px;box-shadow:0 4px 0 var(--edge);font-size:12px;font-weight:700}
.dbtn svg{width:30px;height:30px}.dbtn:disabled{opacity:.5}
.dbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dmsg{min-height:2.4em}
#bubN{font-size:15px;white-space:nowrap}.chip{white-space:nowrap}.stats{flex-wrap:nowrap}
.lvb{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;padding:4px 2px;
  background:var(--panel);border:2px solid var(--edge);border-radius:10px;box-shadow:0 4px 0 var(--edge);
}
.lvb b{font-size:22px;color:var(--pink);line-height:1}
.lvb span{font-size:12px}
.lvb em{font-style:normal;font-size:10px;color:var(--teal)}
.lvb:disabled{opacity:.7;cursor:default}.lvb:disabled b{color:#8a78b0}.lvb b{font-size:26px}
.lvb:not(:disabled):active,.ob:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.ob{
  width:100%;max-width:300px;padding:10px 12px;font-size:16px;font-weight:700;color:#2a0f3d;
  background:var(--pink);border:2px solid var(--edge);border-radius:10px;box-shadow:0 4px 0 var(--edge);
}
.ob.alt{background:var(--panel);color:var(--ink)}
.controls{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px 4px;touch-action:none}
.dpad,.acts{display:flex;gap:12px}
.acts .btnb{transform:translateY(14px)}
.pad{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  width:78px;height:78px;background:var(--panel);border:3px solid var(--edge);border-radius:24px;
  box-shadow:0 6px 0 var(--edge);touch-action:none;
}
.pad svg{width:34px;height:34px;fill:var(--ink)}
.pad span{font-size:28px;font-weight:700;line-height:1}
.pad small{font-size:11px;font-weight:600;opacity:.85;line-height:1.2}
.pad.btna{background:var(--pink);color:#2a0f3d}
.pad.btnb{background:var(--teal);color:#0d2b27}
.pad.on{box-shadow:0 2px 0 var(--edge);translate:0 4px;filter:brightness(1.12)}
.dtxt{position:absolute;left:0;right:0;z-index:5;text-align:center;pointer-events:none;color:#fff;font-weight:700;text-shadow:0 2px 0 #0e0719,0 0 6px #0e0719;padding:0 8px}
.dtxt[hidden]{display:none}
#dTop{top:6px;font-size:clamp(15px,4.4vw,19px);color:var(--gold)}
#dTop b{color:#fff;font-size:1.35em;margin:0 4px}
.dmid{top:15%;font-size:clamp(20px,6.2vw,28px)}.dmid.win{color:var(--teal)}.dmid.lose{color:var(--pink)}
.dbot{bottom:6px;font-size:clamp(12px,3.4vw,15px);font-weight:600;line-height:1.35}
.dbot i{color:var(--gold);font-style:normal}
.dueling .controls{visibility:hidden}
.wallet{margin:0;font-size:20px}.wallet b{font-size:32px;color:var(--gold);font-variant-numeric:tabular-nums}
.tiles{display:flex;justify-content:center;gap:8px;width:100%}
.tile{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--panel);border:3px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edge);color:var(--ink)}
.tile .ic{font-size:38px;line-height:1}
.tile .nm{font-size:13px;font-weight:700;line-height:1.15}
.tile .pr{font-size:19px;font-weight:800;color:var(--gold)}
.tile.done .pr{color:var(--teal);font-size:15px}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,216,74,.35),0 4px 0 var(--edge);background:#3b2566}
.detail{width:100%;text-align:left;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:8px 12px}
.detail h3{margin:0 0 4px;font-size:17px;color:var(--gold)}.detail h3 small{font-size:12px;color:var(--muted);font-weight:600}
.detail p{margin:0;font-size:14px;line-height:1.35}.detail .why{margin-top:5px;color:var(--teal);font-size:13px}
.buyb{font-size:19px}.buyb:disabled{opacity:.55}
.toast[hidden],.overlay[hidden]{display:none}
.chip:focus-visible,.ob:focus-visible,.lvb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:380px){.pad{width:68px;height:68px}.hearts i{width:17px;height:15px}.gemc{font-size:18px}}
@media (orientation:landscape) and (max-height:600px){
  body{padding-block:6px 0;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .game{max-width:none;min-height:0;gap:4px}
  .hud{padding-inline:2px}
  .hearts i{width:17px;height:15px}.gemc{font-size:17px}
  .chip{padding:4px 9px;font-size:13px}
  .screen{width:auto;height:calc(100svh - 54px - env(safe-area-inset-bottom,0px));max-width:100%;margin-inline:auto;flex:none}
  .controls{
    position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    bottom:max(8px,env(safe-area-inset-bottom,0px));padding:0;margin:0;pointer-events:none;
  }
  .controls .pad{pointer-events:auto;opacity:.85;width:66px;height:66px;border-radius:20px}
  .dpad,.acts{gap:10px}
  .acts .btnb{transform:translateY(-22px)}
  .overlay{padding:6px 12px}
  .ovbox{max-width:760px;gap:5px;padding:4px}
  .ttl{font-size:30px}.ttl2{font-size:24px}
  .lvgrid{grid-template-columns:repeat(6,1fr);gap:6px}
  .lvb{min-height:50px}
  .tile{padding:6px 4px}.tile .ic{font-size:28px}
  .detail{padding:5px 10px}.detail p{font-size:12px}.detail h3{font-size:15px}
  .wallet{font-size:16px}.wallet b{font-size:24px}
  .buyb{font-size:17px;padding:7px}
  .shr{padding:4px 7px}
  .tips{font-size:11px}
  .shop+.ob{position:sticky;bottom:0;max-width:340px}
  .overlay.sheet{inset:0;background:transparent;pointer-events:none;padding:0}
  .overlay.sheet .ovbox{max-width:none;width:100%;height:100%;padding:0;margin:0;display:block}
  .overlay.sheet .dbtns{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));flex-direction:column;width:70px;gap:8px;pointer-events:auto}
  .dbtn{min-height:64px;padding:4px;font-size:11px;border-radius:16px}
  .dbtn svg{width:26px;height:26px}
  .dtxt{font-size:15px}.dtxt.dmid{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.pad,.chip,.ob,.lvb{transition:none}}
/*UIKIT*/
#ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ov>div{border-radius:26px!important;box-shadow:0 24px 60px #000d,0 0 0 1px #ffffff2e inset,0 0 40px #a65cff22;background-image:linear-gradient(165deg,#ffffff12,#ffffff00 40%)}
#ov h2,#ov h1{letter-spacing:.3px;text-shadow:0 2px 8px #0008}
.mi{display:block;width:76px;height:76px;margin:0 auto 6px;border-radius:22px;box-shadow:0 8px 18px #000a,0 0 0 2px #ffffff30 inset}
.ob{background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 58%);border-radius:16px!important;text-shadow:0 1px 0 #ffffff55;transition:transform .08s,box-shadow .08s}
.ob:active{transform:translateY(3px)}
.ob.alt{background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));text-shadow:none}
.chips button,.tabs button{transition:transform .08s}
.chips button.on,.tabs button.on{box-shadow:0 0 14px #f6c85f99}
.si,.it{border-radius:18px!important;box-shadow:0 6px 14px #0005,0 0 0 1px #ffffff22 inset}
.si.on,.it.on{box-shadow:0 0 16px #f6c85f88,0 0 0 2px #f6c85f inset}
.chip{box-shadow:0 2px 6px #0005}
</style>

<style>/* style commun des jeux : pastilles sombres à bord doré */
.chip{background:#0009!important;border:2px solid #f6c85f!important;border-radius:999px!important;padding:5px 12px!important;box-shadow:none!important;color:#fff}
.hud .wallet,.hud .gemc{background:#0009;border-radius:999px;padding:4px 10px;font-weight:800}.hud .wallet{color:#f6c85f}
</style>
</head>
<body>
<main class="game">
  <header class="hud">
    <div class="stats">
      <div class="hearts" id="hearts" role="img" aria-label="3 cœurs"></div>
      <div class="gemc"><span class="gemi" aria-hidden="true"></span><b id="gemN">0</b></div>
      <span id="bubN" hidden></span>
    </div>
    <div class="hbtns">
      <button type="button" class="chip" id="muteBtn" aria-pressed="false">Son</button>
      <button type="button" class="chip" id="pauseBtn">☰ Menu</button>
    </div>
  </header>

  <div class="screen">
    <canvas id="cv" width="256" height="160" role="img" aria-label="Rosine la lutine traverse un monde de plateformes"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="dtxt" id="dTop" hidden></div><div class="dtxt dmid" id="dMid" hidden></div><div class="dtxt dbot" id="dBot" hidden></div>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="controls" id="controls">
    <div class="dpad">
      <button type="button" class="pad" data-k="l" aria-label="Aller à gauche"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3 6 12l10 9z"/></svg></button>
      <button type="button" class="pad" data-k="r" aria-label="Aller à droite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 10 9-10 9z"/></svg></button>
    </div>
    <div class="acts">
      <button type="button" class="pad btnb" data-k="a" aria-label="Baguette magique"><span>B</span><small>baguette</small></button>
      <button type="button" class="pad btna" data-k="j" aria-label="Sauter"><span>A</span><small>saut</small></button>
    </div>
  </div>
</main>

function rng(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function solidAt(g,tx,ty){
  if(tx<0||tx>=g.W)return true;
  if(ty<0||ty>=ROWS)return false;
  return SOLID[g.tiles[ty][tx]]===1;
}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

/* ----- Niveaux à plateformes et course en vélo ----- */
function buildPlat(cfg){
  const W=cfg.len,r=rng(cfg.seed),bike=cfg.kind==='bike';
  const tiles=Array.from({length:ROWS},()=>new Uint8Array(W));
  const ents=[],gems=[],cps=[2*T];
  let x=0,lastCp=0;
  const col=(cx,top)=>{if(cx>=W)return;for(let y=top;y<ROWS;y++)tiles[y][cx]=(y===top)?1:2;};
  const flat=n=>{for(let i=0;i<n&&x<W;i++){col(x,GR);x++;}};
  const put=(tx,ty,c)=>{if(tx>=0&&tx<W&&ty>=0&&ty<ROWS)tiles[ty][tx]=c;};
  const gem=(tx,ty,dy)=>gems.push({x:tx*T+4,y:ty*T+4+(dy||0)});
  const enemy=(type,cx,len)=>{
    if(type==='mush')ents.push({t:'mush',x:cx*T,y:(GR-1)*T+3,w:12,h:11,vx:-.35,alive:true,step:0});
    else if(type==='hop')ents.push({t:'hop',ox:cx*T,x:cx*T,y0:(GR-1)*T+4,y:(GR-1)*T+4,w:12,h:12,range:Math.min(36,len*T/2-8),ph:r()*6,alive:true});
    else if(type==='hog')ents.push({t:'hog',x:cx*T,y:(GR-1)*T+5,w:14,h:9,vx:-.3,alive:true,spiky:true,step:0});
    else ents.push({t:'bee',x:cx*T,ox:cx*T,y:(GR-3)*T+4,y0:(GR-3)*T+4,w:12,h:9,range:Math.min(40,len*T/2-8),ph:r()*6,alive:true,face:1});
  };
  const maybeEnemy=(s,n)=>{if(r()<cfg.enemyP)enemy(cfg.types[(r()*cfg.types.length)|0],s+(n>>1),n);};
  const cp=s=>{if(s-lastCp>=32){cps.push(s*T+4);lastCp=s;}};
  flat(10);
  const wBlocks=.14,wPlanks=.12,wStairs=bike?0:.12,wSpikes=.10,wRocks=bike?.16:0,wExtra=cfg.extras?.26:0;
  while(x<W-18){
    const s=x;let c=r();
    if((c-=cfg.gapP)<0){
      const g=bike?3+((r()*2)|0):2+((r()*2)|0);
      for(let i=0;i<g;i++)gem(s+i,GR-3,i===1||i===2?-6:0);
      if(!bike&&g===3&&r()<.6)put(s+1,GR,8);
      x+=g;flat(bike?5+((r()*3)|0):3+((r()*3)|0));
    }else if((c-=wBlocks)<0){
      const n=6+((r()*3)|0);flat(n);cp(s);
      const st=s+1,cnt=3+((r()*3)|0),it=(r()*cnt)|0;
      for(let i=0;i<cnt;i++){put(st+i,GR-3,i===it?4:3);if(r()<.5)gem(st+i,GR-2);}
      maybeEnemy(s,n);
    }else if((c-=wPlanks)<0){
      flat(9);cp(s);
      const px=s+2,len=3+((r()*2)|0);
      for(let i=0;i<len;i++){put(px+i,GR-2,8);gem(px+i,GR-3);}
      if(r()<.5)for(let i=0;i<2;i++){put(px+len+1+i,GR-4,8);gem(px+len+1+i,GR-5);}
      maybeEnemy(s,9);
    }else if((c-=wStairs)<0){
      const h=1+((r()*2)|0);flat(10);cp(s);
      const hs=[];for(let j=1;j<=h;j++)hs.push(j);hs.push(h,h);for(let j=h;j>=1;j--)hs.push(j);
      hs.forEach((hh,i)=>{for(let k=0;k<hh;k++)put(s+2+i,GR-1-k,5);});
      gem(s+2+h,GR-2-h);gem(s+3+h,GR-2-h);
    }else if((c-=wSpikes)<0){
      flat(bike?10:8);cp(s);
      const px=s+(bike?5:3)+((r()*2)|0),n=1+((r()*2)|0);
      for(let i=0;i<n;i++)put(px+i,GR-1,6);
      for(let i=-1;i<=n;i++)gem(px+i,GR-3,i===0||i===n-1?-4:0);
      flat(3);
    }else if((c-=wRocks)<0){
      flat(10);cp(s);
      const px=s+5,n=1+((r()*2)|0);
      for(let i=0;i<n;i++)put(px+i,GR-1,5);
      for(let i=-1;i<=n;i++)gem(px+i,GR-3,i===0||i===n-1?-4:0);
    }else if((c-=wExtra)<0){
      const ex=cfg.extras[(r()*cfg.extras.length)|0];
      if(ex==='boulder'){
        const n=11+((r()*2)|0);flat(n);cp(s);
        ents.push({t:'boulder',x:(s+n-3)*T,y:(GR-1)*T+1,w:15,h:15,vx:-.7,x0:(s+1)*T,x1:(s+n-1)*T,alive:true,spiky:true,hard:true,step:0});
        for(let i=2;i<n-2;i++)if(i%2)gem(s+i,GR-4);
      }else if(ex==='fire'){
        flat(10);cp(s);
        const fx=s+4+((r()*2)|0);
        ents.push({t:'fire',x:fx*T+4,y:GR*T-22,w:8,h:22,ph:((r()*60)|0),on:false,warn:false,alive:true,spiky:true,hard:true});
        for(let i=-1;i<=1;i++)gem(fx+i,GR-4,i?0:-4);
      }else{
        flat(10);cp(s);
        ents.push({t:'spring',x:(s+3)*T+1,y:GR*T-8,w:14,h:8,sq:0,alive:true,hard:true});
        for(let i=1;i<=5;i++)gem(s+i,GR-6);
      }
    }else{
      const n=5+((r()*4)|0);flat(n);cp(s);
      for(let i=0;i<n;i++)if(r()<.4)gem(s+i,GR-1);
      maybeEnemy(s,n);
    }
  }
  flat(W-x);
  /* le point de reprise du boss ne doit jamais tomber au-dessus d'un trou */
  for(let tx=Math.max(0,W-26);tx<W;tx++)if(SOLID[tiles[GR][tx]]!==1)col(tx,GR);
  let boss=null;
  if(cfg.boss>=0){
    boss={kind:cfg.boss,x:(W-14)*T,x0:(W-14)*T,y:GR*T-28,w:24,h:28,defeated:false,cd:0,fire:60};
    cps.push((W-22)*T);
  }
  return {W:W,tiles:tiles,ents:ents,gems:gems,cps:cps,boss:boss,portal:{x:(W-7)*T,y:(GR-3)*T,w:16,h:3*T},shop:{x:5*T,w:32,door:{x:5*T+10,y:(GR-3)*T,w:12,h:3*T}}};
}

/* ----- Niveau de vol : couloir de nuages avec piliers de pierre ----- */
function buildCopter(cfg){
  const W=cfg.len,r=rng(cfg.seed);
  const tiles=Array.from({length:ROWS},()=>new Uint8Array(W));
  const ents=[],gems=[],cps=[2*T];
  for(let x=0;x<W;x++)tiles[ROWS-1][x]=1;
  const put=(tx,ty,c)=>{if(tx>=0&&tx<W&&ty>=0&&ty<ROWS)tiles[ty][tx]=c;};
  const gem=(tx,ty)=>gems.push({x:tx*T+4,y:ty*T+4});
  let x=14,lastCp=0;
  while(x<W-26){
    if(x-lastCp>=45){cps.push((x-4)*T);lastCp=x;}
    const k=r();
    if(k<.45){
      const top=1+((r()*3)|0),gap=5;
      for(let i=0;i<2;i++){
        for(let y=0;y<top;y++)put(x+i,y,5);
        for(let y=top+gap;y<ROWS-1;y++)put(x+i,y,5);
      }
      for(let q=-2;q<=3;q++)gem(x+q,top+2);
    }else if(k<.7){
      const h=3+((r()*3)|0);
      for(let i=0;i<2;i++)for(let y=ROWS-1-h;y<ROWS-1;y++)put(x+i,y,5);
      for(let q=-1;q<=2;q++)gem(x+q,ROWS-1-h-2);
    }else if(k<.82){
      const h=3+((r()*3)|0);
      for(let i=0;i<2;i++)for(let y=0;y<h;y++)put(x+i,y,5);
      for(let q=-1;q<=2;q++)gem(x+q,h+1);
    }else if(k<.82+(cfg.gateP||.1)){
      for(let i=0;i<2;i++)ents.push({t:'gate',x:(x+i*4)*T,y:4*T,y0:3*T+8,amp:34,ph:i*3.14,w:16,h:3*T,alive:true,spiky:true,hard:true});
      for(let q=0;q<7;q++)gem(x+q,q%2?1:8);
    }else{
      for(let q=0;q<6;q++)gem(x+q,3+Math.round(Math.sin(q)*1.5));
    }
    if(r()<cfg.enemyP)ents.push({t:'bird',x:(x+4)*T,y:0,y0:(2+((r()*4)|0))*T,amp:14+r()*10,ph:r()*6,w:12,h:9,alive:true});
    x+=7+((r()*4)|0);
  }
  return {W:W,tiles:tiles,ents:ents,gems:gems,cps:cps,
    boss:{kind:cfg.boss,x:(W-14)*T,x0:(W-14)*T,y:3*T,w:24,h:28,defeated:false,cd:0,hover:true,fire:60},
    portal:{x:(W-7)*T,y:0,w:16,h:ROWS*T,tall:true},
    shop:{x:5*T,w:32,door:{x:5*T+10,y:0,w:12,h:ROWS*T}}};
}
function buildLevel(cfg){return cfg.kind==='copter'?buildCopter(cfg):buildPlat(cfg);}

function newGame(li,o){
  o=o||{};

    items:[],parts:[],shots:[],
    p:{x:2*T,y:air?4*T:GR*T-14,w:10,h:14,vx:0,vy:0,facing:1,onGround:false,coy:0,buf:0,atkT:0,atkCd:0,inv:0,anim:0},
    camX:0,t:0,hearts:start,startHearts:start,gemCount:0,cpi:0,deaths:0,status:'play',toast:'',toastT:0,ev:[],

/* Déplacement d'un rectangle contre la grille, un axe à la fois */
function moveBox(g,b,dx,dy){
  const out={hit:false,tiles:[]};
  if(dx){
    b.x+=dx;
    const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-1)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-1)/T);
    if(dx>0){
      outer1:for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++)if(solidAt(g,tx,ty)){b.x=tx*T-b.w;out.hit=true;break outer1;}
    }else{
      outer2:for(let tx=x1;tx>=x0;tx--)for(let ty=y0;ty<=y1;ty++)if(solidAt(g,tx,ty)){b.x=(tx+1)*T;out.hit=true;break outer2;}
    }
  }
  if(dy){
    b.y+=dy;
    const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-1)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-1)/T);
    if(dy>0){
      outer3:for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(g,tx,ty)){b.y=ty*T-b.h;out.hit=true;break outer3;}
    }else{
      for(let ty=y1;ty>=y0&&!out.hit;ty--){
        for(let tx=x0;tx<=x1;tx++)if(solidAt(g,tx,ty)){out.hit=true;out.tiles.push({tx:tx,ty:ty});}
        if(out.hit)b.y=(ty+1)*T;
      }
    }
  }
  return out;
}

function spark(g,x,y,color,n,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,v=(.4+Math.random())*(sp||1.2);
    g.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.6,life:22+((Math.random()*14)|0),c:color});
  }
}
function breakTile(g,tx,ty){
  g.tiles[ty][tx]=0;spark(g,tx*T+8,ty*T+8,'#ffd45a',8,1.6);spark(g,tx*T+8,ty*T+8,'#f2a93b',6,1.4);
  g.ev.push('break');
  if(Math.random()<.3)g.gems.push({x:tx*T+4,y:(ty+1)*T+2});
}
function openItemBlock(g,tx,ty){
  g.tiles[ty][tx]=7;g.ev.push('bonus');spark(g,tx*T+8,ty*T+8,'#ff7ac0',10,1.6);
  const y=(ty+1)*T+2;
  if(g.hearts<MAXH&&Math.random()<.45)g.items.push({t:'heart',x:tx*T+4,y:y,w:8,h:8});
  else{g.gems.push({x:tx*T+4,y:y});g.gems.push({x:tx*T-6,y:y+2});g.gems.push({x:tx*T+14,y:y+2});}
}
function hitTile(g,tx,ty){
  const c=(g.tiles[ty]||[])[tx];
  if(c===3)breakTile(g,tx,ty);else if(c===4)openItemBlock(g,tx,ty);
}
function leaveShop(g){g.shopDone=true;g.status='play';g.p.x=g.shop.x+g.shop.w+4;g.p.vx=0;g.p.inv=Math.max(g.p.inv,30);}
function killEnemy(g,e){
  e.alive=false;g.ev.push('kill');
  spark(g,e.x+e.w/2,e.y+e.h/2,'#ffffff',8,1.3);spark(g,e.x+e.w/2,e.y+e.h/2,'#ffd45a',6,1.1);
  g.gems.push({x:e.x+e.w/2-4,y:e.y-2});
}
function hurt(g,sx){
  const p=g.p;
  if(p.inv>0||g.status!=='play')return;
  if(g.bubbles>0){
    g.bubbles--;p.inv=70;p.vy=-2.4;p.vx=(p.x+p.w/2<sx?-1:1)*1.4;
    g.ev.push('bubble');spark(g,p.x+5,p.y+7,'#9ff3ff',10,1.5);
    return;
  }
  g.hearts--;p.inv=110;p.vy=-3.2;p.vx=(p.x+p.w/2<sx?-1:1)*1.8;
  g.ev.push('hurt');
  if(g.hearts<=0){g.status='dead';g.ev.push('die');}
}
function respawn(g){
  const p=g.p;
  p.x=g.cps[g.cpi];p.y=g.kind==='copter'?4*T:GR*T-p.h-1;p.vx=0;p.vy=0;p.inv=90;p.atkT=0;
  if(g.kind!=='copter'){let tx=Math.floor(p.x/T);while(tx>2&&!(solidAt(g,tx,GR)&&solidAt(g,Math.floor((p.x+p.w)/T),GR))){tx--;p.x=tx*T+2;}}
  g.camX=Math.max(0,Math.min(g.W*T-VW,p.x-VW/2));
}
function updateEnemy(g,e){
  if(e.t==='bee'){
    e.x=e.ox+Math.sin(g.t*.025+e.ph)*e.range;
    e.y=e.y0+Math.sin(g.t*.06+e.ph)*5;
    e.face=Math.cos(g.t*.025+e.ph)>0?1:-1;
    return;
  }
  if(e.t==='hop'){e.x=e.ox+Math.sin(g.t*.02+e.ph)*e.range;e.y=e.y0-Math.abs(Math.sin(g.t*.055+e.ph))*22;e.face=Math.cos(g.t*.02+e.ph)>0?1:-1;return;}
  if(e.t==='gate'){e.y=e.y0+Math.sin(g.t*.03+e.ph)*e.amp;return;}
  if(e.t==='fire'){const c=(g.t+e.ph)%150;e.on=c<55;e.warn=c>=120;return;}
  if(e.t==='orb'){
    e.x+=e.vx;e.life--;
    if(e.k===2)e.y+=Math.sin(g.t*.15)*.9;
    if(e.life<=0||e.x<g.camX-30)e.alive=false;
    return;
  }
  if(e.t==='boulder'){
    e.x+=e.vx;e.step+=Math.abs(e.vx);
    if(e.x<e.x0){e.x=e.x0;e.vx=Math.abs(e.vx);}
    if(e.x+e.w>e.x1){e.x=e.x1-e.w;e.vx=-Math.abs(e.vx);}
    return;
  }
  if(e.t==='bird'){
    e.x-=.55;e.y=e.y0+Math.sin(g.t*.04+e.ph)*e.amp;
    return;
  }
  const nx=e.x+e.vx,fx=Math.floor((e.vx>0?nx+e.w:nx)/T);
  const wall=solidAt(g,fx,Math.floor((e.y+e.h/2)/T));
  const edge=!solidAt(g,fx,Math.floor((e.y+e.h+1)/T));
  if(wall||edge)e.vx=-e.vx;else e.x=nx;
  e.step+=Math.abs(e.vx);
}
function swingBox(p,g){
  const L=16+(g&&g.wand?30:0);
  return p.facing>0?{x:p.x+p.w-1,y:p.y-1,w:L+1,h:p.h+2}:{x:p.x-L,y:p.y-1,w:L+1,h:p.h+2};
}

/* ----- Duel pierre-feuille-ciseaux : 0 pierre, 1 feuille, 2 ciseaux ----- */
function duelOutcome(h,b){return h===b?0:(((h-b+3)%3)===1?1:-1);}
/* st : lastB, lastP (derniers signes), lastR (1 Rosine a gagné, -1 le gardien, 0 égalité), n (manches jouées).
   det=true : renvoie -1 quand le gardien tire au hasard (sert aux tests) */
function bossPick(kind,st,det){
  kind%=10;
  const rnd=()=>det?-1:(Math.random()*3)|0;
  const first=st.lastB<0||st.lastB===undefined;
  switch(kind){
  case 0:{const o=[0,1,2].filter(m=>m!==st.lastB);return det&&first?-1:o[(Math.random()*o.length)|0];}
  case 1:return st.lastP<0?rnd():(st.lastP+1)%3;
  case 2:if(first)return rnd();if(Math.random()<.2)return rnd();return (st.lastB+1)%3;
  case 3:return st.lastR===1?1:0;
  case 4:if(first)return rnd();return st.lastR===1?(st.lastB+1)%3:st.lastB;
  case 5:return st.lastP<0?rnd():st.lastP;
  case 6:if(first)return rnd();if(Math.random()<.15)return rnd();return (st.lastB+2)%3;
  case 7:return st.lastP<0?rnd():(st.lastP+2)%3;
  case 8:return [0,0,1,2][(st.n|0)%4];
  default:
    if(first)return rnd();
    if(st.lastR===-1)return st.lastB;
    if(st.lastR===1)return st.lastP;
    return (st.lastP+1)%3;
  }
}

/* ----- Mouvement de Rosine à pied ou à vélo ----- */
function movePlayer(g,inp){
  const p=g.p,bike=g.kind==='bike';
  const dir=(inp.r?1:0)-(inp.l?1:0);
  if(bike){p.vx+=(2.0+dir*.9-p.vx)*.12;p.facing=1;}
  else{
    const ice=LEVELS[g.li].ice&&p.onGround;
    if(dir){p.vx+=dir*(ice?.07:p.onGround?.2:.14);p.facing=dir;}
    else if(p.onGround){p.vx*=ice?.95:.78;if(Math.abs(p.vx)<.05)p.vx=0;}
    else p.vx*=.97;
    p.vx=Math.max(-1.7,Math.min(1.7,p.vx));
  }
  if(inp.jumpP)p.buf=7;else if(p.buf>0)p.buf--;
  if(p.onGround)p.coy=6;else if(p.coy>0)p.coy--;
  if(p.buf>0&&p.coy>0){p.vy=-(bike?5.9:5.6)-(g.boots?.5:0);p.buf=0;p.coy=0;p.onGround=false;g.ev.push('jump');}
  if(!inp.jump&&p.vy<-2.4&&!p.spr)p.vy*=.7;
  if(p.vy>=0)p.spr=false;
  p.vy=Math.min(p.vy+.3,6);
  if(inp.atkP&&p.atkCd<=0){p.atkT=16;p.atkCd=22;g.ev.push('swing');}
  if(p.atkT>0)p.atkT--;
  if(p.atkCd>0)p.atkCd--;
  if(p.inv>0)p.inv--;
  const rx=moveBox(g,p,p.vx,0);
  if(rx.hit){p.vx=0;if(bike)hurt(g,p.x+p.w+8);}
  const ry=moveBox(g,p,0,p.vy);
  if(ry.hit){
    if(p.vy>0)p.onGround=true;
    else{
      const cx=p.x+p.w/2;let best=null,bd=1e9;
      for(const t of ry.tiles){const d=Math.abs(t.tx*T+8-cx);if(d<bd){bd=d;best=t;}}
      if(best)hitTile(g,best.tx,best.ty);
    }
    p.vy=0;
  }else p.onGround=false;
  p.anim+=Math.abs(p.vx);
  if(p.atkT>=5&&p.atkT<=12){
    const hb=swingBox(p,g);
    const x0=Math.floor(hb.x/T),x1=Math.floor((hb.x+hb.w-1)/T),y0=Math.floor(hb.y/T),y1=Math.floor((hb.y+hb.h-1)/T);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)hitTile(g,tx,ty);
    for(const e of g.ents)if(e.alive&&!e.hard&&aabb(hb,e))killEnemy(g,e);
  }
}
/* ----- Vol en libellule-hélico : A pour monter, B pour tirer des étincelles ----- */
function moveCopter(g,inp){
  const p=g.p;
  const dir=(inp.r?1:0)-(inp.l?1:0);
  p.facing=1;
  p.vx+=(1.3+dir*.8-p.vx)*.1;
  p.vy+=inp.jump?-.22:.1;
  p.vy=Math.max(-2.2,Math.min(2.0,p.vy));
  if(p.inv>0)p.inv--;
  if(p.atkCd>0)p.atkCd--;
  if(p.atkT>0)p.atkT--;
  if(inp.atkP&&p.atkCd<=0){p.atkCd=14;p.atkT=6;g.shots.push({x:p.x+p.w,y:p.y+4,w:4,h:4,vx:3.6,life:60});g.ev.push('swing');}
  const rx=moveBox(g,p,p.vx,0);if(rx.hit)p.vx=0;
  const ry=moveBox(g,p,0,p.vy);if(ry.hit)p.vy*=-.3;
  if(p.y<0){p.y=0;if(p.vy<0)p.vy=0;}
  p.onGround=false;p.anim+=2;
  const x0=Math.floor((p.x-1)/T),x1=Math.floor((p.x+p.w)/T),y0=Math.floor((p.y-1)/T),y1=Math.floor((p.y+p.h)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if((g.tiles[ty]||[])[tx]===5&&aabb({x:p.x-1,y:p.y-1,w:p.w+2,h:p.h+2},{x:tx*T,y:ty*T,w:T,h:T}))hurt(g,tx*T+8);
  }
}

function update(g,inp){
  if(g.status!=='play')return;
  g.t++;
  const air=g.kind==='copter',p=g.p;
  if(air)moveCopter(g,inp);else movePlayer(g,inp);
  /* étincelles */
  for(let i=g.shots.length-1;i>=0;i--){
    const s=g.shots[i];s.x+=s.vx;s.life--;
    let dead=s.life<=0||solidAt(g,Math.floor((s.x+s.w)/T),Math.floor((s.y+2)/T));
    for(const e of g.ents)if(!dead&&e.alive&&aabb(s,e)){if(!e.hard)killEnemy(g,e);dead=true;}
    if(dead)g.shots.splice(i,1);
  }
  /* ennemis */
  for(const e of g.ents){
    if(!e.alive)continue;
    if(e.t==='spring'){
      if(e.sq>0)e.sq--;
      if(!air&&p.vy>.5&&aabb(p,{x:e.x,y:e.y-3,w:e.w,h:e.h+3})&&(p.y+p.h-e.y)<9){p.vy=-8.4;p.spr=true;p.onGround=false;e.sq=14;g.ev.push('jump');}
      continue;
    }
    updateEnemy(g,e);
    if(!e.alive||(e.t==='fire'&&!e.on))continue;
    if(aabb(p,e)){
      const stomp=!air&&!e.spiky&&p.vy>.5&&(p.y+p.h-e.y)<9;
      if(stomp){killEnemy(g,e);p.vy=inp.jump?-5.4:-3.8;g.ev.push('stomp');}
      else hurt(g,e.x+e.w/2);
    }
  }
  if(g.starT>0){g.starT--;p.inv=Math.max(p.inv,2);}
  if(g.magnet)for(const m of g.gems){const dx=p.x+5-m.x-4,dy=p.y+7-m.y-4,d=Math.hypot(dx,dy);if(d<44&&d>1){m.x+=dx/d*2.2;m.y+=dy/d*2.2;}}
  if(g.shop&&!g.shopDone){
    if(aabb(p,g.shop.door)){g.status='shop';return;}
    if(p.x>g.shop.x+g.shop.w+10)g.shopDone=true;
  }
  /* piques */
  {
    const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-1)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h-1)/T);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)
      if(g.tiles[ty]&&g.tiles[ty][tx]===6&&aabb(p,{x:tx*T+2,y:ty*T+8,w:12,h:8}))hurt(g,tx*T+8);
  }
  /* gemmes et cœurs */
  for(let i=g.gems.length-1;i>=0;i--){
    const m=g.gems[i];
    if(aabb(p,{x:m.x,y:m.y,w:8,h:8})){g.gems.splice(i,1);g.gemCount++;g.ev.push('gem');spark(g,m.x+4,m.y+4,'#5ee6d0',4,.9);}
  }
  for(let i=g.items.length-1;i>=0;i--){
    const m=g.items[i];
    if(aabb(p,m)){g.items.splice(i,1);g.hearts=Math.min(MAXH,g.hearts+1);g.ev.push('heart');spark(g,m.x+4,m.y+4,'#ff4d7a',8,1.1);}
  }
  /* points de reprise, chute */
  for(let i=g.cpi+1;i<g.cps.length;i++)if(p.x>g.cps[i]){g.cpi=i;g.toast='Point de reprise';g.toastT=100;g.ev.push('cp');}
  if(!air&&p.y>ROWS*T+20){
    g.hearts--;g.ev.push('hurt');
    if(g.hearts<=0){g.status='dead';g.ev.push('die');}else respawn(g);
  }
  /* boss : au contact, un duel commence */
  const b=g.boss;
  if(b&&!b.defeated){
    if(b.cd>0)b.cd--;
    if(b.hover)b.yy=b.y+Math.sin(g.t*.05)*6;
    if(g.status==='play'&&p.x>b.x0-15*T){
      if(!b.seen){b.seen=true;g.toast=BOSSES[b.kind].name+' bloque le portail !';g.toastT=150;}
      b.mv=false;
      if(!b.hover&&b.cd<=0){
        const d=p.x+p.w/2-(b.x+b.w/2);
        if(Math.abs(d)>6){b.x+=Math.sign(d)*(b.kind===0?.55:.45);b.mv=true;}
        b.x=Math.max(b.x0-7*T,Math.min(b.x0+2*T,b.x));
      }
      if(++b.fire>=135){
        b.fire=0;
        if(b.x-g.camX<VW){
          const k=b.kind;
          if(!b.hover&&k%2===0)g.ents.push({t:'orb',k:0,x:b.x-4,y:GR*T-10,w:10,h:10,vx:-1.2,life:300,alive:true,step:0});
          else if(!b.hover)g.ents.push({t:'orb',k:1,x:b.x-4,y:GR*T-28,w:10,h:8,vx:-1.4,life:300,alive:true,spiky:true});
          else g.ents.push({t:'orb',k:2,x:b.x-4,y:Math.max(8,Math.min(ROWS*T-30,p.y)),w:9,h:9,vx:-1.5,life:300,alive:true,spiky:true});
        }
      }
    }
    if(g.status==='play'&&b.cd<=0&&(aabb(p,{x:b.x,y:b.hover?b.yy-8:b.y-60,w:b.w,h:b.hover?b.h+16:b.h+60})||(air&&p.x+p.w>=b.x)))g.status='duel';
  }
  if(g.status==='play'&&aabb(p,g.portal)&&(!b||b.defeated)){g.status='clear';g.ev.push('clear');}
  /* caméra, particules */
  const tgt=Math.max(0,Math.min(g.W*T-VW,p.x+p.w/2-VW/2+p.facing*24));
  g.camX+=(tgt-g.camX)*.1;
  for(let i=g.parts.length-1;i>=0;i--){
    const q=g.parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.12;
    if(--q.life<=0)g.parts.splice(i,1);
  }
  if(g.toastT>0)g.toastT--;
}

/* ---------- Dessin pixel : tout est tracé en rectangles sur un canvas de 256 x 160 ---------- */
let ctx=null;
let TINT=null;
const R=(x,y,w,h,c)=>{ctx.fillStyle=TINT?TINT(c):c;ctx.fillRect(x,y,w,h);};
const TINTS=new Map();
function tintFor(k){
  const deg=[0,150,290,60,200,330,100,30,240,170][k%10]+((k/10|0)*40);
  if(TINTS.has(k))return TINTS.get(k);
  const cache=new Map();
  const f=c=>{
    if(typeof c!=='string'||c[0]!=='#'||c.length!==7)return c;
    let v=cache.get(c);if(v)return v;
    let [r,g,b]=hex(c).map(q=>q/255);
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
    let h=0,sa=0;
    if(d>0){
      sa=l>.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60;
    }
    h=(h+deg)%360;
    const q=l<.5?l*(1+sa):l+sa-l*sa,p=2*l-q;
    const hu=t=>{t=(t+360)%360;return t<60?p+(q-p)*t/60:t<180?q:t<240?p+(q-p)*(240-t)/60:p;};
    const o=d>0?[hu(h+120),hu(h),hu(h-120)]:[l,l,l];
    v='rgb('+o.map(z=>Math.round(z*255)).join(',')+')';
    cache.set(c,v);return v;
  };
  TINTS.set(k,f);return f;
}
function pix(rows,pal,x,y){
  for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){
    const k=rows[j][i];
    if(k!=='.'){ctx.fillStyle=pal[k];ctx.fillRect(x+i,y+j,1,1);}
  }
}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}

function hills(par,base,color,amp,f1,f2,cx){
  ctx.fillStyle=color;
  for(let px=0;px<VW;px+=2){
    const wx=px+cx*par,h=amp+Math.sin(wx*f1)*amp*.5+Math.sin(wx*f2+1)*amp*.25;

/* Rosine : lutine à cheveux roses, oreilles pointues, robe rose, baguette étoilée. Dessinée tournée vers la droite. */
function lutine(p,t){
  const HAIR='#ff6fb5',HAIRL='#ff9fd2',HAIRD='#d93d8f',SKIN='#ffd9b8',DRESS='#ff8fcb',DRESSD='#e0509a',EYE='#3a1d4d',GOLD='#ffd84a';
  const air=!p.onGround,run=p.onGround&&Math.abs(p.vx)>.3;
  const f=run?((p.anim/4)|0)%4:0;
  const b=(run&&(f===1||f===3))?1:0;
  const fl=run?(f%2):((t>>5)&1);
  /* mèche arrière */
  R(1,4+b+fl,3,6,HAIR);R(0,7+b+fl,2,4,HAIR);R(2,4+b+fl,1,5,HAIRD);
  /* jambes */
  if(air){R(5,13,3,2,SKIN);R(8,13,3,2,SKIN);R(5,15,3,1,DRESSD);R(8,15,3,1,DRESSD);}
  else{
    const lx=[[5,9],[6,8],[7,7],[6,8]][f];
    R(lx[0],14,2,1,SKIN);R(lx[1],14,2,1,SKIN);R(lx[0],15,2,1,DRESSD);R(lx[1],15,2,1,DRESSD);
  }
  /* robe */
  R(4,9+b,7,3,DRESS);R(3,11+b,9,2,DRESS);R(3,13,9,1,DRESSD);R(5,9+b,5,1,'#ffd1ea');
  /* bras */
  if(p.atkT>0){
    R(10,9+b,5,2,SKIN);
    if(p.atkT>10){R(14,3+b,1,7,'#a9712f');R(13,1+b,3,3,GOLD);R(14,2+b,1,1,'#ffffff');}
    else{const lw=p.longWand?30:0;R(14,9+b,4+lw,1,'#a9712f');R(17+lw,8+b,3,3,GOLD);R(18+lw,9+b,1,1,'#ffffff');if(lw)for(let i=0;i<lw;i+=6)R(16+i,8+b,1,1,'#ffd1ea');}
  }else R(9,10+b,2,2,SKIN);
  /* tête */
  R(5,4+b,7,5,SKIN);R(4,5+b,1,2,SKIN);R(3,4+b,1,1,SKIN);
  R(4,2+b,9,3,HAIR);R(10,4+b,3,2,HAIR);R(5,2+b,4,1,HAIRL);R(4,4+b,1,1,HAIR);
  R(5,1+b,2,2,GOLD);R(6,1+b,1,1,'#ffffff');
  R(10,6+b,1,2,EYE);R(9,8+b,2,1,'#ff9fb0');
}

}

function drawPlayer(g,cx){
  const p=g.p;
  if(p.inv>0&&!(g.starT>0)&&((g.t>>2)&1))return;
  p.longWand=!!g.wand;
  const x=Math.round(p.x-3-cx),y=Math.round(p.y-2);
  ctx.save();
  if(p.facing<0){ctx.translate(x+16,y);ctx.scale(-1,1);}else ctx.translate(x,y);
  const sk=LEVELS[g.li].skin;
  if(sk&&rideSkin(sk,g,p)){}
  else if(g.kind==='bike'){
    ctx.save();ctx.translate(1,-2);lutine(p,g.t);ctx.restore();
    const sp=((p.anim/3)|0)&1;
    R(2,12,10,1,'#ff6fb5');R(11,8,1,5,'#ff6fb5');R(10,7,3,1,'#2b1d44');R(3,9,3,1,'#2b1d44');R(5,10,1,3,'#ff6fb5');

let CURSKIN=null;
function draw(g){
  CURSKIN=LEVELS[g.li].skin||null;
  const th=THEMES[LEVELS[g.li].theme],cx=Math.round(g.camX),t=g.t;
  for(let i=0;i<20;i++)R(0,i*8,VW,8,th.bands[i]);
  if(th.stars)for(const s of STARS)if(s.y<(th.starMax||99))R(s.x|0,s.y|0,1,1,(((t>>1)+s.p)%70<4)?'#ffffff':'#b9b0e8');
  if(th.moon){
    for(let dy=-8;dy<=8;dy++){const w=Math.floor(Math.sqrt(64-dy*dy));R(206-w,24+dy,w*2,1,'#f6f0c8');}
    R(203,18,3,3,'#e4dca4');R(210,28,2,2,'#e4dca4');
  }
  for(let i=0;i<6;i++){
    const w=VW+80,x=Math.round((((i*97-cx*.12-t*.05)%w)+w)%w-40),y=14+((i*29)%46);
    R(x,y,26,6,th.cloud);R(x+5,y-4,14,5,th.cloud);R(x+3,y+6,20,2,th.cloudD);
  }
  hills(.3,128,th.hillFar,22,.021,.05,cx);
  hills(.55,138,th.hillNear,16,.034,.07,cx);
  const x0=Math.max(0,Math.floor(cx/T)),x1=Math.min(g.W-1,Math.floor((cx+VW)/T));
  for(let tx=x0;tx<=x1;tx++){
    if(g.tiles[ROWS-1][tx]===0){R(tx*T-cx,GR*T+2,16,VH,'#241040');R(tx*T-cx,GR*T,16,2,'#3b2466');}
  }
  for(let ty=0;ty<ROWS;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=g.tiles[ty][tx];
    if(c)drawTile(c,tx*T-cx,ty*T,tx,ty,th,t);
  }
  drawPortal(g.portal,cx,t);
  if(g.shop)drawShopHut(g,cx,t);
  for(const m of g.gems){
    const x=Math.round(m.x-cx);
    if(x<-10||x>VW)continue;
    pix(GEMROWS,GEMPAL,x,Math.round(m.y+Math.sin((t+m.x)*.08)*1.5));
  }
  for(const m of g.items){
    const x=Math.round(m.x-cx);
    pix(HEARTROWS,{'#':'#ff4d7a'},x,Math.round(m.y+Math.sin(t*.1)*1.5));
  }
  for(const e of g.ents){
    if(!e.alive)continue;
    if(e.x-cx<-20||e.x-cx>VW+20)continue;
    drawEnemy(e,cx,t);
  }
  const bs=g.boss;
  if(bs&&!bs.defeated)drawBoss(bs.kind,Math.round(bs.x-cx),Math.round(bs.hover?(bs.yy||bs.y):bs.y-(bs.mv?Math.abs(Math.sin(t*.22))*4:0)),t);
  for(const sh of g.shots){R(Math.round(sh.x-cx),Math.round(sh.y),4,3,'#ffd84a');R(Math.round(sh.x-cx)-3,Math.round(sh.y)+1,3,1,'#ffffff');}
  drawPlayer(g,cx);
  const p=g.p;
  if(g.kind!=='copter'&&p.atkT>=5&&p.atkT<=12){
    const hb=swingBox(p,g);
    for(let i=0;i<5;i++)R(Math.round(hb.x-cx+((i*7+t*2)%15)),Math.round(hb.y+((i*5+t)%14)),2,2,i%2?'#ffffff':'#ffd84a');
  }
  for(const q of g.parts)R(Math.round(q.x-cx),Math.round(q.y),2,2,q.c);
}

/* progression */
let prog={unlocked:1,best:[],muted:false,wallet:0,up:{heart:0}};
try{
  const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
  if(j){prog.unlocked=Math.max(1,Math.min(NLV,j.unlocked|0));prog.muted=!!j.muted;
    prog.best=Array.from({length:NLV},(_,q)=>(j.best&&j.best[q])|0);
    prog.wallet=Math.max(0,j.wallet|0);const u=j.up||{};
    prog.up={heart:Math.min(2,u.heart|0)};
    /* anciennes versions : les objets achetés pour toujours sont remboursés */
    if(!j.v3)prog.wallet+=(u.boots?50:0)+(u.wand?40:0)+15*Math.max(0,u.bubble|0);}
  }catch(e){}
if(prog.best.length!==NLV)prog.best=Array.from({length:NLV},(_,q)=>prog.best[q]|0);
function saveProg(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(Object.assign({v3:1},prog)));}catch(e){}}

/* sons */
let actx=null;
function ensureAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!actx||prog.muted)return;
  try{
    const t=actx.currentTime+(delay||0),o=actx.createOscillator(),gn=actx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    gn.gain.setValueAtTime(vol||.05,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(gn);gn.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}

const kb={l:0,r:0,j:0,a:0},tc={l:0,r:0,j:0,a:0},keys={l:0,r:0,j:0,a:0};
let latchJ=false,latchA=false,holdJ=0;
const padEls={};
document.querySelectorAll('#controls [data-k]').forEach(b=>{padEls[b.dataset.k]=b;});
function sync(){
  for(const k in keys){
    const v=(kb[k]||tc[k])?1:0;
    if(v&&!keys[k]){if(k==='j')latchJ=true;if(k==='a')latchA=true;}
    keys[k]=v;
    if(padEls[k])padEls[k].classList.toggle('on',!!v);
  }
}
const ptr=new Map();
function keyAt(x,y){const el=document.elementFromPoint(x,y),b=el&&el.closest?el.closest('[data-k]'):null;return b?b.dataset.k:null;}
function recalc(){tc.l=tc.r=tc.j=tc.a=0;for(const k of ptr.values())if(k)tc[k]=1;sync();}
const ctl=$('controls');
/* tactile : on relit tous les doigts posés à chaque événement (fiable en multi-touch) */
function touchSync(e){
  e.preventDefault();ensureAudio();
  tc.l=tc.r=tc.j=tc.a=0;
  for(const t of e.touches){const k=keyAt(t.clientX,t.clientY);if(k)tc[k]=1;}
  sync();
}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>ctl.addEventListener(n,touchSync,{passive:false}));
const isTouch=e=>e.pointerType==='touch';
ctl.addEventListener('pointerdown',e=>{if(isTouch(e))return;e.preventDefault();ensureAudio();ptr.set(e.pointerId,keyAt(e.clientX,e.clientY));recalc();});
ctl.addEventListener('pointermove',e=>{if(isTouch(e))return;if(ptr.has(e.pointerId)){ptr.set(e.pointerId,keyAt(e.clientX,e.clientY));recalc();}});
['pointerup','pointercancel'].forEach(n=>ctl.addEventListener(n,e=>{if(isTouch(e))return;ptr.delete(e.pointerId);recalc();}));
ctl.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{ptr.clear();kb.l=kb.r=kb.j=kb.a=0;recalc();});
const KEYMAP={ArrowLeft:'l',q:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',z:'j',w:'j',' ':'j',x:'a',j:'a',k:'a',Shift:'a'};
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='p'||k==='Escape'){if(!e.repeat)togglePause();return;}
  const m=KEYMAP[k];
  if(m&&S.mode==='play'){e.preventDefault();ensureAudio();kb[m]=1;sync();}
});
document.addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key,m=KEYMAP[k];
  if(m){kb[m]=0;sync();}
});

/* la marchande propose 3 objets, choisis d'après le contenu réel du niveau */
function advice(g){
  const c={fly:0,hog:0,hard:0,hop:0,gaps:0,spikes:0},why={},order=[];
  const add=(id,t)=>{if(!why[id]){why[id]=t;order.push(id);}};
  for(const e of g.ents){
    if(e.t==='bee'||e.t==='bird')c.fly++;
    else if(e.t==='hog')c.hog++;
    else if(e.t==='hop')c.hop++;
    else if(e.hard&&e.t!=='spring')c.hard++;
  }
  if(g.kind!=='copter')for(let x=12;x<g.W-20;x++)if(!g.tiles[GR][x])c.gaps++;
  for(let x=0;x<g.W;x++)if(g.tiles[GR-1][x]===6)c.spikes++;
  if(g.kind==='copter'){
    if(c.hard)add('star','Des portes de pierre bougent dans le ciel : l’étoile te laisse passer sans risque.');
    add('bubble',c.hard?'Les portes et les oiseaux font mal : la bulle encaisse un coup.':'Beaucoup d’oiseaux dans ce ciel : la bulle encaisse un coup.');
  }else{
    if(c.hard>=3)add('bubble','Rochers et flammes sont indestructibles : la bulle encaisse un coup.');
    if(c.gaps>=14||g.kind==='bike')add('boots','Beaucoup de trous et d’obstacles sur la route : saute plus haut.');
    if(c.fly>=4)add('wand','Des abeilles volent haut : la longue baguette les touche de loin.');
    if(c.hog>=3)add('wand','Des hérissons piquants, impossibles à écraser : tape-les de loin.');
    if(c.spikes>=3)add('bubble','Des piques sur le chemin : la bulle te protège.');
    if(c.hard>=3)add('star','Beaucoup d’obstacles indestructibles : l’étoile te rend invincible un moment.');
  }
  if(g.gems.length>=60)add('magnet','Beaucoup de gemmes sur le chemin : l’aimant te les rapporte.');
  const pick=order.slice(0,2);
  for(const id of ['bubble','boots','magnet','wand','star'])if(pick.length<2&&!pick.includes(id)){pick.push(id);why[id]=why[id]||'Un bon coup de pouce pour ce niveau.';}
  why.charm='Au bout du niveau, '+BOSSES[g.boss.kind].name+' t’attend pour un duel. Une seconde chance, ça aide !';
  pick.push('charm');
  return {ids:pick,why:why};
}

function drawHand(m,x,y,sc,flip){

  const bob=(d.phase==='shake')?Math.round(Math.abs(Math.sin(t*.21))*4):Math.round(Math.sin(t0*.08)*1.5);
  ctx.save();ctx.translate(18,112-50+(bob>>1));ctx.scale(3,3);

function duelStep(){
  const g=S.g,d=DU.st;if(!d)return;
  d.t++;
  if(d.phase==='shake'&&d.t>=70){
    const p=d.pend;d.phase='reveal';d.t=0;
    if(p.r>0){d.me++;d.msg=NAMES[p.m]+' bat '+NAMES[p.b].toLowerCase()+' : tu gagnes la manche !';SFX.win();}
    else if(p.r<0&&g.charm>0){g.charm--;p.r=0;p.charm=true;d.msg='Le porte-bonheur brille : manche rejouée !';SFX.bonus();}
    else if(p.r<0){d.bo++;d.msg=NAMES[p.b]+' bat '+NAMES[p.m].toLowerCase()+' : il gagne la manche.';SFX.lose();}
    else d.msg='Même signe : on recommence !';
    showDuel(g);
  }else if(d.phase==='reveal'&&d.t>=75){
    if(d.me>=2||d.bo>=2){
      d.phase='end';d.t=0;
      d.msg=d.me>=2?'Victoire ! Le gardien s’efface. +10 gemmes':'Perdu… Rosine recule d’un pas.';
      showDuel(g);
    }else{d.phase='choose';d.t=0;d.msg='Choisis ton signe !';showDuel(g);}
  }else if(d.phase==='end'&&d.t>=80){
    if(d.me>=2){

      g.boss.cd=90;g.status='play';g.p.vx=-2;g.p.vy=-2;g.p.inv=70;

      if(g.hearts<=0){g.status='dead';g.ev.push('die');S.mode='dead';showDead();}
      else{S.mode='play';hide();}
    }
    DU.st=null;duelTexts();
  }else if(d.phase==='shake')duelTexts();
}
function startLevel(li){
  ensureAudio();
  const o={heart:prog.up.heart};
  S.g=newGame(li,o);S.mode='play';hudKey='';lblKey='';
  S.g.toast='Niveau '+(li+1)+' · '+LEVELS[li].name;S.g.toastT=170;
  hide();
}
function togglePause(){
  if(S.mode==='play'){S.mode='pause';kb.l=kb.r=kb.j=kb.a=0;sync();showPause();}
  else if(S.mode==='pause'){S.mode='play';hide();}
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  ensureAudio();
  const a=b.dataset.act,li=+b.dataset.li;
  if(a==='start'||a==='again')startLevel(li);
  else if(a==='shop'){showShop('menu');}
  else if(a==='shop2'){showShop('back2');}
  else if(a==='back2'){showClear(S.g);}
  else if(a==='sel'){SHOPSEL=b.dataset.id;showShop(S.mode==='shop'?'leave':S.mode==='clear'?'back2':'menu');}
  else if(a==='leave'){leaveShop(S.g);S.mode='play';hudKey='';hide();}
  else if(a==='buy'){
    const id=b.dataset.id,lv=S.mode==='shop',g=S.g;
    const it=ITEMS.find(x=>x.id===id);
    if(!it)return;
    const have=lv?haveOf(it,g):prog.up.heart,price=it.price[Math.min(it.perm?prog.up.heart:0,it.price.length-1)];
    if(prog.wallet<price||have>=itemMax(it))return;
    prog.wallet-=price;
    if(id==='heart'){prog.up.heart++;if(lv){g.startHearts=Math.min(MAXH,g.startHearts+1);g.hearts=Math.min(MAXH,g.hearts+1);}}
    else if(id==='boots')g.boots=true;
    else if(id==='wand')g.wand=true;
    else if(id==='bubble')g.bubbles++;
    else if(id==='magnet')g.magnet=true;
    else if(id==='star')g.starT=600;
    else g.charm++;
    saveProg();SFX.buy();showShop(lv?'leave':S.mode==='clear'?'back2':'menu');
    hudKey='';
  }
  else if(a==='pick')duelPick(+b.dataset.m);
  else if(a==='resume')togglePause();
  else if(a==='menu')showTitle();
  else if(a==='retry'){const g=S.g;g.hearts=g.startHearts;g.status='play';g.deaths++;respawn(g);S.mode='play';hide();}
});
$('pauseBtn').addEventListener('click',()=>{ensureAudio();togglePause();});
$('muteBtn').addEventListener('click',()=>{ensureAudio();prog.muted=!prog.muted;setMuteLabel();saveProg();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play')togglePause();});

/* boucle : 60 images par seconde à pas fixe */
function step(){
  const g=S.g;
  if(S.mode==='play'){
    if(latchJ)holdJ=10;
    const inp={l:keys.l,r:keys.r,jump:keys.j||holdJ>0,jumpP:latchJ,atkP:latchA};
    if(holdJ>0)holdJ--;
    latchJ=latchA=false;
    update(g,inp);
    playEvents(g);
    if(g.status==='duel')startDuel(g);
    else if(g.status==='shop'){S.mode='shop';kb.l=kb.r=kb.j=kb.a=0;sync();SFX.bonus();showShop('leave');}
    else if(g.status==='dead'){S.mode='dead';kb.l=kb.r=kb.j=kb.a=0;sync();showDead();}
    else if(g.status==='clear'){
      S.mode='clear';kb.l=kb.r=kb.j=kb.a=0;sync();
      prog.unlocked=Math.max(prog.unlocked,Math.min(NLV,g.li+2));prog.wallet+=g.gemCount;
      prog.best[g.li]=Math.max(prog.best[g.li],g.gemCount);
      saveProg();showClear(g);
    }
  }else if(S.mode==='duel'){g.t++;duelStep();
  }else if(S.mode==='title'){
    g.t++;
    g.camX=(g.t*.35)%(g.W*T-VW-40);
  }else{g.t++;}
}
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=16.667){step();acc-=16.667;}
  draw(S.g);if(S.mode==='duel')drawDuelScene();updateHud(S.g);updateLabels(S.g);updateToast(S.g);
}
setMuteLabel();
showTitle();
requestAnimationFrame(frame);

</script>
