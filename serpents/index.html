<script>
const __pp=[];function keepAlive(p){__pp.push(p);p.on('disconnected',()=>{setTimeout(()=>{try{if(!p.destroyed&&p.disconnected)p.reconnect();}catch(e){}},600);});return p;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')__pp.forEach(p=>{try{if(!p.destroyed&&p.disconnected)p.reconnect();}catch(e){}});});

"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
class FakeConn{
  constructor(ch,me,other){this.ch=ch;this.me=me;this.other=other;this.h={};this.open=false;
    ch.addEventListener('message',e=>{const m=e.data;if(m.to!==me||m.from!==other)return;
      if(m.k==='data')this.h.data&&this.h.data(JSON.parse(JSON.stringify(m.d)));
      if(m.k==='close')this.h.close&&this.h.close();
      if(m.k==='open'&&!this.open){this.open=true;this.ch.postMessage({k:'ack',from:me,to:other});this.h.open&&this.h.open();}
      if(m.k==='ack'&&!this.open){this.open=true;this.h.open&&this.h.open();}});}
  on(n,f){this.h[n]=f;}
  send(d){this.ch.postMessage({k:'data',from:this.me,to:this.other,d:JSON.parse(JSON.stringify(d))});}
  close(){this.ch.postMessage({k:'close',from:this.me,to:this.other});}
}
class FakePeer{
  constructor(id){this.id=id||('c'+Math.random().toString(36).slice(2,8));this.ch=new BroadcastChannel('serpents'+'-fake');this.h={};
    this.ch.addEventListener('message',e=>{const m=e.data;if(m.to===this.id&&m.k==='hello'){const c=new FakeConn(this.ch,this.id,m.from);this.h.connection&&this.h.connection(c);c.ch.postMessage({k:'open',from:this.id,to:m.from});}});
    setTimeout(()=>this.h.open&&this.h.open(this.id),20);}
  on(n,f){this.h[n]=f;}
  connect(id){const c=new FakeConn(this.ch,this.id,id);setTimeout(()=>this.ch.postMessage({k:'hello',from:this.id,to:id}),30);return c;}
  destroy(){}
}
function mkPeer(id){
  if(/net=bc/.test(location.search))return new FakePeer(id);
  if(!window.Peer)throw new Error('La bibliothèque de connexion n’a pas pu se charger (es-tu connecté à Internet ?).');
  const cfg={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return keepAlive(id?new Peer(id,cfg):new Peer(cfg));
}

const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>CHARS[(Math.random()*CHARS.length)|0]).join('');
const KEY='serpents-v1',WK='cartes-v1';
function wal(){let j=null;try{j=JSON.parse(localStorage.getItem(WK)||'null');}catch(e){}if(!j)j={v:1,gems:20,own:{back:[0],court:[0],bg:[0]},sel:{back:0,court:0,bg:0},st:{sol:{p:0,w:0,best:0},fc:{p:0,w:0,best:0}},opt:{draw:3,snd:true}};if(typeof j.gems!=='number')j.gems=20;return j;}
function addGems(n){const j=wal();j.gems+=n;try{localStorage.setItem(WK,JSON.stringify(j));}catch(e){}gmUpdate();return j.gems;}
function gmUpdate(){$('gm').textContent=wal().gems+' 💎';}
let P={name:'',code:'',bots:1,w:0,l:0,six:true};try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const saveP=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};
function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2400);}
function openOv(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').hidden=false;}
function closeOv(){$('ov').hidden=true;}
function show(m){$('home').hidden=m!=='home';$('game').hidden=m!=='game';}
/* ================= RÈGLES ================= */

const PC=['#e03c31','#2f6fe0','#2fa84f','#f2c200','#a05ad0','#f08a2a'];
const JUMP={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100,16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const SPD=window.__spd||1;
let H=null,peer=null,conns=[],isHost=false,myIdx=0,V=null,roomCode='';
const NP=()=>H.pl.length;
function hlog(s){H.log=s;}
function view(){return {turn:H.turn,log:H.log,roll:H.roll,rolling:H.busy,over:H.over,win:H.win,six:H.six,pl:H.pl.map(q=>({name:q.name,pos:q.pos,bot:q.bot}))};}
function pushViews(){const v=view();H.pl.forEach((q,i)=>{if(q.bot)return;const m=Object.assign({me:i},v);if(i===0)setTimeout(()=>onView(m),0);else{const c=conns.find(x=>x.p===i);if(c&&c.conn&&c.conn.open)try{c.conn.send({t:'view',v:m});}catch(e){}}});maybeBot();}
function act(p,m){
  if(!H||H.over||H.busy||H.turn!==p||m.a!=='roll')return;
  const pl=H.pl[p],r=1+((Math.random()*6)|0);H.roll=r;H.busy=true;
  let t=pl.pos+r;if(t>100)t=200-t;
  pl.pos=t;hlog(pl.name+' lance : '+r+'.');pushViews();
  setTimeout(()=>{
    const j=JUMP[pl.pos];
    const fin=()=>{
      if(pl.pos===100){H.over=true;H.win=p;H.busy=false;hlog(pl.name+' arrive en haut !');return pushViews();}
      const again=H.six&&r===6;if(again)hlog(pl.name+' a fait 6 : il rejoue !');
      else H.turn=(H.turn+1)%NP();H.busy=false;pushViews();};
    if(j){pl.pos=j;hlog(pl.name+(j>t?' monte l’échelle ! 🪜':' glisse sur un serpent ! 🐍'));pushViews();setTimeout(fin,900*SPD);}
    else fin();
  },800*SPD);
}
function maybeBot(){if(!H||H.over||H.busy)return;const p=H.pl[H.turn];if(!p.bot)return;clearTimeout(H.bt);H.bt=setTimeout(()=>act(H.turn,{a:'roll'}),900*SPD);}
/* ================= accueil / réseau ================= */
function showHome(){
  leave();show('home');
  $('home').innerHTML='<img class="hero" src="icons/icon-192.png" alt=""><h1>Serpents et échelles</h1><p class="muted">Lance le dé, monte les échelles, évite les serpents : le premier arrivé à la case 100 gagne. Contre des robots, ou à plusieurs avec un code.</p>'+
   '<input id="nm" maxlength="12" placeholder="Ton prénom" value="'+esc(P.name)+'">'+
   '<div class="tabs"><span>Robots :</span>'+[1,2,3,4,5].map(n=>'<button data-b="'+n+'" class="'+(P.bots===n?'on':'')+'">'+n+'</button>').join('')+'</div>'+
   '<div class="tabs"><span>6 :</span>'+[[1,'Rejoue'],[0,'Normal']].map(([v,n])=>'<button data-s="'+v+'" class="'+((P.six?1:0)===v?'on':'')+'">'+n+'</button>').join('')+'</div>'+
   '<button class="ob" id="solo">Jouer contre les robots</button>'+
   '<button class="ob alt" id="host">Créer une partie en ligne</button>'+
   '<div class="join"><input id="cd" maxlength="4" placeholder="CODE" value="'+esc(P.code)+'" aria-label="Code de la partie" autocapitalize="characters"><button class="ob alt" id="joinB">Rejoindre</button></div>'+
   '<button class="ob alt" id="rl" style="margin-top:14px">📖 Règles</button><p class="muted sm">Victoires '+P.w+' · Défaites '+P.l+'</p>';
  const nm=()=>{const v=$('nm').value.trim().slice(0,12)||'Joueur';P.name=v;saveP();return v;};
  $('home').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{P.bots=+b.dataset.b;nm();saveP();showHome();});
  $('home').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{P.six=!!+b.dataset.s;nm();saveP();showHome();});
  $('solo').onclick=()=>startGame([nm()],P.bots);
  $('host').onclick=()=>hostOnline(nm());
  $('joinB').onclick=()=>{const c=$('cd').value.trim().toUpperCase();if(c.length!==4)return toast('Le code a 4 caractères.');P.code=c;nm();joinOnline(nm(),c);};
  $('rl').onclick=rules;
}
function rules(){openOv('<h2>Règles</h2><div style="text-align:left;font-size:14px"><p>Chacun son tour, lance le dé et avance ton pion. Si tu t’arrêtes au pied d’une <b>échelle</b> 🪜, tu montes ; sur la tête d’un <b>serpent</b> 🐍, tu glisses jusqu’à sa queue.</p><p>Il faut arriver pile sur la case 100 : si ton dé dépasse, tu avances jusqu’au bout puis tu reviens en arrière du reste. Avec l’option « 6 rejoue », un 6 te donne un tour de plus. Le premier arrivé à 100 gagne.</p></div><button class="ob" id="x">OK</button>');$('x').onclick=closeOv;}
function leave(){clearTimeout(H&&H.bt);try{conns.forEach(c=>c.conn&&c.conn.close());}catch(e){}try{if(peer)peer.destroy();}catch(e){}peer=null;conns=[];H=null;V=null;isHost=false;closeOv();}
function startGame(humans,bots){
  const names=humans.slice();const bn=['Luna','Comète','Orion','Nova','Astro'];for(let i=0;i<bots;i++)names.push(bn[i]);
  H={pl:names.map((n,i)=>({name:n,bot:i>=humans.length,pos:1})),turn:0,busy:false,over:false,six:!!P.six,log:'À '+names[0]+' de commencer.'};
  isHost=true;myIdx=0;show('game');pushViews();
}
function hostOnline(name){
  leave();isHost=true;myIdx=0;roomCode=genCode();show('home');$('home').innerHTML='<h2>Création de la partie…</h2>';
  const names=[name];
  const lobby=()=>{show('home');$('home').innerHTML='<h2>Ta partie</h2><p class="muted">Donne ce code à tes amis (jusqu’à 6 joueurs) :</p><div class="code">'+roomCode+'</div><div class="plr">'+names.map(n=>'<span>'+esc(n)+'</span>').join('')+'</div><div class="tabs"><span>+ Robots :</span>'+[0,1,2,3].map(n=>'<button data-b="'+n+'" class="'+((P.ob||0)===n?'on':'')+'">'+n+'</button>').join('')+'</div><button class="ob" id="go">Lancer la partie</button><button class="ob alt" id="back">Annuler</button>';
    $('home').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{P.ob=+b.dataset.b;lobby();});$('back').onclick=showHome;
    $('go').onclick=()=>{const bots=Math.min(P.ob||0,6-names.length);if(names.length+bots<2)return toast('Il faut au moins 2 joueurs (ajoute un robot).');
      conns.forEach(c=>{try{c.conn.send({t:'start'});}catch(e){}});startGame(names,bots);};};
  const open=tries=>{
    try{peer=mkPeer('serpents-'+roomCode);}catch(e){toast(e.message,5000);return showHome();}
    peer.on('open',lobby);
    peer.on('error',e=>{if(e.type==='unavailable-id'&&tries<5){roomCode=genCode();open(tries+1);}else{toast('Connexion impossible ('+(e.type||'erreur')+').',5000);showHome();}});
    peer.on('connection',c=>{
      const o={conn:c,p:-1};
      c.on('data',m=>{if(m.t==='hello'&&o.p<0){const nm=String(m.name||'Joueur').slice(0,12),full=()=>{try{c.send({t:'full'});}catch(e){}};if(H){const od=conns.find(x=>x.dead&&H.pl[x.p]&&H.pl[x.p].name===nm);if(od){conns[conns.indexOf(od)]=o;o.p=od.p;H.pl[o.p].bot=false;toast(nm+' est de retour !',3500);pushViews();maybeBot();}else full();}else if(names.length>=6)full();else{o.p=names.length;names.push(nm);conns.push(o);lobby();}}else if(o.p>0&&m.t==='act')act(o.p,m.a);});
      c.on('close',()=>{if(H){if(o.p>0&&conns.indexOf(o)>=0){o.dead=true;H.pl[o.p].bot=true;toast(H.pl[o.p].name+' a quitté : un robot joue à sa place (reconnexion possible).',5000);maybeBot();pushViews();}}else{const i=conns.indexOf(o);if(i>=0){conns.splice(i,1);names.splice(o.p,1);conns.forEach(x=>{if(x.p>o.p)x.p--;});lobby();}}});
    });
  };
  open(0);
}
function joinOnline(name,code){
  leave();show('home');$('home').innerHTML='<h2>Connexion…</h2><p class="muted">Recherche de la partie '+code+'</p><button class="ob alt" id="back">Annuler</button>';$('back').onclick=showHome;
  let opened=false;try{peer=mkPeer();}catch(e){toast(e.message,5000);return showHome();}
  const fail=m=>{toast(m,5000);showHome();};
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Aucune partie avec ce code.':'Connexion impossible ('+(e.type||'erreur')+').'));
  peer.on('open',()=>{const c=peer.connect('serpents-'+code,{reliable:true});peer.conn=c;
    c.on('open',()=>{opened=true;c.send({t:'hello',name});$('home').innerHTML='<h2>Connecté !</h2><p class="muted">En attente du lancement par l’hôte…</p><button class="ob alt" id="back">Quitter</button>';$('back').onclick=showHome;});
    c.on('data',m=>{if(m.t==='full')fail('La partie est complète ou déjà commencée.');else if(m.t==='view'){if($('game').hidden)show('game');onView(m.v);}});
    c.on('close',()=>{if(V&&!V.over){openOv('<h2>Connexion perdue</h2><p class="muted">Un robot joue à ta place. Reconnecte-toi avec le même code et le même nom pour reprendre.</p><button class="ob" id="rc">Se reconnecter</button><button class="ob alt" id="q">Quitter</button>');$('rc').onclick=()=>{closeOv();joinOnline(name,code);};$('q').onclick=showHome;}});});
  setTimeout(()=>{if(!opened)fail('Impossible de joindre la partie. Vérifie le code et ta connexion.');},15000);
}
function send(a){if(isHost)act(myIdx,a);else try{peer.conn.send({t:'act',a});}catch(e){toast('Connexion perdue.');}}
/* ================= affichage ================= */
const cell=n=>{const i=n-1,r=(i/10)|0,c=r%2?9-i%10:i%10;return {x:(c+.5)*10,y:(9-r+.5)*10};};
let built=false,lastRoll=0;
function buildBoard(){
  let h='<div id="bd"><div id="gr">';
  for(let r=9;r>=0;r--)for(let k=0;k<10;k++){const c=r%2?9-k:k;const n=r*10+c+1;h+='<div class="sq'+(n===100?' f':'')+'">'+n+'</div>';}
  h+='</div><div id="lay">';
  let si=0,li=0;
  for(const a in JUMP){const f=cell(+a),t=cell(JUMP[a]),up=JUMP[a]>+a;
    const hx=up?f.x:f.x,hy=f.y;const dx=t.x-f.x,dy=t.y-f.y,len=Math.hypot(dx,dy);
    const th=Math.atan2(-dx,dy)*180/Math.PI;const mx=(f.x+t.x)/2,my=(f.y+t.y)/2;
    if(up){const w=Math.min(8,Math.max(5,len/6.5));h+='<div class="sp" style="left:'+(mx-w/2)+'%;top:'+(my-len/2)+'%;width:'+w+'%;height:'+len+'%;background-image:url(img/la'+(li++%2)+'.webp);transform:rotate('+(Math.atan2(-dx,dy)*180/Math.PI+180)+'deg)"></div>';}
    else{const w=Math.min(11,Math.max(5.5,len/4.4));h+='<div class="sp" style="left:'+(mx-w/2)+'%;top:'+(my-len/2)+'%;width:'+w+'%;height:'+len+'%;background-image:url(img/sn'+(si++%4)+'.webp);transform:rotate('+th+'deg)"></div>';}
  }
  h+='<div id="pws"></div></div></div>';
  return h;
}
function onView(v){V=v;render();if(v.over)setTimeout(endDialog,900);}
function render(){
  const v=V;if(!v)return;const me=v.me,mine=v.turn===me&&!v.over&&!v.rolling;
  $('st').textContent=v.over?'Partie terminée':(v.turn===me?'À toi de lancer !':'Tour de '+v.pl[v.turn].name);
  if(!$('bd')){$('main').innerHTML='<div id="ps"></div>'+buildBoard()+'<div id="lg"></div><div id="dice">🎲</div><div id="ac"><button class="ob" id="rb">Lancer le dé</button></div>';
    $('rb').onclick=()=>{if(!(V.turn===V.me&&!V.over&&!V.rolling))return toast(V.over?'Partie terminée.':'Pas ton tour.');send({a:'roll'});};}
  $('ps').innerHTML=v.pl.map((q,i)=>'<div class="pl2'+(v.turn===i?' t':'')+'"><b><i style="background:'+PC[i]+'"></i>'+esc(q.name)+(i===me?' (toi)':'')+'</b><span>case '+q.pos+'</span></div>').join('');
  const pws=$('pws');
  v.pl.forEach((q,i)=>{let el=pws.querySelector('[data-i="'+i+'"]');if(!el){el=document.createElement('div');el.className='pw';el.dataset.i=i;el.style.backgroundImage='url(img/pw'+i+'.webp)';pws.appendChild(el);}
    const c=cell(q.pos),off=[[-2.6,-1],[2.6,-1],[-2.6,1.4],[2.6,1.4],[0,-2.2],[0,2.6]][i];el.style.left=(c.x+off[0])+'%';el.style.top=(c.y+off[1])+'%';el.classList.toggle('t',v.turn===i&&!v.over);});
  $('lg').textContent=v.log||'';
  const d=$('dice');if(v.roll&&v.roll!==lastRoll||v.rolling){d.textContent=v.roll||'🎲';d.classList.remove('r');void d.offsetWidth;d.classList.add('r');}lastRoll=v.roll;
  $('rb').disabled=!mine;$('rb').style.opacity=mine?1:.4;
}
function endDialog(){
  const v=V;if(!v||!v.over)return;if(endDialog.on)return;endDialog.on=1;const iWon=v.win===v.me;
  if(iWon){addGems(Math.min(10,v.pl.length*2));P.w++;}else{addGems(1);P.l++;}saveP();
  openOv('<h2>'+(iWon?'🏆 Tu as gagné !':esc(v.pl[v.win].name)+' gagne la partie')+'</h2><p class="gold">+'+(iWon?Math.min(10,v.pl.length*2):1)+' 💎</p><button class="ob" id="q">Menu</button>');$('q').onclick=()=>{endDialog.on=0;showHome();};
}
$('bmenu').onclick=()=>{if(V&&!V.over){openOv('<h2>Menu</h2><button class="ob alt" id="rl">📖 Règles</button><button class="ob" id="n">Reprendre</button><button class="ob alt" id="y">Quitter la partie</button>');$('n').onclick=closeOv;$('rl').onclick=rules;$('y').onclick=showHome;}else showHome();};
gmUpdate();showHome();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.__l={get H(){return H;},get V(){return V;},act,startGame,JUMP};
</script>
</body>
</html>
