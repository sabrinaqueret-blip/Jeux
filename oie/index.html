<style>
:root{--bg:#14202e;--panel:#1f3147;--ink:#fbefd9;--muted:#cdb892;--gold:#f0c060;--ca:#e8453c;--cb:#ffd84a;--bd1:#2a4a8a;--bd2:#1a2f66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);background-image:radial-gradient(circle at 50% 0,#2b4468,#14202e 70%)}
section{max-width:520px;margin:0 auto;padding:10px 0}
h1{margin:6px 0;text-align:center;font-size:28px}h2{text-align:center;margin:8px 0}
.muted{color:var(--muted);text-align:center;margin:4px 0 10px}
button,input{font:inherit}
.ob{display:block;width:100%;margin:8px 0;padding:14px;border-radius:16px;border:2px solid var(--gold);background:var(--gold);color:#2a1c12;font-weight:800;background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 58%);text-shadow:0 1px 0 #ffffff55;transition:transform .08s}
.ob:active{transform:translateY(3px)}
.ob.alt{background:transparent;color:var(--ink);border-color:var(--muted);text-shadow:none;background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--muted);background:var(--panel);color:var(--ink);text-align:center}

.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:8px 0}
.tabs button{padding:8px 14px;border-radius:999px;border:2px solid var(--muted);background:transparent;color:var(--ink);font-weight:700}

#hud{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 0 2px;font-weight:800}
#hud span,#hud button{background:#0009;padding:5px 10px;border-radius:999px;border:0;color:var(--ink);font:inherit;font-weight:800;font-size:14px;white-space:nowrap}
#hud .gm{color:var(--gold)}#hud #st{flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hero{display:block;width:108px;height:108px;margin:0 auto 4px;border-radius:26px;box-shadow:0 12px 26px #000b,0 0 0 2px #ffffff33 inset}
#home h1{background:linear-gradient(90deg,#ffe08a,#ff9ad0);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:32px}
.themes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}.themes button{width:56px;height:44px;border-radius:12px;border:3px solid transparent;padding:0;background:#0006;font-size:20px;color:var(--ink)}.themes button.on{border-color:var(--gold)}

body{background-image:radial-gradient(circle at 50% 0,#3a3a52,#14141e 70%);--gold:#e8c46a}
#bw{width:min(100%,calc(100vh - 300px));margin:6px auto 0}
#bd{position:relative;width:100%;aspect-ratio:1;border-radius:6px;background:url(img/board.webp) center/100% 100%;box-shadow:0 10px 26px #000b}
#fl{position:absolute;left:0;top:0;width:100%;height:100%}
#fl>*{position:absolute}
.oc{background:linear-gradient(145deg,#fbf3dc,#efe0b8);border:1.5px solid #7a6238;border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px #fffaf0aa,inset 0 -3px 5px #b8975a44,0 1px 2px #0005}
.oc:nth-child(even){background:linear-gradient(145deg,#f3ead0,#e6d3a6)}
.oc.g{background:linear-gradient(145deg,#fff1b8,#f0c960);border-color:#9a6f14}
.oc.w{background:linear-gradient(145deg,#dcebf2,#aacbdc);border-color:#3f6a86}
.oc.d{background:linear-gradient(145deg,#f4d6cc,#dba08f);border-color:#8a3a2a}
.oc.v{background:linear-gradient(145deg,#d9ecd0,#a8cf9a);border-color:#4a7a3a}
.oc.st{background:linear-gradient(145deg,#fff1b8,#e8b94a);border-color:#8a5a10}
.oc.cr{background:radial-gradient(circle,#fff6c8,#eec24a);border-color:#8a5a10;box-shadow:0 0 8px #ffd54a,inset 0 0 0 2px #fffaf0aa}
.oc b{position:absolute;left:3px;top:1px;font:700 var(--nf,9px)/1 Georgia,'Times New Roman',serif;color:#4a3414}
.oc img{width:72%;height:72%;object-fit:contain;margin-top:6%}
.pw{width:var(--pw,6.6%);transform:translate(-50%,-74%);transition:left .4s ease,top .4s ease;filter:drop-shadow(0 2px 2px #000a);pointer-events:none}
#dz{display:flex;align-items:center;gap:10px;margin:10px 0}
#dz .dd{display:flex;gap:6px}#dz .dd img{width:52px;height:52px;filter:drop-shadow(0 3px 4px #000a)}#dz .dd img.r{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-25deg) translateY(-8px)}50%{transform:rotate(25deg) translateY(4px)}80%{transform:rotate(-10deg)}}
#dz .ob{margin:0;flex:1}
#ps{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.pl2{flex:1;min-width:76px;background:#0008;border-radius:14px;padding:5px;text-align:center;font-size:12px;font-weight:700;border:2px solid transparent}
.pl2.t{border-color:var(--gold);box-shadow:0 0 12px #e8c46a88}.pl2 b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl2 img{height:22px;width:auto;vertical-align:middle;margin-right:4px}

.lgd{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:11px;color:var(--muted);margin-top:6px}.lgd span img{width:14px;height:14px;vertical-align:middle;margin-right:2px}

<body>
<section id="home"></section>
<section id="game" hidden>
  <div id="hud"><button type="button" id="bmenu" aria-label="Menu">☰</button><span id="st"></span><span class="gm" id="gm">0 💎</span></div>
  <div id="main"></div>
</section>
<div id="ov" hidden></div><div id="toast" hidden></div>
<script src="peerjs.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
class FakeConn{
  constructor(ch,me,other){this.ch=ch;this.me=me;this.other=other;this.h={};this.open=false;
    ch.addEventListener('message',e=>{const m=e.data;if(m.to!==me||m.from!==other)return;
      if(m.k==='data')this.h.data&&this.h.data(JSON.parse(JSON.stringify(m.d)));
      if(m.k==='close')this.h.close&&this.h.close();
      if(m.k==='open'&&!this.open){this.open=true;this.ch.postMessage({k:'ack',from:me,to:other});this.h.open&&this.h.open();}
      if(m.k==='ack'&&!this.open){this.open=true;this.h.open&&this.h.open();}});}
  on(n,f){this.h[n]=f;}
  send(d){this.ch.postMessage({k:'data',from:this.me,to:this.other,d:JSON.parse(JSON.stringify(d))});}
  close(){this.ch.postMessage({k:'close',from:this.me,to:this.other});}
}
class FakePeer{
  constructor(id){this.id=id||('c'+Math.random().toString(36).slice(2,8));this.ch=new BroadcastChannel('dominos'+'-fake');this.h={};
    this.ch.addEventListener('message',e=>{const m=e.data;if(m.to===this.id&&m.k==='hello'){const c=new FakeConn(this.ch,this.id,m.from);this.h.connection&&this.h.connection(c);c.ch.postMessage({k:'open',from:this.id,to:m.from});}});
    setTimeout(()=>this.h.open&&this.h.open(this.id),20);}
  on(n,f){this.h[n]=f;}
  connect(id){const c=new FakeConn(this.ch,this.id,id);setTimeout(()=>this.ch.postMessage({k:'hello',from:this.id,to:id}),30);return c;}
  destroy(){}
}
function mkPeer(id){
  if(/net=bc/.test(location.search))return new FakePeer(id);
  if(!window.Peer)throw new Error('La bibliothèque de connexion n’a pas pu se charger (es-tu connecté à Internet ?).');
  const cfg={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return id?new Peer(id,cfg):new Peer(cfg);
}

const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>CHARS[(Math.random()*CHARS.length)|0]).join('');
const KEY='oie-v1',WK='cartes-v1';
function wal(){let j=null;try{j=JSON.parse(localStorage.getItem(WK)||'null');}catch(e){}if(!j)j={v:1,gems:20,own:{back:[0],court:[0],bg:[0]},sel:{back:0,court:0,bg:0},st:{sol:{p:0,w:0,best:0},fc:{p:0,w:0,best:0}},opt:{draw:3,snd:true}};if(typeof j.gems!=='number')j.gems=20;return j;}
function addGems(n){const j=wal();j.gems+=n;try{localStorage.setItem(WK,JSON.stringify(j));}catch(e){}gmUpdate();return j.gems;}
function gmUpdate(){$('gm').textContent=wal().gems+' 💎';}
let P={name:'',code:'',bots:1,w:0,l:0,ob:0};try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const saveP=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};
function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2400);}
function openOv(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').hidden=false;}
function closeOv(){$('ov').hidden=true;}
function show(m){$('home').hidden=m!=='home';$('game').hidden=m!=='game';}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const mod=(x,n)=>((x%n)+n)%n;
let H=null,peer=null,conns=[],isHost=false,myIdx=0,V=null,roomCode='';
function nextRound(){}

const GEESE=[5,9,14,18,23,27,32,36,41,45,50,54,59];
const SPI={6:'bridge',19:'inn',26:'dice',31:'well',42:'maze',52:'prison',53:'dice',58:'skull',60:'crown'};
const NAMES={6:'Le pont',19:'L’auberge',26:'Les dés',31:'Le puits',42:'Le labyrinthe',52:'La prison',53:'Les dés',58:'La mort',60:'Le jardin de l’oie'};
const SPIRAL=(()=>{const n=8,g=[];let top=0,bot=n-1,left=0,right=n-1;while(top<=bot&&left<=right){for(let c=left;c<=right;c++)g.push([top,c]);top++;for(let r=top;r<=bot;r++)g.push([r,right]);right--;if(top<=bot){for(let c=right;c>=left;c--)g.push([bot,c]);bot--;}if(left<=right){for(let r=bot;r>=top;r--)g.push([r,left]);left++;}}return g;})();
function hlog(s){H.log=s;}
const NP=()=>H.pl.length;
const bounce=p=>p>60?120-p:p;
function settle(i,n,trail){
  const pl=H.pl[i];let guard=0,jumped=false,msgs=[];const seen=new Set();
  while(guard++<30){
    const p=pl.pos;
    if(p===60){H.over=true;H.win=i;msgs.push(pl.name+' atteint le jardin de l’oie : victoire !');break;}
    if(GEESE.includes(p)){const nb=bounce(p+n);if(nb===p||seen.has(p)){seen.add(p);msgs.push('Une oie, mais impossible d’avancer de '+n+' : '+pl.name+' reste sur place.');break;}seen.add(p);pl.pos=nb;trail.push(pl.pos);H.again=true;msgs.push('Une oie ! '+pl.name+' avance encore de '+n+' et rejoue.');continue;}
    if(p===6){pl.pos=12;trail.push(12);msgs.push('Le pont : '+pl.name+' passe à la case 12.');continue;}
    if(p===19){pl.skip=1;msgs.push('L’auberge : '+pl.name+' passera un tour.');break;}
    if((p===26||p===53)&&!jumped){jumped=true;pl.pos=p===26?53:26;trail.push(pl.pos);msgs.push('Les dés : '+pl.name+' file à la case '+pl.pos+'.');continue;}
    if(p===31||p===52){H.pl.forEach(q=>{if(q!==pl&&q.pos===p&&q.stuck){q.stuck=false;msgs.push(q.name+' est libéré.');}});pl.stuck=true;msgs.push((p===31?'Le puits : ':'La prison : ')+pl.name+' attend qu’un autre joueur arrive.');break;}
    if(p===42){pl.pos=30;trail.push(30);msgs.push('Le labyrinthe : '+pl.name+' recule à la case 30.');continue;}
    if(p===58){pl.pos=0;trail.push(0);msgs.push('La mort ! '+pl.name+' retourne au départ.');break;}
    break;
  }
  if(msgs.length)hlog(msgs.join(' '));
}
function nextTurn(i){
  if(H.over)return;if(H.again){H.again=false;return;}
  if(H.pl.every(q=>q.stuck))H.pl.forEach(q=>q.stuck=false);
  let k=i;for(let g=0;g<NP()*3;g++){k=mod(k+1,NP());const q=H.pl[k];if(q.stuck)continue;if(q.skip>0){q.skip--;H.log+=' '+q.name+' passe son tour.';continue;}H.turn=k;return;}
  H.turn=i;
}
function view(p){return {me:p,turn:H.turn,dice:H.dice,roll:H.roll,trail:H.trail,log:H.log,over:H.over,win:H.win,pl:H.pl.map(q=>({name:q.name,pos:q.pos,skip:q.skip,stuck:q.stuck,pw:q.pw,bot:q.bot}))};}
function pushViews(){H.pl.forEach((q,i)=>{if(q.bot)return;const v=view(i);if(i===0)setTimeout(()=>onView(v),0);else{const c=conns.find(x=>x.p===i);if(c&&c.conn&&c.conn.open)try{c.conn.send({t:'view',v});}catch(e){}}});maybeBot();}
function act(p,m){
  if(!H||H.over||H.turn!==p||m.a!=='roll')return 'invalid';const pl=H.pl[p];
  const a=1+((Math.random()*6)|0),n=a;H.dice=[a];H.roll=(H.roll||0)+1;H.again=false;
  const trail=[pl.pos];hlog(pl.name+' fait '+n+'.');
  {pl.first=false;pl.pos=bounce(pl.pos+n);trail.push(pl.pos);settle(p,n,trail);}
  H.trail={i:p,steps:trail};
  if(!H.over)nextTurn(p);
  pushViews();
}
/* ---- robots ---- */
function maybeBot(){if(!H||H.over)return;const p=H.pl[H.turn];if(!p.bot)return;clearTimeout(H.bt);H.bt=setTimeout(botStep,(window.__spd||1)*(1500+((H.trail&&H.trail.steps.length)||0)*520));}
function botStep(){if(!H||H.over)return;const i=H.turn;if(!H.pl[i].bot)return;act(i,{a:'roll'});}
/* ================= accueil / réseau ================= */
function showHome(){
  leave();show('home');
  $('home').innerHTML='<img class="hero" src="icons/icon-192.png" alt=""><h1>Jeu de l’oie</h1><p class="muted">Le grand classique : 60 cases, des oies qui font avancer, un pont, un puits, une prison… Le premier au jardin de l’oie gagne. Contre des robots, ou à plusieurs avec un code.</p>'+
   '<input id="nm" maxlength="12" placeholder="Ton prénom" value="'+esc(P.name)+'">'+
   '<div class="tabs"><span>Robots :</span>'+[1,2,3,4,5].map(n=>'<button data-b="'+n+'" class="'+(P.bots===n?'on':'')+'">'+n+'</button>').join('')+'</div>'+
   '<button class="ob" id="solo">Jouer contre les robots</button>'+
   '<button class="ob alt" id="host">Créer une partie en ligne</button>'+
   '<div class="join"><input id="cd" maxlength="4" placeholder="CODE" value="'+esc(P.code)+'" aria-label="Code de la partie" autocapitalize="characters"><button class="ob alt" id="joinB">Rejoindre</button></div>'+
   '<button class="ob alt" id="rl" style="margin-top:14px">📖 Règles</button><p class="muted sm">Victoires '+P.w+' · Défaites '+P.l+'</p>';
  const nm=()=>{const v=$('nm').value.trim().slice(0,12)||'Joueur';P.name=v;saveP();return v;};
  $('home').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{P.bots=+b.dataset.b;nm();saveP();showHome();});
  $('solo').onclick=()=>startGame([nm()],P.bots);
  $('host').onclick=()=>hostOnline(nm());
  $('joinB').onclick=()=>{const c=$('cd').value.trim().toUpperCase();if(c.length!==4)return toast('Le code a 4 caractères.');P.code=c;nm();joinOnline(nm(),c);};
  $('rl').onclick=rules;
}
function rules(){openOv('<h2>Règles</h2><div style="text-align:left;font-size:13px"><p>Lance le dé et avance d’autant de cases. Il faut arriver <b>exactement</b> à la case 60 : si tu dépasses, tu recules de l’excédent.</p><p>🪿 <b>Oie</b> (5, 9, 14, 18…) : tu avances encore du même nombre et tu rejoues.<br>🌉 <b>Pont</b> (6) : direction la case 12.<br>🏠 <b>Auberge</b> (19) : tu passes un tour.<br>🎲 <b>Dés</b> (26 et 53) : tu files à l’autre case des dés.<br>🪣 <b>Puits</b> (31) et ⛓️ <b>prison</b> (52) : tu restes bloqué jusqu’à ce qu’un autre joueur arrive sur la case.<br>🌀 <b>Labyrinthe</b> (42) : retour à la case 30.<br>💀 <b>Mort</b> (58) : retour au départ.<br>👑 <b>60</b> : le jardin de l’oie, tu gagnes !</p><p>Au premier lancer, un 6 + 3 t’envoie à la case 26 et un 5 + 4 à la case 53.</p></div><button class="ob" id="x">OK</button>');$('x').onclick=closeOv;}
function leave(){clearTimeout(H&&H.bt);clearTimeout(anim.t);try{conns.forEach(c=>c.conn&&c.conn.close());}catch(e){}try{if(peer)peer.destroy();}catch(e){}peer=null;conns=[];H=null;V=null;isHost=false;built=false;endDialog.paid=0;closeOv();}
function startGame(humans,bots){
  const names=humans.slice();const bn=['Luna','Comète','Orion','Plume','Nougat'];for(let i=0;i<bots;i++)names.push(bn[i]);
  H={pl:names.map((n,i)=>({name:n,bot:i>=humans.length,pos:0,skip:0,stuck:false,first:true,pw:i%6})),turn:0,dice:[1],roll:0,trail:null,over:false,log:'À '+names[0]+' de lancer le dé !'};
  isHost=true;myIdx=0;built=false;endDialog.paid=0;show('game');pushViews();
}
function hostOnline(name){
  leave();isHost=true;myIdx=0;roomCode=genCode();show('home');$('home').innerHTML='<h2>Création de la partie…</h2>';
  const names=[name];
  const lobby=()=>{show('home');$('home').innerHTML='<h2>Ta partie</h2><p class="muted">Donne ce code à tes amis (jusqu’à 6 joueurs) :</p><div class="code">'+roomCode+'</div><div class="plr">'+names.map(n=>'<span>'+esc(n)+'</span>').join('')+'</div><div class="tabs"><span>+ Robots :</span>'+[0, 1, 2, 3, 4, 5].map(n=>'<button data-b="'+n+'" class="'+((P.ob||0)===n?'on':'')+'">'+n+'</button>').join('')+'</div><button class="ob" id="go">Lancer la partie</button><button class="ob alt" id="back">Annuler</button>';
    $('home').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{P.ob=+b.dataset.b;lobby();});$('back').onclick=showHome;
    $('go').onclick=()=>{const bots=Math.min(P.ob||0,6-names.length);if(names.length+bots<2)return toast('Il faut au moins 2 joueurs (ajoute un robot).');
      conns.forEach(c=>{try{c.conn.send({t:'start'});}catch(e){}});startGame(names,bots);};};
  const open=tries=>{
    try{peer=mkPeer('oie-'+roomCode);}catch(e){toast(e.message,5000);return showHome();}
    peer.on('open',lobby);
    peer.on('error',e=>{if(e.type==='unavailable-id'&&tries<5){roomCode=genCode();open(tries+1);}else{toast('Connexion impossible ('+(e.type||'erreur')+').',5000);showHome();}});
    peer.on('connection',c=>{
      const o={conn:c,p:-1};
      c.on('data',m=>{if(m.t==='hello'&&o.p<0){const nm=String(m.name||'Joueur').slice(0,12),full=()=>{try{c.send({t:'full'});}catch(e){}};if(H){const od=conns.find(x=>x.dead&&H.pl[x.p]&&H.pl[x.p].name===nm);if(od){conns[conns.indexOf(od)]=o;o.p=od.p;H.pl[o.p].bot=false;toast(nm+' est de retour !',3500);pushViews();maybeBot();}else full();}else if(names.length>=6)full();else{o.p=names.length;names.push(nm);conns.push(o);lobby();}}else if(o.p>0&&m.t==='act'){const r=act(o.p,m.a);if(r==='invalid')try{c.send({t:'err'});}catch(e){}}else if(o.p>0&&m.t==='next'&&H&&H.pause)nextRound();});
      c.on('close',()=>{if(H){if(o.p>0&&conns.indexOf(o)>=0){o.dead=true;H.pl[o.p].bot=true;toast(H.pl[o.p].name+' a quitté : un robot joue à sa place (reconnexion possible).',5000);maybeBot();pushViews();}}else{const i=conns.indexOf(o);if(i>=0){conns.splice(i,1);names.splice(o.p,1);conns.forEach(x=>{if(x.p>o.p)x.p--;});lobby();}}});
    });
  };
  open(0);
}
function joinOnline(name,code){
  leave();show('home');$('home').innerHTML='<h2>Connexion…</h2><p class="muted">Recherche de la partie '+code+'</p><button class="ob alt" id="back">Annuler</button>';$('back').onclick=showHome;
  let opened=false;try{peer=mkPeer();}catch(e){toast(e.message,5000);return showHome();}
  const fail=m=>{toast(m,5000);showHome();};
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Aucune partie avec ce code.':'Connexion impossible ('+(e.type||'erreur')+').'));
  peer.on('open',()=>{const c=peer.connect('oie-'+code,{reliable:true});peer.conn=c;
    c.on('open',()=>{opened=true;c.send({t:'hello',name});$('home').innerHTML='<h2>Connecté !</h2><p class="muted">En attente du lancement par l’hôte…</p><button class="ob alt" id="back">Quitter</button>';$('back').onclick=showHome;});
    c.on('data',m=>{if(m.t==='full')fail('La partie est complète ou déjà commencée.');else if(m.t==='view'){if($('game').hidden)show('game');onView(m.v);}else if(m.t==='err')toast('Action impossible.');});
    c.on('close',()=>{if(V&&!V.over){openOv('<h2>Connexion perdue</h2><p class="muted">Un robot joue à ta place. Reconnecte-toi avec le même code et le même nom pour reprendre.</p><button class="ob" id="rc">Se reconnecter</button><button class="ob alt" id="q">Quitter</button>');$('rc').onclick=()=>{closeOv();joinOnline(name,code);};$('q').onclick=showHome;}});});
  setTimeout(()=>{if(!opened)fail('Impossible de joindre la partie. Vérifie le code et ta connexion.');},15000);
}
function send(a){if(isHost){const r=act(myIdx,a);if(r==='invalid')toast('Tu ne peux pas jouer ce domino.');}else try{peer.conn.send({t:'act',a});}catch(e){toast('Connexion perdue.');}}

/* ================= affichage ================= */
let busyUntil=0,busyT=null;let built=false;const anim={t:null,steps:[],i:-1,shown:{}};
const XE=[100,203,306,408,511,614,717,820,923],YE=[100,203,306,409,512,614.5,717.5,820.5,923];
function cellXY(pos,k,n){
  if(pos>=60){const cols=Math.ceil(Math.sqrt(n)),rr=Math.floor(k/cols),cc=k%cols;return [(511+(cc-(cols-1)/2)*54)/10.24,(510+(rr-(Math.ceil(n/cols)-1)/2)*50+22)/10.24];}
  const [r,c]=SPIRAL[pos];let ox=0,oy=0;
  if(n>1){const cols=Math.ceil(Math.sqrt(n)),rr=Math.floor(k/cols),cc=k%cols;ox=(cc-(cols-1)/2)*28;oy=(rr-(Math.ceil(n/cols)-1)/2)*22;}
  return [((XE[c]+XE[c+1])/2+ox)/10.24,((YE[r]+YE[r+1])/2+oy+16)/10.24];}
function buildBoard(v){
  const u=100/8;let h='<div id="bw"><div id="bd"><div id="fl">';
  v.pl.forEach((q,i)=>{h+='<img class="pw" data-i="'+i+'" src="img/pw'+q.pw+'.webp" alt="">';});
  h+='</div></div></div><div id="dz"><div class="dd"><img id="d1" src="img/d1.webp" alt="" style="opacity:.5"></div><button class="ob" id="rb">Lancer le dé</button></div><div id="lg"></div>'+
   '<div class="lgd"><span><img src="img/i_goose.webp" alt="">oie : rejoue</span><span><img src="img/i_bridge.webp" alt="">pont → 12</span><span><img src="img/i_inn.webp" alt="">1 tour</span><span><img src="img/i_dice.webp" alt="">26 ⇄ 53</span><span><img src="img/i_well.webp" alt="">puits</span><span><img src="img/i_prison.webp" alt="">prison</span><span><img src="img/i_maze.webp" alt="">→ 30</span><span><img src="img/i_skull.webp" alt="">→ départ</span></div>';
  $('main').innerHTML='<div id="ps"></div>'+h;
  const bw=$('bd').getBoundingClientRect().width||360;$('bd').style.setProperty('--nf',Math.max(7,Math.round(bw*.026))+'px');$('bd').style.setProperty('--pw',(v.pl.length>3?3.8:4.4)+'%');
  $('rb').onclick=()=>{const V=window.__l.V;if(!(V&&V.turn===V.me&&!V.over))return toast('Pas ton tour.');send({a:'roll'});};
  built=true;
}
function placePawns(v,override){
  const groups={};v.pl.forEach((q,i)=>{const p=override&&override[i]!=null?override[i]:q.pos;(groups[p]=groups[p]||[]).push(i);});
  document.querySelectorAll('.pw').forEach(el=>{const i=+el.dataset.i,p=override&&override[i]!=null?override[i]:v.pl[i].pos,g=groups[p],[x,y]=cellXY(p,g.indexOf(i),g.length);el.style.left=x+'%';el.style.top=y+'%';el.style.zIndex=10+Math.round(y);});
}
function onView(v){const prev=V;V=v;if(!built||!prev||prev.pl.length!==v.pl.length)built=false;render(!prev||v.roll!==prev.roll);if(v.over)setTimeout(endDialog,1200+(v.trail?v.trail.steps.length*450:0));}
function render(newRoll){
  const v=V;if(!v)return;const wasBuilt=built;if(!built)buildBoard(v);
  const t=v.trail;
  if(newRoll&&wasBuilt&&t){busyUntil=Date.now()+(t.steps.length>1?450+520*(t.steps.length-1):450)+700;clearTimeout(busyT);busyT=setTimeout(()=>{if(V)render(false);},busyUntil-Date.now()+30);}
  const busy=!v.over&&t&&Date.now()<busyUntil;
  const me=v.me,mine=!busy&&v.turn===me&&!v.over;
  const shownTurn=busy?t.i:v.turn;
  $('st').textContent=v.over?'Partie terminée':busy?(t.i===me?'Tu avances…':v.pl[t.i].name+' avance…'):(mine?'À toi de lancer !':'Tour de '+v.pl[v.turn].name);
  $('ps').innerHTML=v.pl.map((q,i)=>'<div class="pl2'+(shownTurn===i?' t':'')+'"><b><img src="img/pw'+q.pw+'.webp" alt="">'+esc(q.name)+(i===me?' (toi)':'')+'</b><span>case '+(busy&&i===t.i?t.steps[0]:q.pos)+(q.stuck?' ⛓':'')+(q.skip?' ⏸':'')+'</span></div>').join('');
  clearTimeout(anim.t);
  if(newRoll&&wasBuilt&&t&&t.steps.length>1){
    const ov={};ov[t.i]=t.steps[0];placePawns(v,ov);let k=0;
    const step=()=>{k++;if(k>=t.steps.length){placePawns(v);return;}const o={};o[t.i]=t.steps[k];placePawns(v,o);anim.t=setTimeout(step,520);};
    anim.t=setTimeout(step,450);
  }else placePawns(v);
  if(v.dice&&v.roll){[0].forEach(k=>{const e=$('d'+(k+1));e.src='img/d'+v.dice[k]+'.webp';e.style.opacity=1;if(newRoll){e.classList.remove('r');void e.offsetWidth;e.classList.add('r');}});}
  $('rb').disabled=!mine;$('rb').style.opacity=$('rb').disabled?.5:1;
  $('lg').textContent=busy&&t&&t.steps.length>1&&false?'':(v.log||'');
}
function send(a){if(isHost){const r=act(myIdx,a);if(r==='invalid')toast('Action impossible.');}else try{peer.conn.send({t:'act',a});}catch(e){toast('Connexion perdue.');}}
function endDialog(){
  const v=V;if(!v||!v.over)return;const iWon=v.win===v.me;
  if(!endDialog.paid){endDialog.paid=1;if(iWon){addGems(Math.min(12,v.pl.length*3+3));P.w++;}else{addGems(1);P.l++;}saveP();}
  openOv('<h2>'+(iWon?'🏆 Tu as gagné !':esc(v.pl[v.win].name)+' gagne la partie')+'</h2><p class="gold">+'+(iWon?Math.min(12,v.pl.length*3+3):1)+' 💎</p><button class="ob" id="q">Menu</button>');$('q').onclick=showHome;
}
$('bmenu').onclick=()=>{if(V&&!V.over){openOv('<h2>Menu</h2><button class="ob alt" id="rl">📖 Règles</button><button class="ob" id="n">Reprendre</button><button class="ob alt" id="y">Quitter la partie</button>');$('n').onclick=closeOv;$('rl').onclick=rules;$('y').onclick=showHome;}else showHome();};
gmUpdate();showHome();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.__l={get H(){return H;},get V(){return V;},act,botStep,startGame};

</script>
