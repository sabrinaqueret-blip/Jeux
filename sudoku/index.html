<style>
/* Mise en page commune à tous mes jeux : fond sombre ou décor illustré, barre du haut en pastilles, 💎 et boutique */
:root{
  --bg:#14202e; --panel:#1f3147; --gold:#f0c060; --muted:#b6c4d6;
  --paper:#161E23; --ink:#f6f3e6;
  --line:#2f4254; --line-strong:#8fa3b5;
  --user:#8FA8FF; --accent:#f0c060; --on-accent:#12202e;
  --hint:#E3AE35; --hint-soft:#4A3B12; --on-hint:#17262D;
  --err:#FF8076; --err-soft:#4A2123;
  --sel:#25466F; --peer:#1D2A31; --same:#2A4568;
  --btn:#0008;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
#board[data-th="1"]{--paper:#F8FAF9;--ink:#17262D;--muted:#53686F;--line:#BFCCD0;--line-strong:#2B414C;--user:#2748BD;--peer:#E8EFF1;--same:#CFE0F8;--sel:#B9D2F3;--err:#B82525;--err-soft:#F5D0CC;--hint-soft:#FAE3A6}
#board[data-th="2"]{--paper:#E6F7F1;--ink:#12382e;--muted:#3d6b5d;--line:#9ccfbf;--line-strong:#1f6b57;--user:#0a6f8a;--peer:#d3efe5;--same:#b5e4d3;--sel:#8fd6bd;--err:#B82525;--err-soft:#F5D0CC;--hint-soft:#FAE3A6}
#board[data-th="3"]{--paper:#FFF1F6;--ink:#4a1830;--muted:#8a4a66;--line:#efc2d4;--line-strong:#a2325f;--user:#7a2fb8;--peer:#fde0ea;--same:#f8c6d9;--sel:#f4a8c6;--err:#B82525;--err-soft:#F5D0CC;--hint-soft:#FAE3A6}
#board[data-th="4"]{--paper:#1b1a14;--ink:#f6e9c0;--muted:#b5a678;--line:#4a4326;--line-strong:#f0c060;--user:#ffd778;--peer:#28251a;--same:#3a331a;--sel:#5a4a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
body{
  background:var(--bg) center/cover fixed no-repeat;color:var(--ink);font-family:var(--font-ui);
  padding-top:max(8px,env(safe-area-inset-top,0px));
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));
  padding-right:max(10px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
button{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;margin:0;cursor:pointer;touch-action:manipulation}
.app{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

#hud{display:flex;gap:6px;align-items:center;justify-content:space-between;font-weight:800;text-shadow:0 1px 3px #000a}
#hud span,#hud button{background:#0009;padding:5px 10px;border-radius:999px;border:0;color:var(--ink);font:inherit;font-weight:800;font-size:14px;white-space:nowrap}
#hud b{font-weight:800;font-variant-numeric:tabular-nums}
#hud .gm{color:var(--gold)}
#sub{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000a}
#sub span{background:#0009;padding:3px 10px;border-radius:999px}
.level{color:var(--gold);font-weight:800;letter-spacing:.06em;text-transform:uppercase}

.board{
  width:100%;aspect-ratio:1;max-width:100%;container-type:inline-size;
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);
  border:3px solid var(--gold);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #0009;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cell{
  position:relative;display:flex;align-items:center;justify-content:center;min-width:0;padding:0;
  background:transparent;border:0;border-radius:0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--font-num);color:var(--ink);line-height:1;
  font-size:clamp(18px,6.2vw,31px);
  font-size:calc(100cqw / 9 * .58);
}
.cell.br{border-right:2px solid var(--line-strong)}
.cell.bb{border-bottom:2px solid var(--line-strong)}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+73){border-bottom:0}
.cell.given{font-weight:800}
.cell.user{font-weight:600;color:var(--user)}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.wrong{color:var(--err);background:var(--err-soft)}
.cell.hu{background:var(--hint-soft)}
.cell.sel{background:var(--sel)}
.cell.ht{background:var(--hint);color:var(--on-hint)}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;z-index:1}
.notes{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;
  font-size:clamp(8px,2.3vw,12px);
  font-size:calc(100cqw / 9 * .25);
  color:var(--muted);font-weight:600;
}
.notes i{font-style:normal;display:flex;align-items:center;justify-content:center}

.msg{
  margin:0;min-height:4.2em;padding:10px 12px;border-radius:14px;
  background:#0009;border:2px solid #ffffff22;color:var(--ink);
  font-size:15px;line-height:1.4;text-wrap:pretty;
  display:flex;align-items:center;gap:10px;
}
.msg span{flex:1;min-width:0}
.finish{flex:none;background:var(--gold);color:#12202e;border:0;border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px}
.msg.hint{background:#4a3b12dd;border-color:var(--hint)}
.msg.win{background:var(--gold);border-color:var(--gold);color:#12202e;font-weight:700}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:58px;padding:0 4px;background:var(--btn);border:2px solid var(--gold);border-radius:14px;
  font-size:12.5px;font-weight:800;color:var(--ink);
}
.tool:active{background:#f0c06055}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#12202e}
.tool.hintbtn svg{stroke:var(--hint)}
.tool.hintbtn.live{box-shadow:0 0 14px #e3ae35aa}

.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.key{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:60px;padding:0;background:var(--btn);border:2px solid #ffffff33;border-radius:12px;color:var(--ink);
}
.key .kd{font-family:var(--font-num);font-size:24px;font-weight:700;line-height:1}
.key .kc{font-family:var(--font-num);font-size:10px;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums}
.key:disabled{opacity:.3;cursor:default}
.key.on{border-color:var(--gold);box-shadow:0 0 10px #f0c06088}
.key:active:not(:disabled){background:#f0c06055}

.tool:focus-visible,.key:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:360px){
  .key{height:54px}
  .key .kd{font-size:21px}
}

/* fenêtres, boutique : mêmes que les autres jeux */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov>div{background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:16px;max-width:420px;width:100%;max-height:92vh;overflow:auto;text-align:center}
#ov h2{margin:4px 0 8px}
.ob{display:block;width:100%;margin:8px 0;padding:13px;border-radius:14px;border:2px solid var(--gold);background:var(--gold);color:#12202e;font:inherit;font-weight:800}
.ob.alt{background:transparent;color:var(--ink);border-color:var(--muted)}
.muted{color:var(--muted)}.gold{color:var(--gold);font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tabs button{padding:7px 12px;border-radius:999px;border:2px solid var(--muted);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:14px}
.tabs button.on{background:var(--gold);color:#12202e;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.it{background:#0006;border:2px solid transparent;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.it.on{border-color:var(--gold)}
.it .pv{width:100%;aspect-ratio:1;border-radius:8px;background:#0004 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.it button{width:100%;padding:6px 2px;border-radius:8px;border:0;background:var(--gold);color:#12202e;font:inherit;font-weight:800;font-size:12px}
.it button.u{background:#fff2;color:var(--ink)}.it button.no{background:#fff1;color:var(--muted)}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvs .ob{margin:0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;text-align:center}
#ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ov>div{border-radius:26px!important;box-shadow:0 24px 60px #000d,0 0 0 1px #ffffff2e inset,0 0 40px #a65cff22;background-image:linear-gradient(165deg,#ffffff12,#ffffff00 40%)}
#ov h2,#ov h1{letter-spacing:.3px;text-shadow:0 2px 8px #0008}
.mi{display:block;width:76px;height:76px;margin:0 auto 6px;border-radius:22px;box-shadow:0 8px 18px #000a,0 0 0 2px #ffffff30 inset}
.ob{background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 58%);border-radius:16px!important;text-shadow:0 1px 0 #ffffff55;transition:transform .08s,box-shadow .08s}
.ob:active{transform:translateY(3px)}
.ob.alt{background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));text-shadow:none}
.tabs button.on{box-shadow:0 0 14px #f6c85f99}
.it{border-radius:18px!important;box-shadow:0 6px 14px #0005,0 0 0 1px #ffffff22 inset}
.it.on{box-shadow:0 0 16px #f6c85f88,0 0 0 2px #f6c85f inset}
</style>

<script>
'use strict';
/* ---------- Logique pure : indices de lignes, colonnes, blocs ---------- */
const R=[],C=[],B=[];
for(let i=0;i<81;i++){R[i]=(i/9)|0;C[i]=i%9;B[i]=((R[i]/3)|0)*3+((C[i]/3)|0);}
const PEERS=[];
for(let i=0;i<81;i++){PEERS[i]=[];for(let j=0;j<81;j++){if(j!==i&&(R[j]===R[i]||C[j]===C[i]||B[j]===B[i]))PEERS[i].push(j);}}
const UNITS=[];
for(let n=0;n<9;n++){
  const row=[],col=[],box=[];
  for(let i=0;i<81;i++){if(R[i]===n)row.push(i);if(C[i]===n)col.push(i);if(B[i]===n)box.push(i);}
  UNITS.push({kind:'box',n:n,cells:box},{kind:'row',n:n,cells:row},{kind:'col',n:n,cells:col});
}
function pc(x){x=x-((x>>1)&0x55555555);x=(x&0x33333333)+((x>>2)&0x33333333);return Math.imul((x+(x>>4))&0x0F0F0F0F,0x01010101)>>>24;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* Recherche avec bitmasks : compte les solutions (jusqu'à limit) et garde la première */
function search(grid,limit,randomize){
  const g=grid.slice(),rU=new Array(9).fill(0),cU=new Array(9).fill(0),bU=new Array(9).fill(0);
  for(let i=0;i<81;i++){if(g[i]){const b=1<<g[i];rU[R[i]]|=b;cU[C[i]]|=b;bU[B[i]]|=b;}}
  let count=0,first=null;
  function rec(){
    let best=-1,bm=0,bn=10;
    for(let i=0;i<81;i++){
      if(g[i]===0){
        const m=~(rU[R[i]]|cU[C[i]]|bU[B[i]])&0x3FE,n=pc(m);
        if(n<bn){bn=n;best=i;bm=m;if(n<2)break;}
      }
    }
    if(best<0){count++;if(!first)first=g.slice();return count>=limit;}
    if(bn===0)return false;
    const digits=[];
    for(let d=1;d<=9;d++){if(bm&(1<<d))digits.push(d);}
    if(randomize)shuffle(digits);
    const r=R[best],c=C[best],b=B[best];
    for(const d of digits){
      const bit=1<<d;g[best]=d;rU[r]|=bit;cU[c]|=bit;bU[b]|=bit;
      if(rec())return true;
      rU[r]&=~bit;cU[c]&=~bit;bU[b]&=~bit;
    }
    g[best]=0;return false;
  }
  rec();
  return {count:count,first:first};
}

/* Candidats de chaque case d'après les chiffres posés */
function cands(g){
  const rU=new Array(9).fill(0),cU=new Array(9).fill(0),bU=new Array(9).fill(0),m=new Array(81).fill(0);
  for(let i=0;i<81;i++){if(g[i]){const b=1<<g[i];rU[R[i]]|=b;cU[C[i]]|=b;bU[B[i]]|=b;}}
  for(let i=0;i<81;i++){if(!g[i])m[i]=~(rU[R[i]]|cU[C[i]]|bU[B[i]])&0x3FE;}
  return m;
}
/* Singles cachés (une seule place dans une zone) et singles nus (un seul candidat dans la case) */
function findSingles(g){
  const m=cands(g),out=[];
  for(const u of UNITS){
    for(let d=1;d<=9;d++){
      const bit=1<<d;let present=false,n=0,place=-1;
      for(const i of u.cells){
        if(g[i]===d){present=true;break;}
        if(g[i]===0&&(m[i]&bit)){n++;place=i;}
      }
      if(!present&&n===1)out.push({cell:place,v:d,type:'hidden',unit:u});
    }
  }
  for(let i=0;i<81;i++){
    if(!g[i]&&pc(m[i])===1)out.push({cell:i,v:31-Math.clz32(m[i]),type:'naked'});
  }
  return out;
}
function singlesSolvable(p){
  const g=p.slice();
  for(;;){
    if(g.every(x=>x))return true;
    const s=findSingles(g);
    if(!s.length)return false;
    g[s[0].cell]=s[0].v;
  }
}
function nakedSolvable(p){
  const g=p.slice();
  for(;;){
    if(g.every(x=>x))return true;
    const m=cands(g);let hit=-1;
    for(let i=0;i<81;i++){if(!g[i]&&pc(m[i])===1){hit=i;break;}}
    if(hit<0)return false;
    g[hit]=31-Math.clz32(m[hit]);
  }
}
/* Niveaux : facile = cases à un seul candidat, moyen et difficile = singles, expert = au-delà des singles */
const LEVELS={
  facile:{label:'Facile',mode:'naked',target:40,max:44},
  moyen:{label:'Moyen',mode:'singles',target:34,max:38},
  difficile:{label:'Difficile',mode:'singles',target:26,max:31},
  expert:{label:'Expert',mode:'advanced',target:24,max:27}
};
/* Un puzzle résoluble par déductions simples a forcément une solution unique */
function makePuzzle(level){
  const key=LEVELS[level]?level:'expert',L=LEVELS[key],t0=Date.now();let best=null;
  for(;;){
    const sol=search(new Array(81).fill(0),1,true).first;
    const p=sol.slice(),order=shuffle(Array.from({length:81},(_,i)=>i));
    let clues=81;
    for(const i of order){
      if(clues<=L.target)break;
      const keep=p[i];p[i]=0;
      let ok;
      if(L.mode==='naked')ok=nakedSolvable(p);
      else if(L.mode==='singles')ok=singlesSolvable(p);
      else ok=search(p,2,false).count===1;
      if(ok)clues--;else p[i]=keep;
    }
    const cur={p:p.slice(),sol:sol,clues:clues,level:key};
    const hard=L.mode==='advanced'?!singlesSolvable(p):(L.mode==='naked'||!nakedSolvable(p));
    if(clues<=L.max&&hard)return cur;
    if(!best||clues<best.clues)best=cur;
    if(Date.now()-t0>3500)return best;
  }
}
/*UI*/

/* ---------- Interface ---------- */
const $=id=>document.getElementById(id);
const KEY='sudoku-expert-v1';
/* ====== portefeuille 💎 partagé (clé cartes-v1), boutique, menu ====== */
const GAME='sudoku',WK='cartes-v1';
function wal(){let j=null;try{j=JSON.parse(localStorage.getItem(WK)||'null');}catch(e){}
  if(!j)j={v:1,gems:20,own:{back:[0],court:[0],bg:[0]},sel:{back:0,court:0,bg:0},st:{sol:{p:0,w:0,best:0},fc:{p:0,w:0,best:0}},opt:{draw:3,snd:true}};
  if(!j.own)j.own={};if(!j.own[GAME])j.own[GAME]={};if(typeof j.gems!=='number')j.gems=20;return j;}
function walSave(j){try{localStorage.setItem(WK,JSON.stringify(j));}catch(e){}}
function gems(){return wal().gems;}
function addGems(n){const j=wal();j.gems+=n;walSave(j);gmUpdate();return j.gems;}
function gmUpdate(){$('gm').textContent=gems()+' 💎';}
function owned(cat,i){return i===0||(wal().own[GAME][cat]||[]).includes(i);}
const SK=GAME+'-v1';
let ST={sel:{},best:{}};try{ST=Object.assign(ST,JSON.parse(localStorage.getItem(SK)||'{}'));}catch(e){}
ST.sel=ST.sel||{};
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
function selc(cat){const i=ST.sel[cat]|0;return owned(cat,i)?i:0;}
function openOv(h){$('ov').innerHTML='<div>'+h+'</div>';$('ov').hidden=false;}
function closeOv(){$('ov').hidden=true;}
const BGPRICE=60;
const BGS=[{n:'Nuit',p:0,c:'#14202e'}].concat([['Alice','alice'],['Chats victoriens','chats'],['Renards des bois','renards'],['Dragons et licornes','dragons'],['Venise','venise'],['Égypte','egypte'],['Japon','japon'],['Astronaute','astro'],['Baroque','baroque'],['Art déco','deco'],['Royaume enchanté','fee'],['Steampunk','steampunk'],['Monde des fées','feesbois'],['Aventuriers des mers','marins']].map(a=>({n:a[0],dir:a[1],p:BGPRICE})));
function bgUrl(b){return '../cartes-img/'+b.dir+'/bg1.webp';}
function applyBg(){const b=BGS[selc('bg')]||BGS[0],d=document.body;if(b.dir){d.style.backgroundImage='linear-gradient(#0007,#0007),url('+bgUrl(b)+')';}else{d.style.backgroundImage='none';d.style.backgroundColor=b.c;}}
const THEMES=[{n:'Nuit',p:0,pa:'#161E23',ink:'#f6f3e6'},{n:'Papier',p:40,pa:'#F8FAF9',ink:'#17262D'},{n:'Menthe',p:40,pa:'#E6F7F1',ink:'#12382e'},{n:'Rose',p:40,pa:'#FFF1F6',ink:'#4a1830'},{n:'Or',p:60,pa:'#1b1a14',ink:'#f0c060'}];
function applyTheme(){$('board').dataset.th=selc('theme');}

 theme:{t:'Grille',items:THEMES,prev:(it)=>'<div class="pv" style="background:'+it.pa+';color:'+it.ink+';font-weight:800;font-size:30px">123</div>'}};

/* gains : plus la grille est dure, plus elle rapporte ; chaque indice en retire un */
const GAINS={facile:2,moyen:4,difficile:7,expert:12};
function rewardWin(){
  if(S.rewarded)return;S.rewarded=true;
  const g=Math.max(1,(GAINS[S.level]||2)-S.hints);addGems(g);S.gain=g;
  const b=ST.best[S.level];if(!b||S.t<b){ST.best[S.level]=S.t;saveST();S.record=true;}
  setTimeout(()=>{if(!$('ov').hidden)return;openOv('<h2>Bravo !</h2><p>Grille <b>'+LEVELS[S.level].label.toLowerCase()+'</b> résolue en <b>'+fmt(S.t)+'</b>'+(S.record?' · nouveau record !':'')+'</p><p class="gold">+'+g+' 💎</p><button class="ob" id="rp">Nouvelle grille</button><button class="ob alt" id="mn">Menu</button>');
    $('rp').onclick=()=>{closeOv();newGame(S.level);};$('mn').onclick=menu;},500);
}
function menu(){
  openOv('<h2>🔢 Sudoku</h2><p class="muted">Nouvelle grille</p><div class="lvs">'+Object.keys(LEVELS).map(id=>'<button class="ob'+(id===S.level?'':' alt')+'" data-l="'+id+'">'+LEVELS[id].label+'</button>').join('')+'</div><button class="ob alt" id="rs">Reprendre</button><button class="ob alt" id="hm">Retour aux jeux</button>');
  $('ov').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{closeOv();newGame(b.dataset.l);});
  $('rs').onclick=closeOv;$('hm').onclick=()=>{location.href='../';};
}
$('bmenu').onclick=menu;

const BOXNAMES=['en haut à gauche','en haut au centre','en haut à droite','au milieu à gauche','au centre','au milieu à droite','en bas à gauche','en bas au centre','en bas à droite'];

function blank(){
  return {puz:new Array(81).fill(0),sol:new Array(81).fill(0),val:new Array(81).fill(0),notes:new Array(81).fill(0),
    sel:-1,focus:0,auto:false,level:'expert',notesOn:false,t:0,mistakes:0,hints:0,hist:[],hint:null,done:false,busy:true,flash:'',clues:0};
}
let S=blank();
function fresh(g){
  const s=blank();
  s.puz=g.p.slice();s.val=g.p.slice();s.sol=g.sol.slice();s.clues=g.clues;s.level=g.level;s.busy=false;
  return s;
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({puz:S.puz,sol:S.sol,val:S.val,notes:S.notes,t:S.t,mistakes:S.mistakes,hints:S.hints,clues:S.clues,level:S.level,done:S.done}));
  }catch(e){}
}
function load(){
  try{
    const j=JSON.parse(localStorage.getItem(KEY)||'null');
    if(j&&!j.done&&[j.puz,j.sol,j.val,j.notes].every(a=>Array.isArray(a)&&a.length===81)){
      const s=blank();
      s.puz=j.puz;s.sol=j.sol;s.val=j.val;s.notes=j.notes;
      s.t=j.t|0;s.mistakes=j.mistakes|0;s.hints=j.hints|0;s.clues=j.clues|0;s.level=LEVELS[j.level]?j.level:'expert';s.busy=false;
      return s;
    }
  }catch(e){}
  return null;
}
function fmt(t){
  const h=(t/3600)|0,m=((t%3600)/60)|0,s=t%60,p=n=>String(n).padStart(2,'0');
  return h?h+':'+p(m)+':'+p(s):p(m)+':'+p(s);
}

/* Construction de la grille et du pavé */
const boardEl=$('board'),cells=[];
for(let i=0;i<81;i++){
  const b=document.createElement('button');
  b.type='button';b.className='cell';
  b.addEventListener('click',()=>selectCell(i));
  boardEl.appendChild(b);cells.push(b);
}
const padEl=$('pad'),keys=[];
for(let d=1;d<=9;d++){
  const b=document.createElement('button');
  b.type='button';b.className='key';b.setAttribute('aria-label','Chiffre '+d);
  b.innerHTML='<span class="kd">'+d+'</span><span class="kc"></span>';
  b.addEventListener('click',()=>setDigit(d));
  padEl.appendChild(b);keys.push(b);
}

function notesHtml(mask){
  let h='<span class="notes" aria-hidden="true">';
  for(let d=1;d<=9;d++)h+='<i>'+((mask&(1<<d))?d:'')+'</i>';
  return h+'</span>';
}
function unitName(u){
  if(u.kind==='box')return 'le bloc '+BOXNAMES[u.n];
  if(u.kind==='row')return 'la ligne '+(u.n+1);
  return 'la colonne '+(u.n+1);
}
function hintText(h){
  const r=R[h.cell]+1,c=C[h.cell]+1;
  if(h.kind==='error')return 'Une erreur s’est glissée dans la case ligne '+r+', colonne '+c+'. Ce chiffre n’est pas le bon.';
  if(h.kind==='hidden'){
    if(h.stage===1)return 'Regarde '+unitName(h.unit)+' : où peut aller le '+h.v+' ?';
    return 'Dans '+unitName(h.unit)+', le '+h.v+' n’a qu’une seule place possible : ligne '+r+', colonne '+c+'. Toutes les autres cases libres de cette zone sont déjà bloquées pour le '+h.v+'.';
  }
  if(h.kind==='naked'){
    if(h.stage===1)return 'Regarde la case ligne '+r+', colonne '+c+'. Quels chiffres restent possibles quand on lit sa ligne, sa colonne et son bloc ?';
    return 'Il n’en reste qu’un : le '+h.v+'. Tous les autres chiffres sont déjà présents dans sa ligne, sa colonne ou son bloc.';
  }
  return 'Aucune case ne se résout par simple élimination. Celle-ci est la plus contrainte, avec '+h.n+' chiffres possibles. Une technique avancée (paire nue, X-Wing…) ou les notes peuvent aider.';
}
function hintHL(){
  const hl={unit:new Set(),cell:-1},h=S.hint;
  if(!h)return hl;
  if(h.kind==='hidden'){
    h.unit.cells.forEach(i=>hl.unit.add(i));
    if(h.stage>=2)hl.cell=h.cell;
  }else hl.cell=h.cell;
  return hl;
}

function render(){
  const s=S,sel=s.sel,selVal=sel>=0?s.val[sel]:0;
  const ps=sel>=0?new Set(PEERS[sel]):null,hl=hintHL();
  /* chiffre en surbrillance : celui de la case choisie, ou celui touché sur le pavé */
  const hd=selVal||s.focus;
  let cov=null;
  if(hd){cov=new Set();for(let j=0;j<81;j++){if(s.val[j]===hd)for(const p of PEERS[j])cov.add(p);}}
  let left=0;
  const counts=new Array(10).fill(0);
  for(let i=0;i<81;i++){
    const v=s.val[i];
    if(v!==s.sol[i])left++;
    if(v&&v===s.sol[i])counts[v]++;
    let cls='cell'+(C[i]%3===2&&C[i]<8?' br':'')+(R[i]%3===2&&R[i]<8?' bb':'');
    if(s.puz[i])cls+=' given';else if(v)cls+=' user';
    if(!s.puz[i]&&v&&v!==s.sol[i])cls+=' wrong';
    if(i===sel)cls+=' sel';
    else if((ps&&ps.has(i))||(cov&&cov.has(i)))cls+=' peer';
    if(hd&&v===hd&&i!==sel)cls+=' same';
    if(hl.unit.has(i))cls+=' hu';
    if(i===hl.cell)cls+=' ht';
    const el=cells[i];
    if(el.className!==cls)el.className=cls;
    const key=v+'|'+s.notes[i];
    if(el._k!==key){
      el._k=key;
      el.innerHTML=v?String(v):(s.notes[i]?notesHtml(s.notes[i]):'');
      el.setAttribute('aria-label','Ligne '+(R[i]+1)+', colonne '+(C[i]+1)+', '+(v?'valeur '+v:'vide'));
    }
  }
  const errs=s.val.some((v,i)=>!s.puz[i]&&v&&v!==s.sol[i]);
  const can=!s.busy&&!s.done&&!s.auto&&!errs&&left>0&&left<=15&&singlesSolvable(s.val);
  for(let d=1;d<=9;d++){
    const rem=9-counts[d],k=keys[d-1];
    k.querySelector('.kc').textContent=rem>0?rem:'';
    k.classList.toggle('on',hd===d);
    k.disabled=rem<=0||s.done||s.busy||s.auto;
  }
  $('timer').textContent=fmt(s.t);
  $('levelChip').textContent=LEVELS[s.level].label;
  lvBtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===s.level?'true':'false'));
  $('sGiven').textContent=s.busy?'–':s.clues;
  $('sLeft').textContent=s.busy?'–':left;
  $('sMist').textContent=s.mistakes;
  $('sHints').textContent=s.hints;
  $('notesBtn').setAttribute('aria-pressed',s.notesOn?'true':'false');
  const h=s.hint;
  let lbl='Indice';
  if(h)lbl=h.stage<h.info?'Indice +':(h.kind==='error'?'Corriger':'Placer');
  $('hintLbl').textContent=lbl;
  $('hintBtn').classList.toggle('live',!!h);
  let text,cls='msg';
  if(s.busy){text='Génération d’une grille expert…';}
  else if(s.done){
    text='Grille '+LEVELS[s.level].label.toLowerCase()+' résolue en '+fmt(s.t)+'. '+s.mistakes+' erreur'+(s.mistakes>1?'s':'')+', '+s.hints+' indice'+(s.hints>1?'s':'')+'.';
    cls+=' win';
  }
  else if(h){text=hintText(h);cls+=' hint';}
  else if(s.flash){text=s.flash;}
  else if(can){text='Plus aucun choix à faire : le reste de la grille se déduit directement.';}
  else if(s.focus){text='Le '+s.focus+' est en surbrillance : les cases claires sont les places encore possibles.';}
  else text='Touche une case, puis un chiffre. Le bouton Indice guide la prochaine étape, pas à pas.';
  const m=$('msg'),mt=$('msgText');
  if(mt.textContent!==text)mt.textContent=text;
  m.className=cls;
  $('finishBtn').hidden=!(can&&!h);
}

function flash(t){
  S.flash=t;render();
  setTimeout(()=>{if(S.flash===t){S.flash='';render();}},2600);
}
function selectCell(i){
  if(S.busy||S.auto)return;
  S.sel=i;S.focus=0;render();
}
function push(){
  S.hist.push({v:S.val.slice(),n:S.notes.slice()});
  if(S.hist.length>300)S.hist.shift();
}
function checkWin(){
  if(S.val.every((v,i)=>v===S.sol[i])){S.done=true;S.hint=null;rewardWin();}
}
function place(i,d){
  S.val[i]=d;S.notes[i]=0;
  for(const j of PEERS[i])S.notes[j]&=~(1<<d);
}
function setDigit(d){
  if(S.busy||S.done||S.auto)return;
  const i=S.sel;
  if(i<0){S.focus=S.focus===d?0:d;render();return;}
  if(S.puz[i])return;
  if(S.notesOn){
    if(S.val[i])return;
    push();S.notes[i]^=(1<<d);S.hint=null;
  }else{
    push();S.hint=null;
    if(S.val[i]===d){S.val[i]=0;}
    else{
      place(i,d);
      if(d!==S.sol[i])S.mistakes++;
      checkWin();
    }
  }
  render();save();
}
function erase(){
  if(S.busy||S.done||S.auto)return;
  const i=S.sel;
  if(i<0||S.puz[i]||(!S.val[i]&&!S.notes[i]))return;
  push();S.val[i]=0;S.notes[i]=0;S.hint=null;
  render();save();
}
function undo(){
  if(S.busy||S.done||S.auto)return;
  const h=S.hist.pop();
  if(!h)return;
  S.val=h.v;S.notes=h.n;S.hint=null;
  render();save();
}
function toggleNotes(){
  if(S.busy||S.auto)return;
  S.notesOn=!S.notesOn;render();
}

/* Fin automatique : quand tout le reste se déduit sans choix, on pose les chiffres un à un */
function finishAuto(){
  if(S.busy||S.done||S.auto)return;
  S.auto=true;S.hint=null;push();
  const g=S.val.slice(),todo=[];
  for(;;){
    if(g.every(x=>x))break;
    const s=findSingles(g);
    if(!s.length)break;
    g[s[0].cell]=s[0].v;todo.push(s[0]);
  }
  let k=0;
  const step=()=>{
    if(k>=todo.length){S.auto=false;checkWin();render();save();return;}
    const t=todo[k++];
    place(t.cell,t.v);S.sel=t.cell;render();
    setTimeout(step,70);
  };
  step();
}

/* Indices : erreur d'abord, puis single caché / nu, sinon la case la plus contrainte */
function makeHint(){
  for(let i=0;i<81;i++){
    if(!S.puz[i]&&S.val[i]&&S.val[i]!==S.sol[i])return {kind:'error',cell:i,v:S.sol[i],info:1};
  }
  const singles=findSingles(S.val);
  if(singles.length){
    const pr=s=>s.type==='naked'?2:(s.unit.kind==='box'?0:1);
    singles.sort((a,b)=>pr(a)-pr(b));
    const mine=singles.filter(s=>s.cell===S.sel);
    const pick=(mine.length?mine:singles)[0];
    if(pick.type==='hidden')return {kind:'hidden',cell:pick.cell,v:pick.v,unit:pick.unit,info:2};
    return {kind:'naked',cell:pick.cell,v:pick.v,info:2};
  }
  const m=cands(S.val);
  let best=-1,bn=10;
  for(let i=0;i<81;i++){
    if(!S.val[i]){const n=pc(m[i]);if(n<bn){bn=n;best=i;}}
  }
  return {kind:'tight',cell:best,v:S.sol[best],n:bn,info:1};
}
function applyHint(){
  const h=S.hint;
  push();
  place(h.cell,h.v);
  S.sel=h.cell;S.hint=null;
  checkWin();
  render();save();
}
function pressHint(){
  if(S.busy||S.done||S.auto)return;
  if(!S.hint){
    S.hint=makeHint();S.hint.stage=1;S.hints++;
  }else if(S.hint.stage<S.hint.info){
    S.hint.stage++;
  }else{
    applyHint();return;
  }
  render();save();
}

/* Nouvelle grille : un bouton par niveau, avec confirmation si une partie est en cours */
let confirmTimer=0,pending='';
const lvBtns=[];
function lastLevel(){
  try{const l=localStorage.getItem('sudoku-level');if(LEVELS[l])return l;}catch(e){}
  return 'expert';
}
function resetConfirm(){
  clearTimeout(confirmTimer);pending='';
  lvBtns.forEach(b=>{b.classList.remove('confirm');b.textContent=LEVELS[b.dataset.l].label;});
}
function newGame(level){
  resetConfirm();
  try{localStorage.setItem('sudoku-level',level);}catch(e){}
  S=blank();S.level=level;render();
  setTimeout(()=>{
    const g=makePuzzle(level);
    S=fresh(g);render();save();
  },40);
}
function askNewGame(level){
  if(S.busy||S.auto)return;
  const inProgress=!S.done&&S.val.some((v,i)=>v&&!S.puz[i]);
  if(!inProgress||pending===level){newGame(level);return;}
  resetConfirm();pending=level;
  const b=lvBtns.find(x=>x.dataset.l===level);
  b.classList.add('confirm');b.textContent='Sûr ?';
  flash('Touche encore ce niveau pour abandonner la grille en cours.');
  confirmTimer=setTimeout(resetConfirm,3500);
}

$('undoBtn').addEventListener('click',undo);
$('eraseBtn').addEventListener('click',erase);
$('notesBtn').addEventListener('click',toggleNotes);
$('finishBtn').addEventListener('click',finishAuto);
$('hintBtn').addEventListener('click',pressHint);

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.altKey)return;
  if(e.ctrlKey){if(e.key==='z'){e.preventDefault();undo();}return;}
  const k=e.key;
  if(k>='1'&&k<='9'){setDigit(+k);return;}
  if(k==='Backspace'||k==='Delete'||k==='0'){erase();return;}
  if(k==='n'||k==='N'){toggleNotes();return;}
  if(k==='h'||k==='H'){pressHint();return;}
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];
  if(mv&&!S.busy){
    e.preventDefault();
    let i=S.sel<0?40:S.sel+mv;
    if(k==='ArrowLeft'&&S.sel>=0&&C[S.sel]===0)i=S.sel;
    if(k==='ArrowRight'&&S.sel>=0&&C[S.sel]===8)i=S.sel;
    if(i<0||i>80)i=S.sel;
    S.sel=i;render();cells[i].focus();
  }
});

setInterval(()=>{
  if(S.busy||S.done||document.hidden)return;
  S.t++;
  $('timer').textContent=fmt(S.t);
  if(S.t%5===0)save();
},1000);

applyAll();gmUpdate();
const saved=load();
if(saved){S=saved;render();}
else newGame(lastLevel());
</script>
