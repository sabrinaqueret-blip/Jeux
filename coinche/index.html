<script>
'use strict';
/* ---------- Cartes : id = couleur*8 + rang ---------- */
const SUITS=['♠','♥\uFE0E','♦','♣','Tout atout','Sans atout'],SUITN=['Pique','Cœur','Carreau','Trèfle'],RANKS=['7','8','9','10','V','D','R','A'];
const ORD_NT=[0,1,2,4,5,6,3,7],ORD_T=[0,1,5,6,3,7,2,4];          /* du plus faible au plus fort */
const PT_SA=[0,0,0,10,2,3,4,19],PT_NT=[0,0,0,10,2,3,4,11],PT_T=[0,0,14,10,20,3,4,11];
const POS_NT=[],POS_T=[];ORD_NT.forEach((r,i)=>POS_NT[r]=i);ORD_T.forEach((r,i)=>POS_T[r]=i);
const cs=id=>id>>3,cr=id=>id&7;
const isTr=(s,tr)=>tr===4||s===tr;
const cpts=(id,tr)=>isTr(cs(id),tr)?PT_T[cr(id)]:tr===5?PT_SA[cr(id)]:PT_NT[cr(id)];
const cstr=(id,tr)=>isTr(cs(id),tr)?POS_T[cr(id)]:POS_NT[cr(id)];
function beats(a,b,tr){const at=isTr(cs(a),tr),bt=isTr(cs(b),tr);if(at!==bt)return at;if(cs(a)!==cs(b))return false;return cstr(a,tr)>cstr(b,tr);}
function trickWinner(trick,tr){let w=trick[0];for(let i=1;i<trick.length;i++)if(beats(trick[i].card,w.card,tr))w=trick[i];return w;}
function legalMoves(hand,trick,tr,seat){
  if(!trick.length)return hand.slice();
  const ls=cs(trick[0].card),w=trickWinner(trick,tr);
  const follow=hand.filter(c=>cs(c)===ls),trumps=tr<4?hand.filter(c=>cs(c)===tr):[];
  const ms=tr===4?ls:tr;
  const mt=()=>Math.max(-1,...trick.filter(t=>cs(t.card)===ms).map(t=>cstr(t.card,tr)));
  if(isTr(ls,tr)){if(!follow.length)return hand.slice();const h=follow.filter(c=>cstr(c,tr)>mt());return h.length?h:follow;}
  if(follow.length)return follow;
  if(tr>=4||w.seat%2===seat%2)return hand.slice();
  if(!trumps.length)return hand.slice();
  const h=trumps.filter(c=>cstr(c,tr)>mt());return h.length?h:trumps;
}
const SUIT_SHOW=[0,1,3,2];                                         /* alterne noir / rouge */
function sortHand(h,tr){return h.slice().sort((a,b)=>{const sa=SUIT_SHOW.indexOf(cs(a)),sb=SUIT_SHOW.indexOf(cs(b));
  if(tr!=null&&tr>=0&&tr<4){const ta=cs(a)===tr?-1:0,tb=cs(b)===tr?-1:0;if(ta!==tb)return ta-tb;}
  return sa!==sb?sa-sb:cstr(b,tr)-cstr(a,tr);});}
const rnd=(a,b)=>a+((Math.random()*(b-a+1))|0);
const round10=x=>Math.round(x/10)*10;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};


/* ---------- Annonces (tierce, cinquante, cent, carrés) ---------- */
function findAnnonces(hand,seat){
  const out=[];
  for(let su=0;su<4;su++){
    const has=[...Array(8)].map((_,r)=>hand.includes(su*8+r));let r=0;
    while(r<8){if(!has[r]){r++;continue;}let e=r;while(e+1<8&&has[e+1])e++;const len=e-r+1;
      if(len>=3){const val=len===3?20:len===4?50:100;out.push({seat,k:'seq',len:Math.min(len,5),suit:su,high:e,val,label:len===3?'tierce':len===4?'cinquante':'cent'});}
      r=e+1;}
  }
  for(const [r,val] of [[4,200],[2,150],[7,100],[3,100],[6,100],[5,100]]){
    if([0,1,2,3].every(su=>hand.includes(su*8+r)))out.push({seat,k:'carre',len:4,suit:-1,high:r,val,label:'carré'});
  }
  return out;
}
function annKey(a,trump){return [a.val,a.k==='carre'?1:0,a.k==='seq'?a.high:POS_NT[a.high],a.suit===trump?1:0];}
function annCmp(a,b,trump){const x=annKey(a,trump),y=annKey(b,trump);for(let i=0;i<4;i++)if(x[i]!==y[i])return x[i]-y[i];return 0;}
function annDesc(a){return a.k==='carre'?'carré de '+(a.high===4?'valets':a.high===2?'9':a.high===7?'as':a.high===3?'10':a.high===6?'rois':'dames'):a.label+' '+SUITS[a.suit]+' au '+RANKS[a.high];}

/* ---------- Robots ---------- */
let TAK=0.8,TAB=-14,SAK=1.1,SAA=4,SAB=-8;
function estimate(hand,suit){
  if(suit===4){let p=0,j=0,n9=0;for(const c of hand){p+=PT_T[cr(c)];if(cr(c)===4)j++;if(cr(c)===2)n9++;}return p*TAK+j*6+n9*2+TAB;}
  if(suit===5){let p=0,a=0;for(const c of hand){p+=PT_SA[cr(c)];if(cr(c)===7)a++;}return p*SAK+a*SAA+SAB;}
  let e=0;const tr=hand.filter(c=>cs(c)===suit);
  for(const c of tr)e+=PT_T[cr(c)];
  if(tr.length>3)e+=(tr.length-3)*8;if(!tr.length)e-=20;
  const has=r=>tr.some(c=>cr(c)===r);if(has(4)&&has(2))e+=10;
  for(let s=0;s<4;s++){if(s===suit)continue;const h=hand.filter(c=>cs(c)===s),a=h.some(c=>cr(c)===7);
    if(a){e+=10;if(h.some(c=>cr(c)===3))e+=8;else if(h.some(c=>cr(c)===6))e+=3;}}
  return e+25;                                                    /* dix de der + apport du partenaire */
}
function botBidAction(g,seat){
  const hand=g.hands[seat],cb=g.cb;
  if(cb&&cb.coinche===1&&cb.seat===seat){return estimate(hand,cb.suit)>=cb.val+35?{a:'sur'}:{a:'pass'};}
  let best=-1,bs=0;for(let s=0;s<6;s++){const e=estimate(hand,s)+rnd(-4,4);if(e>best){best=e;bs=s;}}
  if(cb&&cb.seat%2!==seat%2&&cb.coinche===0){
    if(cb.suit>=4){if(cb.val>=100&&estimate(hand,cb.suit)>=cb.val+10&&Math.random()<.5)return {a:'coinche'};}
    else{
    const tr=hand.filter(c=>cs(c)===cb.suit),jn=tr.some(c=>cr(c)===4),n9=tr.some(c=>cr(c)===2);
    const aces=hand.filter(c=>cs(c)!==cb.suit&&cr(c)===7).length;
    if(cb.val>=100&&tr.length>=3&&(jn||n9)&&aces>=1&&Math.random()<.55)return {a:'coinche'};
    if(cb.val>=140&&tr.length>=2&&(jn||n9)&&Math.random()<.3)return {a:'coinche'};
  }}
  let want=Math.floor((best+6)/10)*10;if(want>160)want=160;
  if(cb&&cb.seat%2===seat%2){if(want>=cb.val+20&&bs===cb.suit)return {a:'bid',val:Math.min(160,cb.val+10),suit:cb.suit};return {a:'pass'};}
  const min=cb?cb.val+10:80;
  if(want>=min&&min<=160)return {a:'bid',val:Math.max(want,min)>160?160:Math.max(want,min),suit:bs};
  return {a:'pass'};
}
function botPlayCard(g,seat){
  const hand=g.hands[seat],tr=g.trump,L=legalMoves(hand,g.trick,tr,seat);
  if(L.length===1)return L[0];
  const played=new Set(g.played),mine=new Set(hand);
  const higherLeft=c=>{for(let r=0;r<8;r++){const id=cs(c)*8+r;if(id!==c&&cstr(id,tr)>cstr(c,tr)&&!played.has(id)&&!mine.has(id))return true;}return false;};
  const trumpLeft=()=>{if(tr>=4)return 0;let n=0;for(let r=0;r<8;r++){const id=tr*8+r;if(!played.has(id)&&!mine.has(id))n++;}return n;};
  const byLow=(a,b)=>cpts(a,tr)-cpts(b,tr)||cstr(a,tr)-cstr(b,tr);
  const att=g.cb.seat%2===seat%2;
  if(!g.trick.length){
    const T=L.filter(c=>cs(c)===tr),N=L.filter(c=>cs(c)!==tr);
    if(att&&T.length&&trumpLeft()>0){const top=T.slice().sort((a,b)=>cstr(b,tr)-cstr(a,tr))[0];if(!higherLeft(top)||T.length>=3||T.some(c=>cr(c)===4))return top;}
    const masters=N.filter(c=>!higherLeft(c)).sort((a,b)=>cpts(b,tr)-cpts(a,tr));
    if(masters.length)return masters[0];
    if(att&&T.length&&trumpLeft()>0)return T.slice().sort((a,b)=>cstr(b,tr)-cstr(a,tr))[0];
    if(N.length){const bySuit=[0,0,0,0];N.forEach(c=>bySuit[cs(c)]++);
      return N.slice().sort((a,b)=>bySuit[cs(b)]-bySuit[cs(a)]||byLow(a,b))[0];}
    return T.slice().sort(byLow)[0];
  }
  const w=trickWinner(g.trick,tr),partner=w.seat%2===seat%2,last=g.trick.length===3;
  if(partner){
    const sure=last||!higherLeft(w.card)&&cs(w.card)!==tr||(cs(w.card)===tr&&!higherLeft(w.card));
    if(sure){const N=L.filter(c=>cs(c)!==tr);const pool=N.length?N:L;return pool.slice().sort((a,b)=>cpts(b,tr)-cpts(a,tr)||cstr(a,tr)-cstr(b,tr))[0];}
    return L.slice().sort(byLow)[0];
  }
  const win=L.filter(c=>beats(c,w.card,tr)).sort((a,b)=>cstr(a,tr)-cstr(b,tr)||cs(a)-cs(b));
  if(win.length){
    const trickPts=g.trick.reduce((s,t)=>s+cpts(t.card,tr),0);
    const trumpWin=win.every(c=>cs(c)===tr)&&cs(w.card)!==tr;
    if(trumpWin&&trickPts===0&&!last&&Math.random()<.5)return L.slice().sort(byLow)[0];
    return win[0];
  }
  return L.slice().sort(byLow)[0];
}

/* ---------- Partie (côté hôte) ---------- */
class Game{
  constructor(target){
    this.target=target||1000;this.scores=[0,0];this.names=['Moi','Léa','Max','Zoé'];this.kinds=['human','bot','bot','bot'];
    this.sink=[null,null,null,null];this.phase='lobby';this.handNo=0;this.dealer=(Math.random()*4)|0;this.timer=0;this.rt=0;
    this.ready=[true,true,true,true];this.msg='';this.result=null;this.lastTrick=null;this.fast=false;this.pace=.6;this.log=[];
  }
  isBot(s){return this.kinds[s]!=='human';}
  later(fn,ms){clearTimeout(this.timer);this.timer=setTimeout(fn,this.fast?0:ms*this.pace);}
  start(){this.scores=[0,0];this.handNo=0;this.nextHand();}
  nextHand(){
    this.handNo++;this.dealer=(this.dealer+1)%4;
    const deck=shuffle([...Array(32).keys()]);
    this.hands=[0,1,2,3].map(i=>sortHand(deck.slice(i*8,i*8+8),-1));
    this.bids=[];this.cb=null;this.passes=0;this.trump=null;this.trick=[];this.tricksWon=[0,0];this.pts=[0,0];this.played=[];
    this.bel=null;this.belDone=false;this.ann=[[],[],[],[]];this.annTxt=[];this.annRes=null;this.annPts=[0,0];this.tricksDone=0;this.result=null;this.msg='';this.lastTrick=null;
    this.phase='bidding';this.turn=(this.dealer+1)%4;this.ready=[true,true,true,true];
    this.push();
  }
  push(){for(let s=0;s<4;s++)if(this.sink[s])this.sink[s](this.view(s));this.pump();}
  pump(){
    clearTimeout(this.rt);
    if((this.phase==='bidding'||this.phase==='play')&&this.isBot(this.turn)){
      const forced=this.phase==='play'&&legalMoves(this.hands[this.turn],this.trick,this.trump,this.turn).length===1;
      this.rt=setTimeout(()=>this.botMove(),this.fast?0:(forced?rnd(260,480):rnd(650,1250))*this.pace);
    }
  }
  botMove(){
    if(!(this.phase==='bidding'||this.phase==='play')||!this.isBot(this.turn))return;
    const s=this.turn;
    if(this.phase==='bidding')this.act(s,botBidAction(this,s));
    else this.act(s,{a:'play',card:botPlayCard(this,s)});
  }
  minBid(){return this.cb?(this.cb.val>=360?500:this.cb.val+10):80;}
  act(seat,a){
    if(this.phase==='handEnd'&&a.a==='ready'){this.ready[seat]=true;this.checkReady();return '';}
    if(this.phase==='bidding'){
      if(seat!==this.turn)return 'pas ton tour';
      const cb=this.cb;
      if(a.a==='pass'){
        this.bids.push({seat,k:'pass'});
        if(cb&&cb.coinche===1){this.startPlay();return '';}
        this.passes++;
        if(cb&&this.passes>=3){this.startPlay();return '';}
        if(!cb&&this.passes>=4){this.msg='Personne ne prend : on redistribue.';this.phase='redeal';this.push();this.later(()=>{this.nextHand();},2200);return '';}
        this.turn=(seat+1)%4;this.push();return '';
      }
      if(a.a==='bid'){
        if(cb&&cb.coinche>0)return 'coinché';
        const v=a.val,su=a.suit;
        if(!(su>=0&&su<=5))return 'couleur';
        if(!((v>=80&&v<=360&&v%10===0)||v===500))return 'valeur';
        if(v<this.minBid()&&!(v===500&&(!cb||cb.val<500)))return 'trop bas';
        if(cb&&v<=cb.val)return 'trop bas';
        this.cb={seat,val:v,suit:su,coinche:0};this.passes=0;this.bids.push({seat,k:'bid',val:v,suit:su});
        
        this.turn=(seat+1)%4;this.push();return '';
      }
      if(a.a==='coinche'){
        if(!cb||cb.seat%2===seat%2||cb.coinche!==0)return 'impossible';
        cb.coinche=1;this.bids.push({seat,k:'coinche'});this.turn=cb.seat;this.push();return '';
      }
      if(a.a==='sur'){
        if(!cb||cb.coinche!==1||cb.seat!==seat)return 'impossible';
        cb.coinche=2;this.bids.push({seat,k:'sur'});this.startPlay();return '';
      }
      return 'action';
    }
    if(this.phase==='play'&&a.a==='play'){
      if(seat!==this.turn)return 'pas ton tour';
      const L=legalMoves(this.hands[seat],this.trick,this.trump,seat);
      if(!L.includes(a.card))return 'carte interdite';
      this.hands[seat]=this.hands[seat].filter(c=>c!==a.card);
      this.trick.push({seat,card:a.card});this.played.push(a.card);this.msg='';
      if(this.tricksDone===0&&!this.annDecl[seat]){this.annDecl[seat]=true;const l=this.ann[seat];if(l.length){const t=[...new Set(l.map(x=>x.label))].join(' + ');this.annTxt.push({seat,label:t});this.msg=this.names[seat]+' annonce : '+t;}}
      if(this.bel&&seat===this.bel.seat&&cs(a.card)===this.trump&&(cr(a.card)===5||cr(a.card)===6)){this.bel.n++;this.msg=this.bel.n===1?'Belote !':'Rebelote !';}
      if(this.trick.length===4){
        const w=trickWinner(this.trick,this.trump),p=this.trick.reduce((s,t)=>s+cpts(t.card,this.trump),0);
        this.phase='trickEnd';this.winner=w.seat;
        this.pts[w.seat%2]+=p;this.tricksWon[w.seat%2]++;
        const lastT=this.hands[0].length===0;if(lastT){this.pts[w.seat%2]+=10;this.msg='Dix de der !';}
        this.tricksDone++;
        if(this.tricksDone===1)this.resolveAnn();
        this.lastTrick={cards:this.trick.slice(),winner:w.seat};
        this.push();
        this.later(()=>{
          if(lastT){this.endHand();return;}
          this.trick=[];this.turn=w.seat;this.phase='play';this.push();
        },1150);
        return '';
      }
      this.turn=(seat+1)%4;this.push();return '';
    }
    return 'action';
  }
  resolveAnn(){
    const all=[].concat(...this.ann);if(!all.length)return;
    const best=[null,null];for(const a of all){const t=a.seat%2;if(!best[t]||annCmp(a,best[t],this.trump)>0)best[t]=a;}
    let win;
    if(best[0]&&best[1]){const c=annCmp(best[0],best[1],this.trump);win=c>0?0:c<0?1:((this.dealer+1)%4%2===0?0:1);}
    else win=best[0]?0:1;
    const list=all.filter(a=>a.seat%2===win);const total=list.reduce((s,a)=>s+a.val,0);
    this.annRes={team:win,total,list:list.map(a=>({seat:a.seat,txt:annDesc(a),val:a.val}))};this.annPts[win]=total;
    this.msg='Annonces : '+(list.length>1?'':'')+this.annRes.list.map(x=>this.names[x.seat]+' '+x.txt).join(', ')+' = '+total;
  }
  startPlay(){
    this.trump=this.cb.suit;this.phase='play';this.turn=(this.dealer+1)%4;
    this.hands=this.hands.map(h=>sortHand(h,this.trump));
    this.ann=[0,1,2,3].map(i=>findAnnonces(this.hands[i],i));this.annDecl=[false,false,false,false];this.annTxt=[];this.annRes=null;this.annPts=[0,0];this.tricksDone=0;
    if(this.trump<4)for(let s=0;s<4;s++){const h=this.hands[s];if(h.includes(this.trump*8+5)&&h.includes(this.trump*8+6))this.bel={seat:s,n:0};}
    this.push();
  }
  endHand(){
    const cb=this.cb,att=cb.seat%2,def=1-att,m=[1,2,4][cb.coinche];
    const capot=this.tricksWon[att]===8;
    const belTeam=this.bel&&this.bel.n>=2?this.bel.seat%2:-1;
    const ap=this.annPts||[0,0];
    const made=this.pts[att]+ap[att]+(belTeam===att?20:0);
    const bv=cb.val===500?250:cb.val,ok=cb.val===500?capot:made>=cb.val;
    const sc=[0,0];
    if(ok){
      if(m===1){sc[att]=round10(this.pts[att]+(capot?90:0)+ap[att])+bv;sc[def]=round10(this.pts[def]+ap[def]);}
      else{sc[att]=(bv+160)*m+ap[att];sc[def]=0;}
    }else{sc[def]=(160+bv)*m+ap[def];sc[att]=0;}
    if(belTeam>=0)sc[belTeam]+=20;
    this.scores[0]+=sc[0];this.scores[1]+=sc[1];
    this.result={ok,att,val:cb.val,suit:cb.suit,coinche:cb.coinche,pts:this.pts.slice(),tricks:this.tricksWon.slice(),belTeam,delta:sc,capot,bidder:cb.seat,ann:ap.slice(),annList:this.annRes?this.annRes.list:[]};
    const fin=Math.max(...this.scores)>=this.target&&this.scores[0]!==this.scores[1];
    this.result.final=fin;
    this.phase='handEnd';this.ready=this.kinds.map(k=>k!=='human');
    this.trick=[];this.push();
    clearTimeout(this.timer);this.timer=setTimeout(()=>this.afterReady(),45000);
  }
  checkReady(){if(this.ready.every(x=>x))this.afterReady();else this.push();}
  afterReady(){
    if(this.phase!=='handEnd')return;
    if(this.result.final){this.phase='gameEnd';this.push();return;}
    this.nextHand();
  }
  view(seat){
    const my=this.hands?this.hands[seat]:[];
    const v={phase:this.phase,me:seat,names:this.names,kinds:this.kinds,hand:my,counts:this.hands?this.hands.map(h=>h.length):[8,8,8,8],
      dealer:this.dealer,turn:this.turn,bids:this.bids,cb:this.cb,trump:this.trump,trick:this.trick,scores:this.scores,target:this.target,
      played:this.played||[],annTxt:this.annTxt||[],annRes:this.annRes||null,tricks:this.tricksWon,handNo:this.handNo,msg:this.msg,lastTrick:this.lastTrick,result:this.result,winner:this.winner,ready:this.ready};
    if(this.phase==='play'&&this.turn===seat)v.legal=legalMoves(my,this.trick,this.trump,seat);
    if(this.phase==='bidding'&&this.turn===seat){const cb=this.cb;
      v.opts={min:this.minBid(),canCoinche:!!cb&&cb.seat%2!==seat%2&&cb.coinche===0,canSur:!!cb&&cb.coinche===1&&cb.seat===seat,locked:!!cb&&cb.coinche>0};}
    return v;
  }
}

const CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

class FakeConn{
  constructor(ch,me,other,isHost){this.ch=ch;this.me=me;this.other=other;this.h={};this.open=false;this.peer=other;
    ch.addEventListener('message',e=>{const m=e.data;if(m.to!==me||m.from!==other)return;
      if(m.k==='data')this.h.data&&this.h.data(JSON.parse(JSON.stringify(m.d)));
      if(m.k==='close')this.h.close&&this.h.close();
      if(m.k==='open'&&!this.open){this.open=true;this.h.open&&this.h.open();this.ch.postMessage({k:'ack',from:me,to:other});}
      if(m.k==='ack'&&!this.open){this.open=true;this.h.open&&this.h.open();}});}
  on(n,f){this.h[n]=f;}
  send(d){this.ch.postMessage({k:'data',from:this.me,to:this.other,d:JSON.parse(JSON.stringify(d))});}
  close(){this.ch.postMessage({k:'close',from:this.me,to:this.other});}
}
class FakePeer{
  constructor(id){this.id=id||('c'+Math.random().toString(36).slice(2,8));this.ch=new BroadcastChannel('coinche-fake');this.h={};
    this.ch.addEventListener('message',e=>{const m=e.data;if(m.to===this.id&&m.k==='hello'){const c=new FakeConn(this.ch,this.id,m.from,true);c.open=false;this.h.connection&&this.h.connection(c);c.ch.postMessage({k:'open',from:this.id,to:m.from});}});
    setTimeout(()=>this.h.open&&this.h.open(this.id),20);}
  on(n,f){this.h[n]=f;}
  connect(id){const c=new FakeConn(this.ch,this.id,id,false);setTimeout(()=>this.ch.postMessage({k:'hello',from:this.id,to:id}),30);return c;}
  destroy(){}
}

}

function startDrag(e,el,id){
  if(!view||!view.legal||!view.legal.includes(id))return;
  const sx=e.clientX,sy=e.clientY,r=el.getBoundingClientRect();let ghost=null,moved=false;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  const mv=ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)>8){
      moved=true;dragging=true;ghost=el.cloneNode(true);ghost.className=el.className.replace(/sel|no|adv/g,'')+' ghost';
      ghost.style.cssText='position:fixed;z-index:60;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;margin:0;pointer-events:none;transform:scale(1.08);box-shadow:0 10px 24px #000a';
      document.body.appendChild(ghost);el.style.opacity='.25';$('game').classList.add('drag');
    }
    if(ghost){ghost.style.left=(r.left+dx)+'px';ghost.style.top=(r.top+dy)+'px';
      const hr=$('game').querySelector('.hand').getBoundingClientRect();$('game').classList.toggle('over',ev.clientY<hr.top-6);}
  };
  const up=ev=>{
    el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
    if(!moved)return;
    justDragged=true;setTimeout(()=>{justDragged=false;},350);
    const hr=$('game').querySelector('.hand').getBoundingClientRect(),drop=ev.type==='pointerup'&&ev.clientY<hr.top-6;
    if(ghost)ghost.remove();$('game').classList.remove('drag','over');dragging=false;el.style.opacity='';
    audio();
    if(drop){sel=-1;sendAct({a:'play',card:id});}
    else{if(pendingView){pendingView=false;}render();}
    pendingView=false;
  };
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

function trumpsLeft(v){const out=[];for(let r=7;r>=0;r--){}

  if((v.phase==='play'||v.phase==='trickEnd')&&v.trump!=null){const ext=v.trump<4;
    if(v.trick.length){const pts=v.trick.reduce((s,t)=>s+cpts(t.card,v.trump),0),w=trickWinner(v.trick,v.trump);
      info+='<span>Pli : <b>'+pts+' pt'+(pts>1?'s':'')+'</b> · '+(w.seat===me?'<b class="gd">tu gagnes</b>':w.seat%2===me%2?'<b class="gd">'+esc(v.names[w.seat])+' (ton partenaire) gagne</b>':'<b class="bd">'+esc(v.names[w.seat])+' gagne</b>')+'</span>';}
    const tl=ext?trumpsLeft(v):[];
    if(ext)info+='<span>Atouts '+suitHtml(v.trump)+' restants : '+(tl.length?tl.map(c=>'<b class="tk">'+RANKS[cr(c)]+'</b>').join(''):'<b>aucun</b>')+'</span>';
  }
  if(advice&&advice.why&&v.phase!=='bidding')info+='<span class="adv-t">💡 '+advice.why+'</span>';
  const tools=(v.phase==='play'||v.phase==='bidding'?'<button id="advB" '+(v.turn===me&&(v.legal||v.opts)?'':'disabled')+'>💡 Conseil</button>':'')+(v.phase!=='bidding'?'<button id="memB">📋 Cartes jouées</button>':'');
  return '<div class="aids">'+(info?'<div class="info">'+info+'</div>':'')+'<div class="tools">'+tools+'</div></div>';
}
function wireAids(v){
  if($('advB'))$('advB').onclick=()=>{audio();advice=computeAdvice(v);if(advice&&advice.bid){bidVal=advice.bid.val;bidSuit=advice.bid.suit;}render();};
  if($('memB'))$('memB').onclick=showMemo;
}
const SUITN_=['pique','cœur','carreau','trèfle'];
function computeAdvice(v){
  if(v.phase==='bidding'&&v.opts)return bidAnalysis(v);
  if(!v.legal)return null;
  const g=pseudoGame(v),c=botPlayCard(g,me),tr=v.trump;let why='';
  if(!v.trick.length){
    if(cs(c)===tr)why='Tu attaques : joue tes gros atouts pour faire tomber ceux des adversaires.';
    else if(cr(c)===7)why='Cet As est la carte maîtresse de sa couleur : il fera le pli.';
    else why='Ouvre avec une petite carte de ta couleur la plus longue.';
  }else{
    const w=trickWinner(v.trick,tr),partner=w.seat%2===me%2;
    if(partner)why=cpts(c,tr)>=10?'Ton partenaire est maître : donne-lui des points (10 ou As).':'Ton partenaire gagne : joue une petite carte.';
    else if(beats(c,w.card,tr))why=cs(c)===tr&&cs(w.card)!==tr?'Coupe à l’atout avec le plus petit atout possible pour prendre le pli.':'Prends le pli avec la plus petite carte qui gagne.';
    else why='Tu ne peux pas gagner ce pli : défausse ta carte la moins utile.';
  }
  return {card:c,why:why};
}
function bidAnalysis(v){
  const hand=v.hand,g=pseudoGame(v),a=botBidAction(g,me);
  let best=-1,bs=0;for(let s=0;s<6;s++){const e=estimate(hand,s);if(e>best){best=e;bs=s;}}
  const suit=a.a==='bid'?a.suit:bs,special=suit>=4,nJ=hand.filter(c=>cr(c)===4).length,n9a=hand.filter(c=>cr(c)===2).length,nA=hand.filter(c=>cr(c)===7).length,tr=hand.filter(c=>cs(c)===suit).sort((x,y)=>cstr(y,suit)-cstr(x,suit));
  const hasJ=tr.some(c=>cr(c)===4),has9=tr.some(c=>cr(c)===2),hasA=tr.some(c=>cr(c)===7),n=tr.length;
  const aces=special?nA:hand.filter(c=>cs(c)!==suit&&cr(c)===7).length,est=Math.round(estimate(hand,suit)/10)*10;
  const cb=v.cb,partnerBid=cb&&cb.seat%2===me%2;
  const L=[];let title,bid=null;
  if(a.a==='bid'){
    bid={val:a.val,suit:a.suit};title='✅ Prends : '+(a.val===500?'Capot':a.val)+' '+SUITS[a.suit];
    if(suit===4){L.push('Tout atout : toutes les couleurs sont de l’atout. Tu as '+nJ+' Valet(s) (20 pts chacun) et '+n9a+' neuf(s) (14 pts).');L.push('Chaque Valet est maître de sa couleur : il fera le pli.');}
    else if(suit===5){L.push('Sans atout : pas de coupe, l’As vaut 19 points. Tu as '+nA+' As.');L.push('Les As et les 10 qui les suivent font des plis presque sûrs.');}
    else{
    if(hasJ&&has9)L.push('Tu as le Valet et le 9 d’atout, les deux meilleures cartes (34 points à eux deux).');
    else if(hasJ)L.push('Tu as le Valet d’atout : c’est la carte la plus forte.');
    else if(has9)L.push('Tu as le 9 d’atout, la deuxième meilleure carte.');
    if(n>=4)L.push('Tu as '+n+' atouts : tu contrôles la couleur et tu pourras faire tomber ceux des adversaires.');
    else if(n===3)L.push('Tu as 3 atouts, c’est un bon début.');
    if(hasA&&!hasJ)L.push('Tu as l’As d’atout.');
    if(aces)L.push('Tu as '+aces+' As hors atout : ce sont des plis presque sûrs.');}
    if(partnerBid)L.push('Ton partenaire a annoncé '+cb.val+' : tu le soutiens en montant, ton jeu complète le sien.');
    L.push('Ta main vaut environ '+est+' points. Avec l’aide de ton partenaire, '+a.val+' est atteignable (il faut ≥ '+a.val+' points sur '+(suit===4?258:162)+').');
  }else if(a.a==='coinche'){
    title='⚔️ Tu peux coincher';L.push('Tu as '+tr.length+' atout(s) dans la couleur adverse'+(cb?' ('+SUITS[cb.suit]+')':'')+' dont le Valet ou le 9 : ils risquent de chuter.');L.push('Attention : si tu te trompes, ils marquent le double.');
    const t2=hand.filter(c=>cs(c)===cb.suit);L.length=0;L.push('Tu as '+t2.length+' atout(s) de leur couleur '+SUITS[cb.suit]+', dont le Valet ou le 9 : ils auront du mal à faire leur contrat.');L.push('Attention : si tu te trompes, ils marquent le double.');
  }else if(a.a==='sur'){title='🔥 Tu peux surcoincher';L.push('Ta main est solide pour ton contrat : tu peux quadrupler.');L.push('Risque : si tu chutes, ils marquent quatre fois.');}
  else{
    title='✋ Passe';
    if(partnerBid)L.push('Ton partenaire a déjà annoncé '+cb.val+' '+SUITS[cb.suit]+' : laisse-le jouer.');
    if(special){L.push(suit===4?'En Tout atout, il faut des Valets et des 9 : tu n’en as que '+nJ+' et '+n9a+'.':'En Sans atout, il faut des As : tu n’en as que '+nA+'.');}
    else if(!hasJ&&!has9)L.push('Dans ta meilleure couleur ('+SUITS[bs]+'), tu n’as ni le Valet ni le 9 d’atout : sans eux, ton atout est fragile.');
    else if(!hasJ)L.push('Tu n’as pas le Valet d’atout, la carte maîtresse.');
    if(!special&&n<3)L.push('Tu n’as que '+n+' atout(s) dans ta meilleure couleur : trop peu pour la contrôler.');
    if(!special&&!aces)L.push('Tu n’as aucun As hors atout pour faire des plis.');
    if(cb&&!partnerBid)L.push('Pour monter au-dessus de '+cb.val+', il faudrait une main qui vaut plus : la tienne vaut environ '+est+'.');
    if(!cb)L.push('Ta main vaut environ '+est+' points : il en faut environ 90 pour annoncer 80 en sécurité.');
  }
  return {bid:bid,title:title,lines:L,why:title};
}
function showMemo(){
  const v=view,pl=new Set(v.played||[]);
  const rows=[0,1,3,2].map(s=>'<div class="mrow"><b class="'+(s===1||s===2?'rd':'bk')+'">'+SUITS[s]+'</b>'+[7,3,6,5,4,2,1,0].map(r=>{const id=s*8+r,st=pl.has(id)?'pl':v.hand.includes(id)?'mine':'';return '<span class="mc2 '+st+(s===v.trump?' tr':'')+'">'+RANKS[r]+'</span>';}).join('')+'</div>').join('');
  openOv('<h2>Cartes jouées</h2><div class="memo">'+rows+'</div><p class="muted"><span class="mc2 pl">x</span> déjà jouée · <span class="mc2 mine">x</span> dans ta main · les autres sont chez les autres joueurs'+(v.trump!=null?'. Atout : '+SUITS[v.trump]:'')+'</p><button class="ob" id="x">Fermer</button>');
  $('x').onclick=closeOv;
}
function bidHint(v){
  let best=0,bs=0;for(let s=0;s<6;s++){const e=estimate(v.hand,s);if(e>best){best=e;bs=s;}}
  const tr=bs>3?[]:v.hand.filter(c=>cs(c)===bs).sort((x,y)=>cstr(y,bs)-cstr(x,bs));
  let h='<div class="hint">Meilleur contrat : '+suitHtml(bs)+(bs>3?'':' ('+tr.map(c=>RANKS[cr(c)]).join(' ')+')')+' · valeur ≈ <b>'+Math.round(best/10)*10+'</b>';
  if(advice&&advice.lines)h+='<div class="why2"><b>'+advice.title+'</b><ul>'+advice.lines.map(l=>'<li>'+l+'</li>').join('')+'</ul></div>';
  return h+'</div>';
}
