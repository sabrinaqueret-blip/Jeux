<title>Mon petit compagnon</title>
<style>
:root{
  --bg:#1D1230;--panel:#2E1C4D;--panel2:#3b2566;--ink:#FFF3FA;--muted:#C2ADDD;
  --pink:#FF6FB5;--gold:#FFD84A;--teal:#5EE6D0;--edge:#0E0719;--heart:#FF4D7A;--heart-off:#4A3470;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;font-variant-numeric:lining-nums tabular-nums;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;appearance:none;-webkit-appearance:none;margin:0;cursor:pointer}
.game{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:calc(100svh - 24px)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{min-width:0}.who b{display:block;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--muted);font-size:13px}
.hbtns{display:flex;align-items:center;gap:8px}
.wallet{font-weight:800;font-size:20px;white-space:nowrap}
.chip{font-size:14px;font-weight:700;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:6px 10px;box-shadow:0 3px 0 var(--edge);white-space:nowrap}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.screen{position:relative;width:100%;aspect-ratio:16/10;border:4px solid var(--edge);border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 2px var(--pink)}
canvas{display:block;width:100%;height:100%}canvas.mini{image-rendering:pixelated}.aim{width:46px;height:46px;object-fit:contain;vertical-align:middle}.aim.bgi{border-radius:8px;object-fit:cover;width:64px;height:40px}.detail h3 .aim{width:30px;height:30px}.detail h3 .aim.bgi{width:48px;height:30px}.egg .aim{width:52px;height:52px}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:94%;background:rgba(14,7,25,.85);padding:6px 12px;border-radius:8px;font-size:14px;font-weight:700;text-align:center;pointer-events:none}
.toast[hidden]{display:none}
.vit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:6px 10px}
.bar span{font-size:14px;font-weight:700;min-width:44px}
.hearts{display:flex;gap:3px}.hearts i{display:block;width:22px;height:19px}
.hearts svg{display:block;width:100%;height:100%;fill:var(--heart);shape-rendering:crispEdges}
.hearts i.off svg{fill:var(--heart-off)}
.hearts.joy svg{fill:#ffd84a}.hearts.joy i.off svg{fill:var(--heart-off)}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700}
.tags span{background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:3px 10px}
.tags .bad{background:#6a1f3a}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;background:var(--panel);border:3px solid var(--edge);border-radius:16px;box-shadow:0 5px 0 var(--edge);padding:4px 2px}
.ab .e{font-size:28px;line-height:1}.ab .l{font-size:12px;font-weight:700}
.ab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.ab.alert{background:#7a2a55;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.3)}}
.ab:disabled{opacity:.5}
.overlay{position:fixed;inset:0;z-index:20;display:flex;background:rgba(22,10,40,.95);overflow:auto;padding:12px 14px}
.overlay[hidden]{display:none}
.box{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px;width:100%;max-width:440px}
.box h2{margin:0;font-size:26px;color:var(--gold)}
.box p{margin:0}.muted{color:var(--muted);font-size:14px}
.ob{width:100%;max-width:340px;padding:12px;font-size:17px;font-weight:800;color:#2a0f3d;background:var(--pink);border:2px solid var(--edge);border-radius:12px;box-shadow:0 4px 0 var(--edge)}
.ob.alt{background:var(--panel);color:var(--ink)}
.ob:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.ob:disabled{opacity:.55}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.tile{flex:1 1 28%;max-width:132px;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--panel);border:3px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edge);color:var(--ink)}
.tile .ic{font-size:36px;line-height:1}.tile .nm{font-size:13px;font-weight:700;line-height:1.15}.tile .pr{font-size:18px;font-weight:800;color:var(--gold)}
.tile.sel{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 3px rgba(255,216,74,.35),0 4px 0 var(--edge)}
.tile.done .pr{color:var(--teal);font-size:14px}
.tabs{display:flex;gap:6px;width:100%}.tabs button{flex:1;padding:8px 4px;font-weight:800;font-size:14px;background:var(--panel);border:2px solid var(--edge);border-radius:10px}
.tabs button.on{background:var(--pink);color:#2a0f3d}
.detail{width:100%;text-align:left;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:8px 12px}
.detail h3{margin:0 0 4px;font-size:17px;color:var(--gold)}.detail p{font-size:14px;line-height:1.35}
.big{font-size:56px;line-height:1}
.hands{display:flex;gap:10px;width:100%;justify-content:center}
.hb{flex:1;max-width:110px;font-size:44px;padding:10px 0;background:var(--panel);border:3px solid var(--edge);border-radius:16px;box-shadow:0 5px 0 var(--edge)}
.hb:active{transform:translateY(3px)}
.vs{display:flex;align-items:center;justify-content:center;gap:24px;font-size:60px}
.score{font-size:20px;font-weight:800;color:var(--gold)}
.eggs{display:flex;gap:8px;width:100%}
.egg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--panel);border:3px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edge);font-size:12px;font-weight:700}
.egg .ic{font-size:40px}.egg.sel{border-color:var(--gold);background:var(--panel2)}
input.nm{width:100%;max-width:340px;padding:12px;font-size:18px;font-weight:700;text-align:center;color:var(--ink);background:var(--panel);border:2px solid var(--pink);border-radius:12px;user-select:text;-webkit-user-select:text}
.log{width:100%;text-align:left;font-size:14px;line-height:1.5;background:var(--panel);border-radius:12px;padding:8px 12px;max-height:40vh;overflow:auto}
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px;gap:10px;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:8px 12px;font-weight:700;text-align:left}
canvas.mini{width:100%;max-width:420px;aspect-ratio:16/10;border:3px solid var(--edge);border-radius:10px;touch-action:none;background:#0a0518}
@media (orientation:landscape) and (max-height:600px){
  body{padding-block:6px}
  .game{max-width:none;display:grid;grid-template-columns:auto minmax(260px,1fr);grid-template-rows:auto auto 1fr;gap:6px 12px;min-height:0;height:calc(100svh - 12px)}
  .hud{grid-column:1/3}
  .screen{grid-column:1;grid-row:2/4;width:auto;height:calc(100svh - 62px);max-width:calc(100vw - 340px)}
  .vit{grid-column:2;grid-row:2;grid-template-columns:1fr}
  .tags{display:none}
  .acts{grid-column:2;grid-row:3;grid-template-columns:repeat(4,1fr);margin-top:0;align-content:start}
  .ab{min-height:58px}.ab .e{font-size:24px}
  .overlay{padding:6px 12px}.box{max-width:720px;gap:6px}.box h2{font-size:22px}
  .big{font-size:40px}.vs{font-size:44px}
}
@media (prefers-reduced-motion:reduce){.ab.alert{animation:none}}

.sec{margin:6px 0 0;width:100%;text-align:left;font-size:15px;color:var(--teal);font-weight:800}
.chips{display:flex;gap:6px;width:100%;flex-wrap:wrap;justify-content:center}.chips button{padding:6px 12px;font-weight:800;font-size:13px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;color:var(--ink)}
.chips button.on{background:var(--teal);color:#0e3a33}
.egg.rare{border-color:#8f5bd6}.egg small{color:var(--gold);font-size:10px}.egg{min-width:0;font-size:11px}.eggs{flex-wrap:wrap}.egg{flex:1 1 20%}
.mgrid{display:grid;gap:6px;width:100%;max-width:340px}
.mc{aspect-ratio:1;font-size:28px;background:var(--panel2);border:3px solid var(--edge);border-radius:10px;box-shadow:0 3px 0 var(--edge);color:var(--ink);padding:0}
.mc.up{background:#fff3fa}.mc.done{background:var(--teal);opacity:.55}
.tq{aspect-ratio:1;font-size:26px;font-weight:800;background:var(--pink);color:#2a0f3d;border:3px solid var(--edge);border-radius:10px;box-shadow:0 3px 0 var(--edge);padding:0}
.tq.ok{background:var(--teal)}.tq.empty{visibility:hidden}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:280px}
.pad{aspect-ratio:1.3;border:4px solid var(--edge);border-radius:16px;box-shadow:0 4px 0 var(--edge);opacity:.7}.pad.lit{opacity:1;filter:brightness(1.6);transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}
.opt{padding:14px 6px;font-size:20px;font-weight:800;background:var(--panel);border:3px solid var(--edge);border-radius:12px;box-shadow:0 3px 0 var(--edge);color:var(--ink)}
.opt.good{background:#2f8a4c}.opt.bad{background:#a02a4a}.opt:disabled{opacity:1}
.qtxt{font-size:30px;font-weight:800;line-height:1.2}.qtxt.sen{font-size:22px}
.why{width:100%;max-width:360px;text-align:left;background:var(--panel);border:2px solid var(--pink);border-radius:12px;padding:10px 12px}.why p{margin:6px 0 0;font-size:15px;line-height:1.4}

.famlist{display:flex;flex-direction:column;gap:8px;width:100%}
.fam{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;background:var(--panel);border:3px solid var(--edge);border-radius:12px;box-shadow:0 3px 0 var(--edge);color:var(--ink);width:100%}
.fam.sel{border-color:var(--teal)}.fam:disabled{opacity:.55}
.fam .fe{font-size:26px;min-width:34px;text-align:center}.fam .fn{flex:1;min-width:0}.fam .fn b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fam .fn small{color:var(--muted);font-size:12px}.fam .fs{font-size:18px}
/*UIKIT*/
#ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ov>div{border-radius:26px!important;box-shadow:0 24px 60px #000d,0 0 0 1px #ffffff2e inset,0 0 40px #a65cff22;background-image:linear-gradient(165deg,#ffffff12,#ffffff00 40%)}
#ov h2,#ov h1{letter-spacing:.3px;text-shadow:0 2px 8px #0008}
.mi{display:block;width:76px;height:76px;margin:0 auto 6px;border-radius:22px;box-shadow:0 8px 18px #000a,0 0 0 2px #ffffff30 inset}
.ob{background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 58%);border-radius:16px!important;text-shadow:0 1px 0 #ffffff55;transition:transform .08s,box-shadow .08s}
.ob:active{transform:translateY(3px)}
.ob.alt{background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));text-shadow:none}
.chips button,.tabs button{transition:transform .08s}
.chips button.on,.tabs button.on{box-shadow:0 0 14px #f6c85f99}
.si,.it{border-radius:18px!important;box-shadow:0 6px 14px #0005,0 0 0 1px #ffffff22 inset}
.si.on,.it.on{box-shadow:0 0 16px #f6c85f88,0 0 0 2px #f6c85f inset}
.chip{box-shadow:0 2px 6px #0005}
</style>

<main class="game" id="game">
  <header class="hud">
    <div class="who"><b id="pName">—</b><small id="pAge"></small></div>
    <div class="hbtns"><span class="wallet" id="wallet">0 💎</span><button class="chip" id="famBtn" aria-label="Ma famille">👪 <span id="famN">1</span></button><button class="chip" id="menuBtn">☰ Menu</button></div>

  <div class="screen"><canvas id="cv" width="512" height="320" role="img" aria-label="Ton petit compagnon"></canvas><div class="toast" id="toast" hidden></div></div>

    <div class="bar"><span>Faim</span><div class="hearts" id="hHunger"></div></div>

  <div class="tags" id="tags"></div>

    <button class="ab" data-a="med"><span class="e">💊</span><span class="l">Soigner</span></button>

  </nav>
</main>
<div class="overlay" id="ov" hidden></div>

function stepMin(s,t,k){
  s.ageMin+=k;s.stageMin+=k;

  /* changements d'âge */
  if(st==='egg'&&s.stageMin>=DUR.egg){s.stage='baby';s.stageMin=0;s.missStage=0;s.hunger=4;s.happy=4;s.weight=5;logEv(s,t,'🐣 '+s.name+' est né !');return;}
  if(st==='baby'&&s.stageMin>=DUR.baby){s.stage='child';s.stageMin=0;s.missStage=0;s.weight=12;logEv(s,t,'✨ '+s.name+' a grandi : c’est un enfant !');}
  else if(st==='child'&&s.stageMin>=DUR.child){s.form=s.missStage<=2?0:1;s.stage='teen';s.stageMin=0;s.missStage=0;s.weight=22;logEv(s,t,'✨ '+s.name+' est devenu ado'+(s.form?'… un peu rebelle':' !'));}

  /* sommeil */
  const night=isSleepTime(t,s.stage);
  if(night){
    if(!s.wasNight){s.wasNight=true;s.nightStart=t;s.sleepMissed=false;}
    s.asleep=true;
    if(s.light&&t-s.nightStart>25*MIN&&!s.sleepMissed){s.sleepMissed=true;s.miss++;s.missStage++;s.happy=Math.max(0,s.happy-.5);logEv(s,t,'💡 La lumière était restée allumée : il dort mal.');}
  }else if(s.wasNight){s.wasNight=false;s.asleep=false;s.light=true;logEv(s,t,'☀️ '+s.name+' se réveille.');}
  /* faim et joie */
  const rh=RH[s.stage],rp=RP[s.stage];
  if(s.asleep){s.hunger=Math.max(0,s.hunger-k/(rh*4));}
  else{
    const hb=s.hunger;

  }
  /* appels ignorés = erreurs de soin */
  if(isCalling(s)){

    if(s.callMin>=30&&!s.callMissed){s.callMissed=true;s.miss++;s.missStage++;}
  }else{s.callMin=0;s.callMissed=false;}

  if(!s.asleep&&s.pooTimer!=null){
    s.pooTimer-=k;
    if(s.pooTimer<=0){s.pooTimer=null;if(s.poop<3){s.poop++;if(!s.poopSince)s.poopSince=t;logEv(s,t,'💩 Oups, un caca à nettoyer.');}}
  }

  if(!s.sick&&!s.asleep){
    let p=1/4000;

    if(s.hunger<=0)p+=1/300;
    if(overweight(s))p*=2;
    if(Math.random()<p*k){s.sick=true;s.sickMin=0;s.doses=0;logEv(s,t,'🤒 '+s.name+' est malade !');}
  }

  /* faim extrême */

  }
}
function advance(s,now){
  if(s.stage==='dead'||s.stage==='gone'){s.last=now;return;}
  if(now<s.last){s.last=now;return;}
  let t=s.last;
  if(now-t>14*DAY)t=now-14*DAY;
  while(t<now){
    const dt=Math.min(MIN,now-t);t+=dt;
    stepMin(s,t,dt/MIN);

  }

function canAct(s){

  if(s.asleep)return s.name+' dort.';
  return '';
}
function feed(s,kind,now){
  const e=canAct(s);if(e)return {ok:false,msg:e};

  if(f.hunger&&!f.happy&&s.hunger>=3.95)return {ok:false,msg:s.name+' n’a plus faim.'};
  if(!f.hunger&&s.happy>=3.95)return {ok:false,msg:s.name+' est déjà tout content.'};
  s.hunger=Math.min(4,s.hunger+f.hunger);s.happy=Math.min(4,s.happy+f.happy);s.weight+=f.weight;
  if(s.pooTimer==null)s.pooTimer=100+Math.random()*60;

function moodOf(s,fx){
  if(fx&&fx.food)return 'eat';

}

let mus={id:'',timer:0,next:0,step:0,bar:0,gain:null};
const mfreq=m=>440*Math.pow(2,(m-69)/12);
function chordTones(root,minor){const t=[0,minor?3:4,7,12,minor?15:16,19,24];return t.map(x=>root+x);}
function musNote(m,when,dur,wave,v,tr){
  const o=actx.createOscillator(),g=actx.createGain();o.type=wave;o.frequency.value=mfreq(m);
  g.gain.setValueAtTime(0.0001,when);g.gain.linearRampToValueAtTime(v,when+.02);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(mus.gain);o.start(when);o.stop(when+dur+.05);
}
function musSchedule(){
  if(!actx||!mus.id||G.muted){return;}
  const T=TRACKS[mus.id];if(!T)return;const sd=60/T.bpm/2;
  while(mus.next<actx.currentTime+.4){
    const chord=T.prog[mus.bar%T.prog.length],tones=chordTones(chord[0],chord[1]);
    const motif=T.motifs[(mus.bar>>1)%T.motifs.length],ix=motif[mus.step],bx=T.bass[mus.step];
    if(ix>=0)musNote(tones[ix]+12,mus.next,sd*(T.wave==='sine'?3:1.6),T.wave,T.vol);
    if(bx>=0)musNote(chord[0]-12+(bx?7:0),mus.next,sd*3,'triangle',T.vol*1.6);
    mus.next+=sd;mus.step++;if(mus.step>=8){mus.step=0;mus.bar++;}
  }
}
function musStop(){clearInterval(mus.timer);mus.timer=0;if(mus.gain){try{mus.gain.gain.setTargetAtTime(0,actx.currentTime,.1);}catch(e){}mus.gain=null;}}
function musStart(){
  musStop();
  let id=G.music;if(id==='auto')id=P&&(P.asleep||!P.light)?'berceuse':'prairie';
  if(!id||id==='off'||!TRACKS[id]||G.muted||!actx||document.hidden){mus.id='';return;}
  mus.id=id;mus.gain=actx.createGain();mus.gain.gain.value=1;mus.gain.connect(actx.destination);
  mus.next=actx.currentTime+.1;mus.step=0;mus.bar=0;mus.timer=setInterval(musSchedule,120);
}
function musRefresh(){if(actx&&actx.state==='running'){if(G.music==='auto'){const want=P&&(P.asleep||!P.light)?'berceuse':'prairie';if(want!==mus.id)musStart();}}}

function explainOrtho(q,a,o){
  const k=a.toLowerCase();
  if(EXW[k])return EXW[k];
  const wr=o.filter(x=>x!==a).map(x=>'« '+x+' »').join(' ou ');
  return 'On écrit « '+a+' », et non '+wr+'. Recopie-le une fois en séparant les syllabes pour le retenir.';
}
function makeMath(lv){
  let a,b,q,r,ex='';
  if(lv===1){
    const k=rnd(1,5);
    if(k<=2){a=rnd(2,15);b=rnd(2,15);q=a+' + '+b;r=a+b;}
    else if(k<=4){a=rnd(8,20);b=rnd(1,a-1);q=a+' − '+b;r=a-b;}
    else{a=rnd(2,5);b=rnd(2,10);q=a+' × '+b;r=a*b;ex='Révise ta table de '+a+'.';}
  }else if(lv===2){
    const k=rnd(1,5);
    if(k===1){a=rnd(20,70);b=rnd(12,60);q=a+' + '+b;r=a+b;}
    else if(k===2){a=rnd(50,99);b=rnd(11,a-5);q=a+' − '+b;r=a-b;}
    else if(k<=4){a=rnd(3,9);b=rnd(3,9);q=a+' × '+b;r=a*b;ex='Révise ta table de '+a+' (ou de '+b+').';}
    else{b=rnd(2,9);r=rnd(3,10);a=b*r;q=a+' ÷ '+b;}
  }else{
    const k=rnd(1,6);
    if(k===1){a=rnd(11,25);b=rnd(3,9);q=a+' × '+b;r=a*b;}
    else if(k===2){a=rnd(120,480);b=rnd(35,190);q=a+' + '+b;r=a+b;}
    else if(k===3){a=rnd(200,500);b=rnd(35,190);q=a+' − '+b;r=a-b;}
    else if(k===4){a=rnd(2,9);b=rnd(2,9);const c=rnd(2,9);q=a+' + '+b+' × '+c;r=a+b*c;ex='La multiplication est prioritaire : '+b+' × '+c+' = '+(b*c)+', puis '+a+' + '+(b*c)+'.';}
    else if(k===5){b=rnd(4,12);r=rnd(6,15);a=b*r;q=a+' ÷ '+b;ex='Une division se vérifie avec une multiplication : '+r+' × '+b+' = '+a+'.';}
    else{a=rnd(2,6);b=rnd(2,6);const c=rnd(2,9);q='('+a+' + '+b+') × '+c;r=(a+b)*c;ex='On calcule d’abord les parenthèses : '+a+' + '+b+' = '+(a+b)+', puis × '+c+'.';}
  }
  const set=new Set([r]);const offs=[1,-1,2,-2,10,-10,3,-3,5,-5];
  const cand=pick(offs,10);for(const o of cand){if(set.size>=4)break;const v=r+o;if(v>=0)set.add(v);}
  while(set.size<4)set.add(r+set.size+10);
  if(!ex){ex=q+' = '+r+'. ';if(q.includes('+')&&!q.includes('×'))ex+='Pose l’addition en colonnes pour vérifier.';else if(q.includes('−'))ex+='Vérifie : '+r+' + '+(q.split(' − ')[1])+' = '+q.split(' − ')[0]+'.';else if(q.includes('×'))ex+='Décompose : '+q+' avec une multiplication simple.';}
  else ex=q+' = '+r+'. '+ex;
  return {q:q+' = ?',a:String(r),o:pick([...set].map(String),4),e:ex};
}

/* ---------- Mémoire ---------- */
function gMemo(){
  chooseLevel('Mémoire','Retrouve toutes les paires avec le moins de coups possible.',GAINS.memo,lv=>{
    const tok=++gTok,cols=[4,4,5][lv-1],pairs=[6,8,10][lv-1];
    const em=pick(['🍎','🐟','🌟','🎈','🍓','🦋','🌈','🍩','🐝','🎵','🍄','🐞','🍒','🐙'],pairs);
    const cards=pick(em.concat(em),pairs*2).map((e,i)=>({e:e,up:false,done:false}));
    let first=-1,lock=false,moves=0,found=0;
    const draw=()=>{
      openModal('<h2>Mémoire</h2><p class="score">'+moves+' coup(s) · '+found+' / '+pairs+' paires</p><div class="mgrid" style="grid-template-columns:repeat('+cols+',1fr)">'+
        cards.map((c,i)=>'<button class="mc'+(c.up||c.done?' up':'')+(c.done?' done':'')+'" data-i="'+i+'">'+(c.up||c.done?c.e:'❓')+'</button>').join('')+'</div><button class="ob alt" id="x">Abandonner</button>');
      ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i,c=cards[i];if(lock||c.up||c.done)return;
        c.up=true;SFX.pop();
        if(first<0){first=i;draw();return;}
        moves++;const d=cards[first];
        if(d.e===c.e){d.done=c.done=true;d.up=c.up=false;found++;first=-1;SFX.ok();draw();
          if(found===pairs)setTimeout(()=>{if(!alive(tok))return;const k=moves<=pairs*1.6?1:moves<=pairs*2.4?.65:.35;
            const g=endGame('Toutes les paires !',Math.round(GAINS.memo[lv-1]*k),1,moves+' coups pour '+pairs+' paires');g.again.onclick=gMemo;g.close.onclick=closeModal;},500);
        }else{lock=true;draw();setTimeout(()=>{if(!alive(tok))return;d.up=c.up=false;first=-1;lock=false;draw();},800);}
      });
      $('x').onclick=()=>{gTok++;const g=endGame('Dommage…',0,.5);g.again.onclick=gMemo;g.close.onclick=closeModal;};
    };
    draw();
  });
}

function gSeq(){
  chooseLevel('Séquence','Regarde la mélodie de couleurs, puis répète-la dans le même ordre.',GAINS.seq,lv=>{
    const tok=++gTok,target=[5,8,12][lv-1],spd=[640,500,380][lv-1],cols=['#e8453c','#3a8ae8','#4aad4c','#ffd84a'],fr=[262,330,392,523];
    const seq=[];let pos=0,showing=true;
    const draw=(lit)=>{
      openModal('<h2>Séquence</h2><p class="score">Niveau '+seq.length+' / '+target+'</p><p>'+(showing?'Regarde bien…':'À toi de jouer !')+'</p><div class="pads">'+
        cols.map((c,i)=>'<button class="pad'+(lit===i?' lit':'')+'" data-p="'+i+'" style="background:'+c+'" '+(showing?'disabled':'')+'></button>').join('')+'</div>');
      ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>press(+b.dataset.p));
    };
    const play=(i)=>{if(!alive(tok))return;tone(fr[i],fr[i],.25,'triangle',.07);};
    const show=()=>{
      seq.push((Math.random()*4)|0);pos=0;showing=true;draw(-1);
      seq.forEach((p,k)=>{
        setTimeout(()=>{if(alive(tok)){draw(p);play(p);}},700+k*spd);
        setTimeout(()=>{if(alive(tok))draw(-1);},700+k*spd+spd*.6);
      });
      setTimeout(()=>{if(alive(tok)){showing=false;draw(-1);}},700+seq.length*spd);
    };
    const press=(p)=>{
      if(showing)return;
      play(p);
      if(p!==seq[pos]){const reached=seq.length-1;setTimeout(()=>{if(!alive(tok))return;gTok++;const g=endGame(reached>=target?'Parfait !':'Raté !',Math.round(GAINS.seq[lv-1]*reached/target),reached>=target/2?1:.5,reached+' niveau(x) réussi(s) sur '+target);g.again.onclick=gSeq;g.close.onclick=closeModal;},400);SFX.no();return;}
      pos++;draw(p);setTimeout(()=>{if(alive(tok))draw(-1);},150);
      if(pos>=seq.length){
        if(seq.length>=target){setTimeout(()=>{if(!alive(tok))return;gTok++;const g=endGame('Quelle mémoire !',GAINS.seq[lv-1],1,'Séquence de '+target+' réussie');g.again.onclick=gSeq;g.close.onclick=closeModal;},500);}
        else setTimeout(()=>{if(alive(tok))show();},700);
      }
    };
    show();
  });
}

function gTaq(){
  chooseLevel('Taquin','Remets les nombres dans l’ordre en faisant glisser les tuiles. Plus la grille est difficile, plus tu gagnes.',GAINS.taq,lv=>{
    const tok=++gTok,[W,H,sh]=[[3,3,40],[4,4,90],[4,4,320]][lv-1],N=W*H;
    let t=[...Array(N).keys()].map(i=>(i+1)%N);                 /* 1..N-1, 0 = case vide */
    let e=N-1,prev=-1;
    for(let k=0;k<sh;k++){const x=e%W,y=(e/W)|0,nb=[];if(x>0)nb.push(e-1);if(x<W-1)nb.push(e+1);if(y>0)nb.push(e-W);if(y<H-1)nb.push(e+W);
      const ch=nb.filter(n=>n!==prev),m=ch[(Math.random()*ch.length)|0];t[e]=t[m];t[m]=0;prev=e;e=m;}
    if(t.every((v,i)=>v===(i+1)%N)){t[e]=t[e-1];t[e-1]=0;e=e-1;}
    let moves=0;
    const draw=()=>{
      openModal('<h2>Taquin</h2><p class="score">'+moves+' coup(s)</p><div class="mgrid" style="grid-template-columns:repeat('+W+',1fr);max-width:'+(W*74)+'px">'+
        t.map((v,i)=>'<button class="tq'+(v?'':' empty')+((v&&v===(i+1)%N)?' ok':'')+'" data-i="'+i+'">'+(v||'')+'</button>').join('')+'</div><button class="ob alt" id="x">Abandonner</button>');
      ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i,x=i%W,y=(i/W)|0,ex=e%W,ey=(e/W)|0;
        if(Math.abs(x-ex)+Math.abs(y-ey)!==1){SFX.no();return;}
        t[e]=t[i];t[i]=0;e=i;moves++;SFX.pop();draw();
        if(t.every((v,k)=>v===(k+1)%N))setTimeout(()=>{if(!alive(tok))return;gTok++;const g=endGame('Bravo, c’est reconstitué !',GAINS.taq[lv-1],1,moves+' coups');g.again.onclick=gTaq;g.close.onclick=closeModal;},500);
      });
      $('x').onclick=()=>{gTok++;const g=endGame('Dommage…',0,.5);g.again.onclick=gTaq;g.close.onclick=closeModal;};
    };
    draw();
  });
}

function runQuiz(title,items,base,again,sentence){
  const tok=++gTok,N=items.length;let i=0,good=0;
  const next=()=>{
    if(!alive(tok))return;i++;
    if(i<N)draw(null);
    else{gTok++;const perfect=good===N,gems=Math.round(base*good/N)+(perfect?Math.round(base*.25):0);
      const g=endGame(perfect?'Sans faute !':good>=N*.6?'Bien joué !':'Continue, tu progresses',gems,good>=N*.6?1:.5,good+' bonne(s) réponse(s) sur '+N+(perfect?' · bonus sans faute':''));g.again.onclick=again;g.close.onclick=closeModal;}
  };
  const draw=(ans)=>{
    const it=items[i],wrong=ans!=null&&ans!==it.a;
    openModal('<h2>'+title+'</h2><p class="score">Question '+(i+1)+' / '+N+' · '+good+' juste(s)</p><p class="qtxt'+(sentence?' sen':'')+'">'+it.q+'</p><div class="opts">'+
      it.o.map(o=>'<button class="opt'+(ans!=null?(o===it.a?' good':(o===ans?' bad':'')):'')+'" data-o="'+o.replace(/"/g,'&quot;')+'" '+(ans!=null?'disabled':'')+'>'+o+'</button>').join('')+'</div>'+
      (wrong?'<div class="why"><b>La bonne réponse : <span style="color:var(--gold)">'+it.a+'</span></b><p>'+(it.e||'')+'</p></div><button class="ob" id="nx">Suivant</button>':'<p class="muted">&nbsp;</p>'));
    if($('nx'))$('nx').onclick=next;
    ov.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      const o=b.dataset.o;
      if(o===it.a){good++;SFX.ok();draw(o);setTimeout(next,650);}
      else{SFX.no();draw(o);}
    });
  };
  draw(null);
}
function gMath(){
  chooseLevel('Calcul mental','8 questions. Choisis le bon résultat.',GAINS.math,lv=>{

function tone(f0,f1,d,type,v,delay){

  try{const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}

const heartSvg='<svg viewBox="0 0 7 6" aria-hidden="true">'+['.##.##.','#######','#######','.#####.','..###..','...#...'].map((row,y)=>[...row].map((c,x)=>c==='#'?'<rect x="'+x+'" y="'+y+'" width="1" height="1"/>':'').join('')).join('')+'</svg>';
for(const id of ['hHunger','hHappy'])for(let i=0;i<4;i++){const e=document.createElement('i');e.innerHTML=heartSvg;$(id).appendChild(e);}

/* ---------- rafraîchir l'écran ---------- */
function spName(s){return s.species2!=null&&s.species2!==s.species?hybridName(s.species,s.species2)+' ('+SPECIES[s.species].name+' × '+SPECIES[s.species2].name+')':SPECIES[s.species].name;}
function spEmoji(s){return SPECIES[s.species].emoji+(s.species2!=null&&s.species2!==s.species?SPECIES[s.species2].emoji:'');}
function ageText(s){
  const d=Math.floor(s.ageMin/1440),h=Math.floor((s.ageMin%1440)/60);
  const st={egg:'Œuf',baby:'Bébé',child:'Enfant',teen:'Ado',adult:'Adulte'}[s.stage]||'';
  return st+' · '+(d?d+' j ':'')+h+' h';
}
function refresh(){
  if(!P)return;
  $('pName').textContent=P.name+' '+(P.sex==='m'?'♂':'♀');$('pAge').textContent=(P.stage==='dead'||P.stage==='gone')?'…':ageText(P)+' · '+spName(P);$('famN').textContent=G.pets.length;
  $('wallet').textContent=G.wallet+' 💎';
  const hh=hearts(P.hunger),hp=hearts(P.happy);
  [...$('hHunger').children].forEach((c,i)=>c.classList.toggle('off',i>=hh));
  [...$('hHappy').children].forEach((c,i)=>c.classList.toggle('off',i>=hp));
  const tags=[];
  if(P.stage!=='egg')tags.push('<span>⚖️ '+P.weight+' g</span>');
  if(P.sick)tags.push('<span class="bad">🤒 Malade</span>');
  if(P.poop)tags.push('<span class="bad">💩 ×'+P.poop+'</span>');
  if(P.asleep)tags.push('<span>😴 Dort</span>');
  if(overweight(P))tags.push('<span class="bad">Un peu rond</span>');
  $('tags').innerHTML=tags.join('');
  const A=n=>document.querySelector('[data-a="'+n+'"]');
  A('feed').classList.toggle('alert',!P.asleep&&P.stage!=='egg'&&P.hunger<=1);
  A('play').classList.toggle('alert',!P.asleep&&P.stage!=='egg'&&P.happy<=1&&!P.sick);
  A('clean').classList.toggle('alert',P.poop>0);
  A('med').classList.toggle('alert',P.sick);
  A('light').classList.toggle('alert',isSleepTime(Date.now(),P.stage)&&P.light);
  A('light').querySelector('.e').textContent=P.light?'💡':'🌙';
  A('light').querySelector('.l').textContent=P.light?'Éteindre':'Allumer';
}
/* ---------- boucle ---------- */
function frame(){
  requestAnimationFrame(frame);
  tFrame++;
  if(P){
    if(fx){fx.t++;if(fx.t>fx.len)fx=null;}
    drawScene(P,tFrame,fx);
  }
  if(toastT>0){toastT-=16;if(toastT<=0)toastEl.hidden=true;}
}
function tick(){
  if(!P||!G.pet&&false)return;
  const before=P.stage,n=P.log.length;
  for(const q of G.pets)if(q!==P){const b0=q.stage;advance(q,Date.now());if(b0!==q.stage&&(q.stage==='dead'||q.stage==='gone')&&!q.noted){q.noted=true;toast((q.stage==='gone'?'🌠 ':'🕯️ ')+q.name+' est parti(e)…',4000);}else if(b0==='egg'&&q.stage==='baby')toast('🐣 '+q.name+' est né !',3500);}
  advance(P,Date.now());
  syncWear(P);
  if(before!=='baby'&&P.stage==='baby'){SFX.hatch();toast('🐣 '+P.name+' est né !',3500);fx={t:0,len:120,hearts:true,happy:true};}
  else if(before!==P.stage&&['child','teen','adult'].includes(P.stage)){SFX.hatch();toast('✨ '+P.name+' a grandi !',3500);fx={t:0,len:120,hearts:true,happy:true};}
  if(callingNow()&&!tick.called){tick.called=true;SFX.call();}else if(!callingNow())tick.called=false;
  notifyDue();musRefresh();
  refresh();save();storeAlerts();
  if((P.stage==='dead'||P.stage==='gone')&&!P.shown)showEnd();
}
function callingNow(){return isCalling(P);}
setInterval(tick,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();}});

/* ---------- début de partie ---------- */
function showPick(){
  let sel=0,sex=window.__sx||(Math.random()<.5?'f':'m');window.__sx=sex;
  const canCancel=G.pets.length>0;
  const ok=i=>!SPECIES[i].rare||G.owned.includes('egg_'+i);
  const draw=()=>{
    const sp=SPECIES[sel];
    openModal('<h2>Un œuf mystérieux</h2><p class="muted">Choisis un œuf. Selon tes soins, il deviendra une créature différente.</p><div class="eggs">'+
      SPECIES.map((q,i)=>'<button class="egg'+(i===sel?' sel':'')+(q.rare?' rare':'')+'" data-egg="'+i+'"><span class="ic">'+(ok(i)?'<img class="aim" src="img/'+SPN[i]+'_f_egg.png?v=2" alt="">':'🔒')+'</span>'+q.name+(q.rare?'<small>✨ rare</small>':'')+'</button>').join('')+'</div>'+
      '<div class="detail"><h3>'+sp.emoji+' '+sp.name+'</h3><p>'+sp.desc+'</p>'+(ok(sel)?'':'<p style="color:var(--gold);font-weight:800">🔒 À débloquer à la boutique (onglet Œufs) : '+sp.price+' 💎</p>')+'</div>'+
      '<div class="chips"><button data-sx="f" class="'+(sex==='f'?'on':'')+'">♀ Fille</button><button data-sx="m" class="'+(sex==='m'?'on':'')+'">♂ Garçon</button></div>'+
      '<input class="nm" id="nameIn" maxlength="12" placeholder="Son prénom" value="'+(window.__nm||'')+'" aria-label="Prénom">'+
      (ok(sel)?'<button class="ob" id="go">Faire éclore l’œuf</button>':'<button class="ob" id="unl" '+(G.wallet<sp.price?'disabled':'')+'>Débloquer · '+sp.price+' 💎 (tu as '+G.wallet+')</button>')+(canCancel?'<button class="ob alt" id="cancel">Annuler</button>':''));
    ov.querySelectorAll('[data-egg]').forEach(b=>b.onclick=()=>{window.__nm=$('nameIn').value;sel=+b.dataset.egg;draw();});
    ov.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>{window.__nm=$('nameIn').value;sex=window.__sx=b.dataset.sx;draw();});
    if($('cancel'))$('cancel').onclick=()=>{window.__nm='';closeModal();};
    if($('unl'))$('unl').onclick=()=>{if(G.wallet<sp.price)return;audio();G.wallet-=sp.price;G.owned.push('egg_'+sel);SFX.win();save();refresh();window.__nm=$('nameIn').value;draw();};
    if($('go'))$('go').onclick=()=>{audio();const nm=$('nameIn').value.trim()||sp.name;window.__nm='';window.__sx=null;
      addPet(newPet(Date.now(),sel,nm,sex));G.tuto=true;save();closeModal();refresh();
      toast('Ton œuf va bientôt éclore. Reviens vite !',4000);storeAlerts();};
  };
  draw();
}
function addPet(q){syncWear(q);G.pets.push(q);G.cur=G.pets.length-1;P=q;fx=null;}
function switchTo(i){
  if(!G.pets[i])return;
  save();G.cur=i;P=G.pets[i];syncWear(P);fx=null;tick.called=false;refresh();save();closeModal();
  if((P.stage==='dead'||P.stage==='gone')&&!P.shown)showEnd();
}
function removeCur(askEgg){
  G.pets.splice(G.cur,1);G.cur=0;P=G.pets[0]||null;
  if(P){syncWear(P);fx=null;refresh();toast('Tu retrouves '+P.name+' '+spEmoji(P));}
  save();
  if(!P||askEgg)showPick();
}
const COOL=12*3600*1000;
function breedWait(q){return Math.max(0,(q.lastBreed||0)+COOL-Date.now());}
function canBreedPair(a,b){return a!==b&&a.stage==='adult'&&b.stage==='adult'&&a.sex!==b.sex&&!breedWait(a)&&!breedWait(b);}
function petStatus(q){
  if(q.stage==='dead')return '🕯️';if(q.stage==='gone')return '🌠';if(q.stage==='egg')return '🥚';
  let t='';if(q.asleep)t+='😴';if(q.sick)t+='🤒';if(!q.asleep&&q.hunger<=1)t+='🍽️';if(!q.asleep&&q.happy<=1)t+='😢';if(q.poop)t+='💩';
  return t||'💚';
}
function showFamily(){
  const rows=G.pets.map((q,i)=>'<button class="fam'+(i===G.cur?' sel':'')+'" data-i="'+i+'"><span class="fe">'+spEmoji(q)+'</span><span class="fn"><b>'+q.name+' '+(q.sex==='m'?'♂':'♀')+'</b><small>'+(q.stage==='egg'?'Œuf':ageText(q).split(' · ')[0])+' · '+spName(q)+'</small></span><span class="fs">'+petStatus(q)+'</span></button>').join('');
  const full=G.pets.length>=MAXP;
  openModal('<h2>Ma famille</h2><div class="famlist">'+rows+'</div>'+
    '<button class="ob" id="addEgg"'+(full?' disabled':'')+'>🥚 Ajouter un œuf'+(full?' (maximum '+MAXP+')':'')+'</button>'+
    '<button class="ob alt" id="breed">💕 Faire un bébé</button><button class="ob alt" id="x">Retour</button>');
  ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{audio();SFX.pop();switchTo(+b.dataset.i);});
  $('addEgg').onclick=()=>{if(full)return;audio();closeModal();showPick();};
  $('breed').onclick=()=>{audio();showBreed();};
  $('x').onclick=closeModal;
}
function showBreed(){
  const al=G.pets.filter(q=>q.stage==='adult');
  const pairs=[];
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];if(a.sex!==b.sex)pairs.push(a.sex==='f'?[a,b]:[b,a]);}
  const full=G.pets.length>=MAXP;
  let h='<h2>Faire un bébé</h2><p class="muted">Il faut une fille et un garçon, tous les deux adultes. Le bébé peut hériter des deux espèces : un dragon et une licorne donnent un « dragon-licorne » !</p>';
  if(!pairs.length)h+='<div class="detail"><p>Pas encore de couple possible : il te faut un adulte ♀ et un adulte ♂ (même d’espèces différentes).</p></div>';
  else h+='<div class="famlist">'+pairs.map((p,i)=>{const w=Math.max(breedWait(p[0]),breedWait(p[1]));return '<button class="fam" data-p="'+i+'"'+((w||full)?' disabled':'')+'><span class="fe">'+spEmoji(p[0])+'💕'+spEmoji(p[1])+'</span><span class="fn"><b>'+p[0].name+' ♀ + '+p[1].name+' ♂</b><small>'+(full?'Plus de place dans la famille':w?'Ils se reposent encore '+Math.ceil(w/3600000)+' h':'Prêts !')+'</small></span></button>';}).join('')+'</div>';
  openModal(h+'<button class="ob alt" id="x">Retour</button>');
  ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{audio();const p=pairs[+b.dataset.p];showBirth(p[0],p[1]);});
  $('x').onclick=showFamily;
}
function showBirth(a,b){
  const gene=q=>q.species2!=null&&Math.random()<.5?q.species2:q.species;
  let g1,g2;
  if(Math.random()<.2){const par=Math.random()<.5?a:b;g1=gene(par);g2=gene(par);}else{g1=gene(a);g2=gene(b);}
  if(Math.random()<.5){const t=g1;g1=g2;g2=t;}
  const sp2=g2!==g1?g2:null,sex=Math.random()<.5?'f':'m';
  const dflt=sp2!=null?hybridName(g1,g2):SPECIES[g1].name;
  const nm=sp2!=null?hybridName(g1,g2)+' ('+SPECIES[g1].name+' × '+SPECIES[g2].name+')':SPECIES[g1].name;
  openModal('<div class="big">🥚</div><h2>Un œuf est apparu !</h2><p>'+a.name+' et '+b.name+' ont un œuf : '+(sp2!=null?SPECIES[g1].emoji+SPECIES[g2].emoji:SPECIES[g1].emoji)+' <b>'+nm+'</b> ('+(sex==='f'?'♀ fille':'♂ garçon')+')</p><input class="nm" id="nameIn" maxlength="12" value="'+dflt+'" aria-label="Prénom"><button class="ob" id="ok">Accueillir l’œuf</button>');
  $('ok').onclick=()=>{
    audio();const now=Date.now();
    a.lastBreed=b.lastBreed=now;a.happy=b.happy=4;
    const q=newPet(now,g1,$('nameIn').value.trim()||dflt,sex,sp2);
    save();addPet(q);G.tuto=true;save();closeModal();refresh();SFX.hatch();
    toast('🥚 Un nouvel œuf ! Il éclot bientôt.',4000);storeAlerts();
  };
}
function showEnd(){
  P.shown=true;
  const gone=P.stage==='gone';
  G.graves.unshift({name:P.name,species:P.species,days:Math.floor(P.ageMin/1440),cause:P.cause,form:P.form2||P.form,gone:gone});
  G.graves=G.graves.slice(0,20);save();
  openModal('<div class="big">'+(gone?'🌠':'🕯️')+'</div><h2>'+(gone?P.name+' s’en va':P.name+' nous a quittés')+'</h2><p>'+P.cause+'.</p><p class="muted">Il a vécu '+Math.floor(P.ageMin/1440)+' jour(s) et '+Math.floor((P.ageMin%1440)/60)+' heure(s).</p><button class="ob" id="again">'+(G.pets.length>1?'Continuer':'Un nouvel œuf')+'</button>');
  $('again').onclick=()=>{closeModal();removeCur(false);};
}
/* ---------- actions ---------- */
function eatFx(len){fx={t:0,len:len||70,food:true};}
function doFeed(kind){
  audio();
  const f=FOODS[kind];
  if(!f.free&&!(G.inv[kind]>0)){SFX.no();return;}
  const r=feed(P,kind,Date.now());
  if(!r.ok){SFX.no();closeModal();toast(r.msg);return;}
  if(!f.free)G.inv[kind]--;
  SFX.eat();closeModal();eatFx();toast(f.ic+' '+(kind==='snack'||kind==='candy'?'Miam, ça fait plaisir !':'Miam !'));
  save();refresh();storeAlerts();
}
function showFeed(){
  const e=canAct(P);if(e){SFX.no();return toast(e);}
  const ids=Object.keys(FOODS).filter(k=>FOODS[k].free||G.inv[k]>0);
  openModal('<h2>Manger</h2><div class="tiles">'+ids.map(k=>'<button class="tile" data-f="'+k+'"><span class="ic">'+FOODS[k].ic+'</span><span class="nm">'+FOODS[k].name+'</span><span class="pr">'+(FOODS[k].free?'Gratuit':'× '+G.inv[k])+'</span></button>').join('')+'</div><p class="muted">Repas : +1 faim · Friandise : +1 joie (mais ça fait grossir). Tu peux acheter d’autres plats à la boutique.</p><button class="ob alt" id="x">Retour</button>');
  ov.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>doFeed(b.dataset.f));$('x').onclick=closeModal;
}
function endGame(title,gems,happy,extra){
  G.wallet+=gems;reward(P,happy,1);save();refresh();
  if(gems>0)SFX.win();else SFX.lose();
  fx={t:0,len:90,hearts:gems>0,happy:gems>0};
  openModal('<div class="big">'+(gems>0?'🎉':'😅')+'</div><h2>'+title+'</h2><p class="score">+'+gems+' 💎</p>'+(extra?'<p class="muted">'+extra+'</p>':'')+'<button class="ob" id="again">Rejouer</button><button class="ob alt" id="x">Terminer</button>');
  return {again:$('again'),close:$('x')};
}
/* jeu 1 : pierre feuille ciseaux */
function gPfc(){
  let me=0,pe=0,round=0;const H=['✊','✋','✌️'];
  const draw=(res)=>{
    openModal('<h2>Pierre, feuille, ciseaux</h2><p class="score">Toi '+me+' – '+pe+' '+P.name+'</p>'+
      (res?'<div class="vs"><span>'+H[res.m]+'</span><span>'+H[res.b]+'</span></div><p>'+res.txt+'</p>':'<div class="vs"><span>❔</span><span>❔</span></div><p class="muted">Premier à 2 manches.</p>')+
      '<div class="hands">'+H.map((h,i)=>'<button class="hb" data-h="'+i+'" '+(res&&res.over?'disabled':'')+'>'+h+'</button>').join('')+'</div>');
    ov.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{
      const m=+b.dataset.h,bo=(Math.random()*3)|0,o=(m===bo)?0:(((m-bo+3)%3)===1?1:-1);
      let txt='Égalité, on recommence !';if(o>0){me++;txt='Tu gagnes la manche !';SFX.ok();}else if(o<0){pe++;txt=P.name+' gagne la manche.';SFX.no();}
      const over=me>=2||pe>=2;draw({m:m,b:bo,txt:txt,over:over});
      if(over)setTimeout(()=>{const g=endGame(me>=2?'Bravo, tu gagnes !':P.name+' gagne !',me>=2?8:2,me>=2?1:.5);g.again.onclick=gPfc;g.close.onclick=closeModal;},1300);
    });
  };
  draw(null);
}
/* jeu 2 : gauche ou droite */
function gDir(){
  let wins=0,round=0;const N=5;
  const draw=(res)=>{
    openModal('<h2>Gauche ou droite ?</h2><p class="score">Manche '+Math.min(N,round+(res?0:1))+' / '+N+' · '+wins+' bonne(s)</p>'+
      '<div class="vs"><span>'+(res?(res.b?'👉':'👈'):'🤔')+'</span></div><p>'+(res?(res.ok?'Bien vu !':'Raté !'):P.name+' va regarder d’un côté. Devine lequel !')+'</p>'+
      '<div class="hands"><button class="hb" data-d="0" '+(res&&res.over?'disabled':'')+'>👈</button><button class="hb" data-d="1" '+(res&&res.over?'disabled':'')+'>👉</button></div>');
    ov.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      const d=+b.dataset.d,bo=(Math.random()*2)|0,ok=d===bo;round++;if(ok){wins++;SFX.ok();}else SFX.no();
      const over=round>=N;draw({b:bo,ok:ok,over:over});
      if(over)setTimeout(()=>{const g=endGame(wins>=3?'Bien joué !':'Pas cette fois…',wins>=3?8:wins>=2?3:0,wins>=3?1:.5,wins+' bonne(s) réponse(s) sur '+N);g.again.onclick=gDir;g.close.onclick=closeModal;},1100);
      else setTimeout(()=>{if(!ov.hidden)draw(null);},900);
    });
  };
  draw(null);
}
/* jeu 3 : étoiles filantes */
let mini=null;
function miniStop(){if(mini){cancelAnimationFrame(mini.raf);mini=null;}}
function gStar(){
  openModal('<h2>Étoiles filantes</h2><p class="muted">Touche les étoiles dorées avant qu’elles tombent ! 20 secondes.</p><canvas class="mini" id="mc" width="256" height="160"></canvas><p class="score" id="ms">0 ⭐</p>');
  const c=$('mc'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
  const st=[],t0=performance.now();let score=0,last=0,over=false;
  mini={raf:0};
  const spawn=()=>st.push({x:10+Math.random()*226,y:-10,v:.5+Math.random()*.9,k:Math.random()<.18?'bad':'ok',r:9});
  c.addEventListener('pointerdown',e=>{
    const b=c.getBoundingClientRect(),px=(e.clientX-b.left)*256/b.width,py=(e.clientY-b.top)*160/b.height;
    for(let i=st.length-1;i>=0;i--){const s=st[i];if(Math.hypot(px-s.x,py-s.y)<s.r+7){if(s.k==='ok'){score++;SFX.pop();}else{score=Math.max(0,score-2);SFX.no();}st.splice(i,1);break;}}
    $('ms').textContent=score+' ⭐';
  });
  const loop=(now)=>{
    if(!mini)return;
    mini.raf=requestAnimationFrame(loop);
    const el=(now-t0)/1000;
    if(el>=20&&!over){over=true;miniStop();const g=endGame(score>=12?'Quelle collection !':'Joli score !',Math.min(15,Math.round(score*.7)),score>=10?1:.5,score+' étoiles attrapées');g.again.onclick=gStar;g.close.onclick=closeModal;return;}
    if(now-last>(700-el*14)){last=now;spawn();}
    x.fillStyle='#0a0518';x.fillRect(0,0,256,160);
    for(let i=0;i<30;i++){x.fillStyle='#4a3a8a';x.fillRect((i*47)%256,(i*31+el*10)%160,1,1);}
    for(let i=st.length-1;i>=0;i--){const s=st[i];s.y+=s.v*(1+el/25);if(s.y>170)st.splice(i,1);
      x.fillStyle=s.k==='ok'?'#ffd84a':'#8f5bd6';x.fillRect(s.x-2,s.y-9,4,18);x.fillRect(s.x-9,s.y-2,18,4);x.fillRect(s.x-6,s.y-6,12,12);x.fillStyle=s.k==='ok'?'#fff3b0':'#c9a8f0';x.fillRect(s.x-3,s.y-3,6,6);}
    x.fillStyle='#ff6fb5';x.fillRect(0,0,256*(1-el/20),3);
  };
  mini.raf=requestAnimationFrame(loop);
}
/* boutique */
let shopTab='food',shopSub='hat',shopSel=null;
const SUBS={pet:['hat','face','neck','side'],room:['bg','floor','wall','left']};
function shopList(tab,sub){

  return Object.keys(ITEMS).filter(k=>ITEMS[k].kind===sub).map(k=>({id:k,ic:ITEMS[k].ic,name:ITEMS[k].name,price:ITEMS[k].price,long:'Une fois acheté, mets-le dans « Habiller » ('+KINDS[sub].toLowerCase()+').',have:()=>G.owned.includes(k)?1:0,food:false}));
}
function showShop(){
  if(shopTab==='pet'&&!SUBS.pet.includes(shopSub))shopSub='hat';
  if(shopTab==='room'&&!SUBS.room.includes(shopSub))shopSub='bg';
  const list=shopList(shopTab,shopSub);if(!list.find(x=>x.id===shopSel))shopSel=list[0].id;
  const it=list.find(x=>x.id===shopSel),have=it.have(),owned=!it.food&&have>0,poor=G.wallet<it.price;
  const T=(k,l)=>'<button data-t="'+k+'" class="'+(shopTab===k?'on':'')+'">'+l+'</button>';
  const subs=SUBS[shopTab]?'<div class="chips">'+SUBS[shopTab].map(k=>'<button data-sub="'+k+'" class="'+(shopSub===k?'on':'')+'">'+KINDS[k]+'</button>').join('')+'</div>':'';
  openModal('<h2>Boutique</h2><p class="wallet"><b style="font-size:30px;color:var(--gold)">'+G.wallet+'</b> 💎 en poche</p>'+
    '<div class="tabs">'+T('food','Repas')+T('pet','Habits')+T('room','Pièce')+T('eggs','Œufs')+'</div>'+subs+
    '<div class="tiles">'+list.map(x=>'<button class="tile'+(x.id===shopSel?' sel':'')+(!x.food&&x.have()?' done':'')+'" data-s="'+x.id+'"><span class="ic">'+x.ic+'</span><span class="nm">'+x.name+'</span><span class="pr">'+(!x.food&&x.have()?'✔ Acheté':x.price+' 💎')+'</span></button>').join('')+'</div>'+
    '<div class="detail"><h3>'+it.ic+' '+it.name+(it.food?' <small class="muted">(tu en as '+have+')</small>':'')+'</h3><p>'+it.long+'</p></div>'+
    '<button class="ob" id="buy" '+((owned||poor)?'disabled':'')+'>'+(owned?'Déjà acheté':poor?'Pas assez de gemmes ('+it.price+' 💎)':'Acheter · '+it.price+' 💎')+'</button><button class="ob alt" id="x">Retour</button>');
  ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.t;shopSel=null;showShop();});
  ov.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{shopSub=b.dataset.sub;shopSel=null;showShop();});
  ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{shopSel=b.dataset.s;showShop();});
  $('x').onclick=closeModal;
  $('buy').onclick=()=>{if(owned||poor)return;audio();G.wallet-=it.price;if(it.food)G.inv[it.id]=(G.inv[it.id]|0)+1;else G.owned.push(it.id);SFX.ok();save();refresh();showShop();};
}
function showWear(){
  const tile=(k,kind)=>'<button class="tile'+(getWear(kind)===k?' sel':'')+'" data-w="'+kind+':'+k+'"><span class="ic">'+(k?ITEMS[k].ic:'🚫')+'</span><span class="nm">'+(k?ITEMS[k].name:'Rien')+'</span></button>';
  let h='<h2>Habiller</h2>';
  for(const kind of Object.keys(KINDS)){
    const own=G.owned.filter(k=>ITEMS[k]&&ITEMS[k].kind===kind);
    if(!own.length)continue;
    h+='<h3 class="sec">'+KINDS[kind]+'</h3><div class="tiles">'+tile('',kind)+own.map(k=>tile(k,kind)).join('')+'</div>';
  }
  if(!G.owned.some(k=>ITEMS[k]&&ITEMS[k].kind!=='egg'))h+='<p class="muted">Tu n’as encore rien acheté. Va faire un tour à la boutique !</p>';
  openModal(h+'<button class="ob alt" id="x">Retour</button>');
  ov.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const [kind,k]=b.dataset.w.split(':');if(PETK.includes(kind))P.outfit[kind]=k||null;else G.wear[kind]=k||null;for(const q of G.pets)syncWear(q);SFX.pop();save();showWear();});$('x').onclick=closeModal;
}
function showInfo(){
  const care=P.miss<=1?'Excellente':P.miss<=4?'Bonne':'À améliorer';
  const rows=P.log.slice(-12).reverse().map(l=>{const d=new Date(l.t);return '<div>'+('0'+d.getHours()).slice(-2)+'h'+('0'+d.getMinutes()).slice(-2)+' · '+l.txt+'</div>';}).join('')||'<div class="muted">Rien à signaler pour l’instant.</div>';
  const gr=G.graves.slice(0,5).map(g=>'<div>'+SPECIES[g.species].emoji+' '+g.name+' · '+g.days+' j '+(g.gone?'🌠':'🕯️')+'</div>').join('');
  openModal('<h2>'+P.name+'</h2><div class="detail"><p>'+spEmoji(P)+' '+spName(P)+' · '+(P.sex==='m'?'♂ garçon':'♀ fille')+' · '+ageText(P)+'</p><p>⚖️ Poids : '+P.weight+' g (idéal ≈ '+idealWeight(P)+' g)</p><p>🩺 Attention portée : <b>'+care+'</b> ('+P.miss+' appel(s) manqué(s))</p></div><h3 style="margin:0;color:var(--gold)">Journal</h3><div class="log">'+rows+'</div>'+(gr?'<h3 style="margin:0;color:var(--gold)">Souvenirs</h3><div class="log">'+gr+'</div>':'')+'<button class="ob" id="x">Retour</button>');
  $('x').onclick=closeModal;
}
/* menu */
function showMenu(){
  const nt=('Notification'in window)?(Notification.permission==='granted'&&G.notif?'Activées':'Désactivées'):'Non disponibles';
  openModal('<h2>Menu</h2><button class="sw" id="sound"><span>Son</span><span>'+(G.muted?'🔇 Coupé':'🔊 Activé')+'</span></button><button class="sw" id="mus"><span>Musique</span><span>'+((G.music==='off'||!G.music)?'🔇 Aucune':G.music==='auto'?'🎵 Auto':TRACKS[G.music].ic+' '+TRACKS[G.music].name)+'</span></button><button class="sw" id="notif"><span>Notifications</span><span>'+nt+'</span></button><p class="muted" style="max-width:340px">Les notifications fonctionnent quand l’appli est installée sur l’écran d’accueil (Android surtout). Sur iPhone, elles sont limitées.</p><button class="ob alt" id="newp">Recommencer avec un nouvel œuf</button><button class="ob" id="x">Retour au jeu</button>');
  $('x').onclick=closeModal;
  $('sound').onclick=()=>{G.muted=!G.muted;save();audio();musStart();showMenu();};
  $('mus').onclick=showMusic;
  $('notif').onclick=async()=>{
    if(!('Notification'in window)){toast('Pas disponible sur cet appareil');return;}
    try{const r=Notification.permission==='granted'?'granted':await Notification.requestPermission();G.notif=r==='granted'&&!G.notif;if(r==='granted'&&G.notif){registerSync();new Notification('Notifications activées',{body:P.name+' te préviendra quand il aura besoin de toi.'});}}catch(e){}
    save();showMenu();
  };
  $('newp').onclick=()=>{openModal('<h2>Recommencer ?</h2><p>'+P.name+' va partir vivre ailleurs et tu choisiras un nouvel œuf. Tes gemmes et tes objets sont gardés.</p><button class="ob" id="y">Oui, nouvel œuf</button><button class="ob alt" id="n">Non, je garde</button>');
    $('n').onclick=closeModal;$('y').onclick=()=>{if(P.stage!=='dead'&&P.stage!=='gone')G.graves.unshift({name:P.name,species:P.species,days:Math.floor(P.ageMin/1440),cause:'Parti vivre ailleurs',gone:true});closeModal();removeCur(true);};};
}
/* ---------- notifications (mieux que rien) ---------- */
const notified=new Set();
function alertList(){return G.pets.flatMap(q=>nextAlerts(q,Date.now()));}
function notifyDue(){
  if(!G.notif||!('Notification'in window)||Notification.permission!=='granted'||!document.hidden)return;
  const now=Date.now();
  for(const a of alertList())if(a.t<=now+30000&&!notified.has(a.tag+'|'+Math.floor(a.t/3600000))){
    notified.add(a.tag+'|'+Math.floor(a.t/3600000));
    try{navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.showNotification(a.title,{body:a.body,tag:a.tag,icon:'icons/icon-192.png'}));}catch(e){}
  }
}
function storeAlerts(){
  if(!G.notif||!window.caches)return;
  try{caches.open('tama-alerts').then(c=>c.put('alerts.json',new Response(JSON.stringify({alerts:alertList(),shown:[]}))));}catch(e){}
}
async function registerSync(){
  try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.register('tama-check',{minInterval:60*60*1000});}catch(e){}
}
/* ---------- branchements ---------- */
$('acts').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!P)return;audio();
  if(P.stage==='dead'||P.stage==='gone')return;
  const a=b.dataset.a;
  if(a==='feed')showFeed();
  else if(a==='play')showPlay();
  else if(a==='light'){if(P.stage==='egg'){SFX.no();return toast('Il est encore dans son œuf…');}toggleLight(P);SFX.pop();toast(P.light?'Lumière allumée':'Lumière éteinte');save();refresh();}
  else if(a==='clean'){if(clean(P)){SFX.ok();toast('🧹 Tout propre !');fx={t:0,len:40,happy:true};save();refresh();}else{SFX.no();toast('Rien à nettoyer.');}}
  else if(a==='med'){const r=medicine(P);if(!r.ok){SFX.no();toast(r.msg);}else{SFX.ok();toast(r.cured?'💊 Guéri !':'💊 Encore une dose pour guérir…');if(r.cured)fx={t:0,len:80,hearts:true,happy:true};save();refresh();}}
  else if(a==='shop'){showShop();}
  else if(a==='wear'){showWear();}
  else if(a==='info'){showInfo();}
});
$('famBtn').onclick=()=>{audio();if(P)showFamily();};
$('menuBtn').onclick=()=>{audio();if(P)showMenu();};
cv.addEventListener('pointerdown',()=>{audio();if(P&&P.stage!=='egg'&&!P.asleep&&P.stage!=='dead'&&P.stage!=='gone'){fx={t:0,len:50,hearts:true,happy:true};SFX.pop();}});
/* démarrage */
(function start(){
  try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  requestAnimationFrame(frame);
  if(!P){showPick();return;}
  const was=P.last,nlog=P.log.length;
  syncWear(P);
  for(const q of G.pets)if(q!==P)advance(q,Date.now());
  advance(P,Date.now());
  const day=new Date().toDateString();
  if(G.lastDaily!==day){G.lastDaily=day;G.wallet+=3;setTimeout(()=>toast('🎁 Cadeau du jour : +3 💎',3000),600);}
  refresh();save();storeAlerts();
  if(P.stage==='dead'||P.stage==='gone'){showEnd();return;}
  const news=P.log.filter(l=>l.t>was);
  if(Date.now()-was>20*60000&&news.length){
    openModal('<h2>Pendant ton absence…</h2><div class="log">'+news.slice(-10).map(l=>{const d=new Date(l.t);return '<div>'+('0'+d.getHours()).slice(-2)+'h'+('0'+d.getMinutes()).slice(-2)+' · '+l.txt+'</div>';}).join('')+'</div><button class="ob" id="x">C’est parti</button>');$('x').onclick=closeModal;
  }
})();

</script>
